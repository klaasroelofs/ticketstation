COM_TICKETSTATION="Ticketstation"
COM_TICKETSTATION_ACTION_OPTIONS="Configuratie"
COM_TICKETSTATION_ACTION_OPTIONS_DESC="Gebruikers in de groep mogen de Configuratie, de Mollie-instellingen (inclusief de API-sleutels) en de berichtsjablonen wijzigen."
COM_TICKETSTATION_ACTION_BOXOFFICE="Kassa"
COM_TICKETSTATION_ACTION_BOXOFFICE_DESC="Gebruikers in de groep mogen bestellingen en klanten bekijken, tickets, facturen en betaalverzoeken opnieuw sturen, opmerkingen toevoegen, de scanstatus wijzigen, tickets blokkeren en de wachtlijst beheren."
COM_TICKETSTATION_ACTION_RESERVE="Reserveringen maken"
COM_TICKETSTATION_ACTION_RESERVE_DESC="Gebruikers in de groep mogen in de backend reserveringen maken. Een reservering als betaald opslaan vraagt ook de permissie Betalingen registreren."
COM_TICKETSTATION_ACTION_PAYMENT="Betalingen registreren"
COM_TICKETSTATION_ACTION_PAYMENT_DESC="Gebruikers in de groep mogen de betaalstatus van een bestelling met de hand wijzigen (betaald, niet betaald, terugbetaald) en bestellingen afronden. Een bestelling op betaald zetten verstuurt de tickets."
COM_TICKETSTATION_ACTION_ORDER_DELETE="Bestellingen en klanten verwijderen"
COM_TICKETSTATION_ACTION_ORDER_DELETE_DESC="Gebruikers in de groep mogen bestellingen (met transactie, opmerkingen en factuur) en klanten definitief verwijderen."
COM_TICKETSTATION_ACTION_FINANCE="Financiën"
COM_TICKETSTATION_ACTION_FINANCE_DESC="Gebruikers in de groep mogen transacties en facturen bekijken."
COM_TICKETSTATION_ACTION_SCANNERS="Scanners"
COM_TICKETSTATION_ACTION_SCANNERS_DESC="Gebruikers in de groep mogen scanners koppelen aan gebruikers, evenementen en tickets, en hun API-sleutels beheren."
