COM_TICKETSTATION_CURRENCY="Valuta van de website"
COM_TICKETSTATION_CURRENCY_DESC="Het valutasymbool of de code die naast prijzen staat op de site, tickets en facturen, bijv. &euro; of EUR. De valuta waarin klanten betalen stel je in bij Betalingen."
COM_TICKETSTATION_DATEFORMAT="Datumnotatie"
COM_TICKETSTATION_DATEFORMAT_DESC="Hoe datums worden getoond in de backend, in mails, op tickets en op facturen. Kies een suggestie uit de lijst (de voorbeelden tonen 14 maart 2026) of typ een eigen PHP-datumnotatie: <code>d</code> dag met voorloopnul, <code>j</code> dag, <code>m</code> maand met voorloopnul, <code>n</code> maand, <code>Y</code> jaar met vier cijfers, <code>y</code> met twee. Elk ander teken, zoals <code>-</code>, <code>/</code> of <code>.</code>, wordt getoond zoals je het typt."
COM_TICKETSTATION_TIMEFORMAT="Tijdnotatie"
COM_TICKETSTATION_TIMEFORMAT_DESC="Hoe tijden worden getoond in de backend en op wallet-passes. Kies een suggestie uit de lijst (de voorbeelden tonen vijf over negen 's ochtends) of typ een eigen PHP-tijdnotatie: <code>H</code> uren 00-23, <code>G</code> uren 0-23, <code>h</code> en <code>g</code> hetzelfde op een 12-uursklok, <code>i</code> minuten, <code>s</code> seconden, <code>A</code> AM of PM."
COM_TICKETSTATION_FORMAT_CURRENT="%s (huidige instelling)"
COM_TICKETSTATION_PRICES="Prijsnotatie"
COM_TICKETSTATION_PRICES_DESC="Hoe prijzen op de website, in mails, op tickets, op facturen en in de backend worden getoond. Stel het aantal decimalen, het decimaalteken, de duizendtalscheiding en de plaats van het valutasymbool in; het voorbeeld onder de velden past zich direct aan. Kies <em>Alleen indien nodig</em> om 12 in plaats van 12,00 te tonen bij ronde bedragen, of <em>geen decimalen</em> voor valuta zonder decimalen. Het decimaalteken en de duizendtalscheiding moeten verschillen."
COM_TICKETSTATION_SHOW_AVAILABILITY="Beschikbaarheidsbalk op ticketpagina"
COM_TICKETSTATION_SHOW_AVAILABILITY_DESC="Toon de beschikbaarheidsbalk (percentage resterende tickets) op de ticketpagina van evenementen zonder stoelnummers."
COM_TICKETSTATION_SHOW_QUANTITY="Resterende tickets in evenementenlijst"
COM_TICKETSTATION_SHOW_QUANTITY_DESC="Toon het aantal resterende tickets in de lijst met komende evenementen, voor evenementen met en zonder stoelnummers."
COM_TICKETSTATION_SHOW_PRICE_EVENT="Prijzen in evenementenlijst"
COM_TICKETSTATION_SHOW_PRICE_EVENT_DESC="Toon de prijzen van je tickets in de evenementenlijst."
COM_TICKETSTATION_SHOW_VENUE="Locatie tonen"
COM_TICKETSTATION_SHOW_VENUE_DESC="Toon de locatieregel (locatie en plaats) in de lijst met komende evenementen en op de ticketpagina's van evenementen met en zonder stoelnummers."
COM_TICKETSTATION_SHOW_VENUE_ADDRESS="Adres van locatie tonen"
COM_TICKETSTATION_SHOW_VENUE_ADDRESS_DESC="Toon straat en postcode van de locatie onder de locatieregel op de ticketpagina's van evenementen met en zonder stoelnummers. Werkt alleen als Locatie tonen aan staat."
COM_TICKETSTATION_SHOW_VENUE_DESCRIPTION="Beschrijving van locatie tonen"
COM_TICKETSTATION_SHOW_VENUE_DESCRIPTION_DESC="Toon de beschrijving van de locatie op de ticketpagina's van evenementen met en zonder stoelnummers. Werkt alleen als Locatie tonen aan staat."
COM_TICKETSTATION_SHOW_VENUE_WEBSITE="Website van locatie tonen"
COM_TICKETSTATION_SHOW_VENUE_WEBSITE_DESC="Toon een link naar de website van de locatie op de ticketpagina's van evenementen met en zonder stoelnummers. Werkt alleen als Locatie tonen aan staat."
COM_TICKETSTATION_SHOW_JSONLD="Gegevens voor zoekmachines"
COM_TICKETSTATION_SHOW_JSONLD_DESC="Voeg machineleesbare evenementgegevens (schema.org JSON-LD) toe aan de evenementenlijst, de ticketpagina's en de zaalplanpagina's, zodat zoekmachines datum, locatie en prijs kunnen tonen. Zet dit uit op een test- of stagingsite, zodat de evenementen daar niet in zoekresultaten terechtkomen. Zoekmachines kunnen de pagina's zelf dan nog wel indexeren."
COM_TICKETSTATION_VENUE_INTERNAL_CONTACT="Interne contactgegevens"
COM_TICKETSTATION_VENUE_INTERNAL_CONTACT_DESC="Deze gegevens zijn voor je eigen administratie en worden nooit aan bezoekers getoond."
COM_TICKETSTATION_SHOW_COUPON_SYSTEM="Kortingscodes gebruiken"
COM_TICKETSTATION_SHOW_REMARKS_IN_CART="Opmerkingen in winkelmand tonen"
COM_TICKETSTATION_SHOW_REMARKS_IN_CART_DESC="In het overzicht van de bestelling (winkelmand) kan de klant een opmerking bij de bestelling plaatsen, bijvoorbeeld speciale wensen. Handig voor bijvoorbeeld een diner, waar mensen informatie over hun dieet kunnen doorgeven.<br/>De opmerking staat bij de bestelling in de Box Office (als <em>Opmerking klant</em>) en wordt niet op de tickets geprint."
COM_TICKETSTATION_CUSTOMER_NOTE="Opmerking klant"
COM_TICKETSTATION_SHOW_WAITING_LIST="Wachtlijst actief"
COM_TICKETSTATION_SHOW_WAITING_LIST_SEATPLAN_DISCLAIMER="Werkt op dit moment alleen voor tickets zonder zaalplan (tickets met een teller/aantal). Tickets met stoelkeuze hebben geen wachtlijst en vallen buiten deze instelling."
COM_TICKETSTATION_REMOVAL_SETTINGS="Opschonen van tickets"
COM_TICKETSTATION_AUTO_REMOVE="Onafgeronde en openstaande tickets automatisch verwijderen"
COM_TICKETSTATION_AUTO_REMOVE_DESC="Om de beschikbare tickets actueel te houden, moeten onbetaalde tickets uit de database worden verwijderd."
COM_TICKETSTATION_REMOVE_AFTER_X_DAYS="Onbetaalde/openstaande bestellingen verwijderen na"
COM_TICKETSTATION_REMOVE_AFTER_X_DAYS_DESC="Een bestelling krijgt de status 'In afwachting' zolang de betaling nog niet binnen is. Bijvoorbeeld wanneer er een betaallink is verstuurd of een betaalmethode zoals een bankoverschrijving is gekozen."
COM_TICKETSTATION_AUTO_REMOVE_AFTER_X_HOURS="Onafgeronde bestellingen verwijderen na"
COM_TICKETSTATION_AUTO_REMOVE_AFTER_X_HOURS_DESC="Een bestelling is onafgerond zolang die niet betaald is en de klantgegevens nog niet zijn ingevuld: er zijn tickets in de winkelmand gelegd, maar de klant is nooit verder gegaan.<br/>Aanbevolen: 30 minuten / 1 uur."
COM_TICKETSTATION_PAYMENT_SETTINGS="Betaalinstellingen"
COM_TICKETSTATION_VARIABLE="Variabel"
COM_TICKETSTATION_FIXED="Vast"
COM_TICKETSTATION_FIXED_AND_VARIABLE="Vast en variabel"
COM_TICKETSTATION_NONE="Geen"
COM_TICKETSTATION_VAR_TRANSACTION_COSTS="Servicekosten"
COM_TICKETSTATION_VAR_TRANSACTION_COSTS_DESC="Wat klanten per bestelling bovenop de tickets betalen. Kies je 'Variabel', vul dan een percentage in bij 'Variabele servicekosten'. Kies je 'Vast', vul dan 'Vaste servicekosten' in. Bij 'Vast en variabel' betaalt de klant het percentage van 'Variabele servicekosten' plus het bedrag van 'Vaste servicekosten'. Bij 'Geen' worden geen servicekosten berekend of aan klanten getoond. Een bestelling houdt de servicekosten waarmee ze is geplaatst."
COM_TICKETSTATION_VAR_COSTS="Variabele servicekosten"
COM_TICKETSTATION_VAR_COSTS_DESC="Vul hier een percentage in. De servicekosten zijn dan x% van het totaalbedrag van de bestelling na een eventuele korting."
COM_TICKETSTATION_TRANSACTION_COSTS="Vaste servicekosten"
