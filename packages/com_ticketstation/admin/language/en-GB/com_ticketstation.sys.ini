; Permissions (access.xml)
COM_TICKETSTATION="Ticketstation"
COM_TICKETSTATION_ACTION_OPTIONS="Configuration"
COM_TICKETSTATION_ACTION_OPTIONS_DESC="Allows users in the group to change the Configuration, the Mollie settings (including the API keys) and the message templates."
COM_TICKETSTATION_ACTION_BOXOFFICE="Box Office"
COM_TICKETSTATION_ACTION_BOXOFFICE_DESC="Allows users in the group to view orders and customers, resend tickets, invoices and payment requests, add remarks, change scan states, block tickets and manage the waiting list."
COM_TICKETSTATION_ACTION_RESERVE="Make reservations"
COM_TICKETSTATION_ACTION_RESERVE_DESC="Allows users in the group to make reservations in the backend. Saving a reservation as paid also needs the Register payments permission."
COM_TICKETSTATION_ACTION_PAYMENT="Register payments"
COM_TICKETSTATION_ACTION_PAYMENT_DESC="Allows users in the group to change an order's payment status by hand (paid, not paid, refunded) and to complete orders. Marking an order paid sends its tickets."
COM_TICKETSTATION_ACTION_ORDER_DELETE="Delete orders and customers"
COM_TICKETSTATION_ACTION_ORDER_DELETE_DESC="Allows users in the group to delete orders (with their transaction, remarks and invoice) and customers for good."
COM_TICKETSTATION_ACTION_FINANCE="Finance"
COM_TICKETSTATION_ACTION_FINANCE_DESC="Allows users in the group to view transactions and invoices."
COM_TICKETSTATION_ACTION_SCANNERS="Scanners"
COM_TICKETSTATION_ACTION_SCANNERS_DESC="Allows users in the group to link scanners to users, events and tickets, and to manage their API keys."
COM_TICKETSTATION_ACTION_TESTSHOP="Order in test mode"
COM_TICKETSTATION_ACTION_TESTSHOP_DESC="Allows users in the group to see the tickets and order on the website while the shop is in test mode. Without it the shop is closed to them, so customers with an account can't place orders that are only tests."
