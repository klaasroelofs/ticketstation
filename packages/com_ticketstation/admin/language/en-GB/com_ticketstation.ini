COM_TICKETSTATION_EVENTS_DOCS_TITLE="Setting up events and tickets"
COM_TICKETSTATION_EVENTS_DOCS_INTRO="Every sale is built from two linked records: an <strong>Event</strong> holds the shared, event-level information (name, event code, date, an optional automatic publish/unpublish window, description, background image). It has no price or stock of its own. A <strong>Ticket</strong> is what actually gets sold: it has its own price, VAT percentage, stock, sale window, min/max order quantity, scanning setting and print/eTicket design, and is always linked to one event."
COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_TITLE="Creating an ordinary event with tickets"
COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_1="Create the <strong>Event</strong> first: name, a short event code and the event date. A description, a background image and <em>Automatically (un)publish event</em> are optional. The description and background image appear in the ticket overview and at the top of the ticket page and the seat chart page (a ticket's own background image, when it has one, takes precedence over the event's). <em>Automatically (un)publish event</em> publishes the event at the first date and unpublishes it after the second; in between, unpublishing it by hand is undone again. Like the sale window of a ticket (step 4) it only works while the automatic cleanup is on. An unpublished event whose publish date is less than a month away is shown in the ticket overview under <em>Upcoming events</em>, with a countdown to the start of the sale."
COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_2="Create a <strong>Ticket</strong>, select the event (and a venue, if applicable), then set its <em>Capacity</em>: the number of tickets that can be sold. Availability is never counted down separately: everything that shows or checks it (the upcoming-events list, the availability bar, the purchase check, the backend ticket list, the reservation tool and the control panel) takes the capacity minus the tickets in orders, paid or not. Tickets of an order that expires or is deleted become available again automatically, because the order disappears; with the waiting list on, they are offered to waiting customers first. A refunded order keeps its tickets until it is deleted. Seated tickets don't use <em>Capacity</em>: their seats are the capacity (see the Seated tickets topic)."
COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_3="Fill in price and VAT, an optional minimum and maximum quantity per order (counted per ticket: with child tickets, each child ticket has its own minimum and maximum, so a maximum of 8 allows 8 adults and 8 children in one order; the ticket page shows it under the ticket), the <em>Start Date &amp; Time</em> and <em>End Date &amp; Time</em> of the performance, and whether the ticket can be scanned at the door (<em>Scanning Allowed</em>). The start is printed on the ticket and sets the order of the ticket overview; after the end the ticket no longer appears on the scanning page and in <strong>New reservation</strong>. Neither date stops the online sale (see the next step)."
COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_4="To start or end the sale automatically, switch on <em>Use Auto Publish</em> (the ticket is published once the <em>Automatic Publish Date</em> has passed) and/or <em>Use Sales Stop</em> (it is unpublished once the <em>Sales Stop &amp; Unpublish Ticket</em> date has passed). <strong>Without a sales stop a published ticket stays on sale after the event has taken place.</strong> Both only work while <em>Automatic removal of unfinished/pending tickets</em> is on (Configuration &raquo; Orders): they run together with that cleanup while the website or the backend is in use, not on a fixed schedule, so the change happens shortly after the set time. Once a date has passed, publishing or unpublishing the ticket by hand against it is undone again; switch the option off first."
COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_5="Leave <em>Parent Ticket</em> empty. A ticket created this way is independent and is sold directly on the frontend as its own product."
COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_6="For a series or a recurring production, select an event in the Events list and click <em>Copy</em> (in the actions menu). The copy gets all tickets of the event, child tickets under their copied parent, with prices, VAT, ticket designs, background images and the seat charts (every seat comes over free, also seats that were sold). Orders and the waiting list are not copied. The event and its tickets are unpublished and automatic publishing is switched off, so adjust the dates, switch it on again if you use it, and publish when you are ready."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_TITLE="Parent and child tickets"
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_WHAT="The ticket form has a <em>Parent Ticket</em> dropdown. Leaving it empty makes the ticket a top-level (&quot;parent&quot;) ticket; selecting an existing parent ticket there makes the ticket you're editing a <strong>child</strong> of it. Only one level of nesting is supported: the dropdown only lists tickets that are themselves parents, so a child can never have children of its own."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_PURPOSE="Use this to group several purchasable variants of the same event or moment under one shared page, for example price tiers (Early Bird / Regular / VIP), age categories (Adult / Child / Senior), or date/seating variants of what is conceptually one ticket type. The storefront link always points at the parent: as long as it has no children, the parent is shown and sold as a normal single product (the ordinary case above). As soon as one or more children exist under it, the storefront automatically shows a list of the children instead, each with its own name, price and Order button; the parent itself stops being directly purchasable and becomes the shared landing page."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_GOTCHAS_TITLE="Things to know before using them"
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_GOTCHA_1="Pricing does not cascade: every child has its own price, VAT and min/max quantity, set independently."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_GOTCHA_2="Capacity is set on the parent, in <em>Capacity of child tickets</em>: <strong>Shared</strong> makes all child tickets sell from the parent's <em>Capacity</em>, used up by all their orders together; <strong>Per child ticket</strong> gives every child its own <em>Capacity</em>, entered on the child. On a child that shares its parent's capacity the field is read-only. The number of tickets left in the upcoming-events list is what is left of the shared capacity, or the total left over all published child tickets."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_GOTCHA_3="A child can still be sold via a direct link, but customers normally only reach it by first landing on the parent's page, since that is the URL that gets shared."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_GOTCHA_4="Scanning at the door is unaffected by the hierarchy: every ticket, parent or child, is validated purely by its own QR code / ticket ID."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_GOTCHA_5="Seating is switched on per ticket (<em>Show Seat Plans?</em>), not per venue. On a seated ticket a child ticket is either a section of the hall (it has seats of its own on the chart) or a price category per person (it has none). See the Seated tickets topic below."
COM_TICKETSTATION_EVENTS_DOCS_SEARCH_TITLE="Events in search engines"
COM_TICKETSTATION_EVENTS_DOCS_SEARCH_WHAT="The events list, the ticket page and the seat-chart page also carry machine-readable event data (schema.org JSON-LD) that you don't see on the page. Search engines such as Google can use it to show the date, venue and price of your events in the search results. You don't need to set anything up: it follows the event, ticket and venue you have already filled in."
COM_TICKETSTATION_EVENTS_DOCS_SEARCH_GOTCHA_1="Every <em>parent</em> ticket is one performance, with its own date, time and venue. Parent tickets of the same event with the same date, time and venue are given as one event with an offer per ticket. Child tickets are the offers of their parent: the price, or the lowest to highest price, that search engines show."
COM_TICKETSTATION_EVENTS_DOCS_SEARCH_GOTCHA_2="Only what the pages show is given. Without <em>Show venue</em> there is no venue in the data (the address and website follow <em>Show venue address</em> and <em>Show venue website</em>), and without <em>Prices in eventlist</em> the events list has no prices. Search engines may then show less, or no extended result."
COM_TICKETSTATION_EVENTS_DOCS_SEARCH_GOTCHA_3="The availability follows the page: <em>sold out</em> when nothing is left, <em>in store only</em> for tickets that are only sold at the box office (Online payments off), and <em>in stock</em> otherwise. The end time is the ticket's <em>End Date &amp; Time</em>, and the period of the offer runs from its automatic publish date (only with <em>Use Auto Publish</em> on and a date filled in) until its sale stop (only with <em>Use Sale Stop</em> on). The currency is the one chosen on the Payments screen. The image is the ticket's or event's background image, if there is one. The organiser is your company name, with the website, from <em>Configuration &raquo; Company</em>; the rest of the company details are not included."
COM_TICKETSTATION_EVENTS_DOCS_SEARCH_GOTCHA_4="Search engines decide for themselves if and when they show it, and need days or weeks to pick up changes. Pages that are hidden from visitors (test mode, unpublished tickets) give no data. To check a page, paste its address into Google's Rich Results Test."
COM_TICKETSTATION_EVENTS_DOCS_SEARCH_GOTCHA_5="The data can be switched off with <em>Search engine data</em> in the Configuration (Display tab), for example on a test or staging site that is reachable from the internet. That doesn't stop search engines from indexing the pages themselves: also set <em>Robots</em> to <em>noindex, nofollow</em> in Joomla's Global Configuration on such a site."

COM_TICKETSTATION_SEATING_DOCS_TITLE="Seated tickets and seat charts"
COM_TICKETSTATION_SEATING_DOCS_INTRO="A <strong>seated ticket</strong> is sold per individual seat instead of per quantity: the customer picks seats on a seat chart and every ticket carries its seat number. Seating is switched on per ticket with <em>Show Seat Plans?</em> on the ticket form, and each seated ticket has its own seat plan settings, background image and seat chart. It has nothing to do with the venue: two tickets at the same venue each need their own chart (use <em>Copy from other ticket</em> to reuse a layout). As soon as seating is on, the ticket's storefront link opens the seat-picking page instead of the normal quantity page."
COM_TICKETSTATION_SEATING_DOCS_SETUP_TITLE="Setting up a seated ticket"
COM_TICKETSTATION_SEATING_DOCS_SETUP_1="Create the event and the (parent) ticket as usual and switch on <em>Show Seat Plans?</em>. You don't enter a capacity: the seats on the chart are the capacity. Add child tickets now if you want sections or price categories (see below)."
COM_TICKETSTATION_SEATING_DOCS_SETUP_2="Open <strong>Seat Plans</strong> from the control panel. It lists every top-level ticket with seating switched on, with its venue and number of seats; child tickets never appear here because the chart and its settings always belong to the parent."
COM_TICKETSTATION_SEATING_DOCS_SETUP_3="Click <strong>Edit seat plan</strong> (also reachable via the <em>Seats</em> button in the Tickets list, and via <em>Save &amp; Seat Plan</em> on the ticket form; <em>Edit Ticket</em> in the editor takes you back). The editor opens with three tabs on the right: <em>Properties</em>, <em>Display</em> and <em>Templates</em>. A new chart shows a note that it has no settings yet; nothing is stored until you save."
COM_TICKETSTATION_SEATING_DOCS_SETUP_4="Under <strong>Display</strong>, upload a background image (PNG, JPEG or WebP, usually a floor plan of the hall), set the seat width and height in pixels (22 is a common value) and the colours of free seats; each section can get its own colours. New seats get the seat size set here; <em>Apply to selection</em> or <em>Apply to all seats</em> resizes existing ones. Instead of starting empty you can load a template of the venue, or copy the chart of another ticket, under <strong>Templates</strong>."
COM_TICKETSTATION_SEATING_DOCS_SETUP_5="Place the seats with the <em>Row</em> and <em>Block</em> tools, adjust them as described below, and click <strong>Save</strong> (or press Ctrl+S). Nothing is stored before you save; leaving the page with unsaved changes asks for confirmation."
COM_TICKETSTATION_SEATING_DOCS_KINDS_TITLE="Free seats, sections and price categories"
COM_TICKETSTATION_SEATING_DOCS_KINDS_INTRO="Every seat on the chart is one of two kinds, chosen when you add or edit it: a <strong>free seat</strong> or a <strong>section seat</strong> of one of the child tickets. A child ticket that has seats is a section; a published child ticket without seats is a price category for the free seats. That gives these set-ups, which can also be combined on one chart (for example a balcony section next to stalls with price categories):"
COM_TICKETSTATION_SEATING_DOCS_COL_SETUP="Set-up"
COM_TICKETSTATION_SEATING_DOCS_COL_TICKETS="Tickets and seats"
COM_TICKETSTATION_SEATING_DOCS_COL_PRICE="Price of a seat"
COM_TICKETSTATION_SEATING_DOCS_COL_STOCK="Availability"
COM_TICKETSTATION_SEATING_DOCS_MODE_SINGLE="Free seats, no price categories<br><small class='text-muted'>one price</small>"
COM_TICKETSTATION_SEATING_DOCS_MODE_SINGLE_TICKETS="One ticket, or child tickets that are all sections; the free seats belong to the parent."
COM_TICKETSTATION_SEATING_DOCS_MODE_SINGLE_PRICE="Every free seat costs the parent ticket's price. The chart editor warns about this when the ticket has free seats but no price categories."
COM_TICKETSTATION_SEATING_DOCS_MODE_SINGLE_STOCK="The free seats that aren't blocked, minus the tickets sold on them."
COM_TICKETSTATION_SEATING_DOCS_MODE_TIERS="Free seats with price categories<br><small class='text-muted'>price per person</small>"
COM_TICKETSTATION_SEATING_DOCS_MODE_TIERS_TICKETS="The free seats belong to the parent; the child tickets without seats are price categories, e.g. Adult / Child / 65+."
COM_TICKETSTATION_SEATING_DOCS_MODE_TIERS_PRICE="Any free seat can be sold in any category. A newly picked seat starts at the most expensive category and its price category drop-down opens straight away under <em>Chosen seats</em>; clicking a chosen seat there opens it again later. Only published child tickets are offered."
COM_TICKETSTATION_SEATING_DOCS_MODE_TIERS_STOCK="The free seats that aren't blocked, minus the tickets sold on them, whatever category was chosen."
COM_TICKETSTATION_SEATING_DOCS_MODE_SECTIONS="Section seats<br><small class='text-muted'>price per section</small>"
COM_TICKETSTATION_SEATING_DOCS_MODE_SECTIONS_TICKETS="A seat belongs to one child ticket, e.g. Stalls / Balcony / Front row. You choose the section when adding the seat, and can change it later with <em>Edit Seat</em> as long as the seat is not sold."
COM_TICKETSTATION_SEATING_DOCS_MODE_SECTIONS_PRICE="Fixed by where the seat is: the price of its child ticket. The customer has no price choice."
COM_TICKETSTATION_SEATING_DOCS_MODE_SECTIONS_STOCK="Per section: its seats that aren't blocked, minus the tickets sold on them. A section is sold out when all its seats are taken."
COM_TICKETSTATION_SEATING_DOCS_KINDS_CHOOSE="A child ticket's role follows from the chart alone: give it seats and it becomes a section, remove all its seats and it becomes a price category again. The capacity of a seated ticket is always the number of seats that aren't blocked, and available is that minus the tickets sold, paid or not."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_TITLE="Working with the seat chart editor"
COM_TICKETSTATION_SEATING_DOCS_EDITOR_INTRO="Every seat has a <strong>row</strong> of at most 5 characters and a <strong>number</strong>, printed together on the ticket (e.g. <code>A12</code>). A number keeps its leading zeros, so rows named with a number stay readable: row <code>1</code> with first number <code>01</code> gives <code>101</code>, <code>102</code> … <code>110</code>. You work directly on the chart: the toolbar above it holds the tools, undo/redo, snap to grid, the grid and zoom; the question-mark button lists all keyboard and mouse shortcuts."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_1="<strong>Row</strong> (key R) &mdash; set the row name, number of seats, first number, numbering (counting up or down, by 1 or by 2 for odd/even numbering), the space between seats, horizontal or vertical, an optional curve, and whether the seats are free seats or belong to a section. A preview follows the mouse; click to place the row. The row name counts up after each row (A, B, C&hellip;), so you can click row after row."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_2="<strong>Block</strong> (key B) &mdash; places several rows at once: number of rows, seats per row, first row name, numbering and the space between seats and rows."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_3="<strong>Selecting</strong> &mdash; click a seat, Shift- or Ctrl-click to add seats, drag a frame over an empty spot, double-click to select a whole row, Ctrl+A for everything. Drag the selection to move it; it snaps to the grid (hold Alt to place freely, or switch snapping off with G). The arrow keys move the selection 1 pixel, with Shift one grid step."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_4="<strong>Properties</strong> of the selection &mdash; for one seat: row, number, section, status (<em>Free</em> or <em>Blocked</em>), position and size. For several seats: section, status, row name, size, <em>Renumber</em> (first number, numbering and order: left to right, right to left, top to bottom or bottom to top), align and distribute, duplicate (Ctrl+D; the copy goes below with the next row name) and delete (Del). A blocked seat can't be picked on the website and doesn't count as capacity; the box office can still book it through <strong>New reservation</strong> after a confirmation."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_5="<strong>Sold seats</strong> (and seats lying in a customer's basket) show a small dot and the order code. They can be moved and resized, but keep their section, row, number and status, and can't be deleted; actions on a selection leave them as they are and say so. This is checked again when saving, so a seat sold while the editor was open is never changed."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_6="<strong>Shape</strong> and <strong>Text</strong> (keys S and T) &mdash; drag to draw a rectangle (stage, bar, aisle) or a text label with its own colours and font size. Shapes can't be sold, but customers see them on the chart."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_7="<strong>Saving</strong> &mdash; before saving the editor checks for seats with the same row and number, overlapping seats and, on a canvas with a fixed size, seats outside the canvas. It lists them with a <em>Show</em> link; you can still save anyway. Undo (Ctrl+Z) and redo (Ctrl+Y) work until you save."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_8="<strong>Templates</strong> &mdash; a template is a layout stored on the <em>venue</em> of the ticket (seats, shapes, background and colours). <em>Save as template</em> stores the saved chart; <em>Load</em> replaces this chart with a template. Section seats of a template are linked to the child ticket with the same name, otherwise they become free seats. <em>Export</em> downloads a template as a file with the background image inside, which you import on another site in the editor or in the venue form; the venue form also lists and deletes templates. <em>Copy from another ticket</em> replaces this chart with another ticket's seats, shapes and background; section seats become free seats. Loading and copying are refused as soon as a seat of this chart has been sold."
COM_TICKETSTATION_SEATING_DOCS_MONITOR_TITLE="Following the sale and the entrance"
COM_TICKETSTATION_SEATING_DOCS_MONITOR="The status bar below the editor shows the number of seats, free, blocked and sold, with a legend per section. To follow the sale and the entrance live during the event, use the seat map on the scanning page (<em>Seat map</em>): free seats in their own colour, sold seats red, sold-and-scanned seats green and blocked seats grey, with totals; <strong>Start</strong> there refreshes the map and totals every 3 seconds."
COM_TICKETSTATION_SEATING_DOCS_FLOW_TITLE="How it works for the customer"
COM_TICKETSTATION_SEATING_DOCS_FLOW_1="From the ticket overview the customer opens the seated ticket and lands on <em>Select seats</em>: the event details, an instruction with two example rows (a single seat left over, and seats right next to the sold ones), the <em>Chosen seats</em> panel and below it the seat chart. A legend shows how free, taken (sold or blocked) and chosen seats look: taken seats are red and striped, chosen seats orange with a dark edge, so they can be told apart without relying on colour alone. The chart fills the width of the page and scales with the screen; on a narrow phone it keeps the seats large enough to tap and can be scrolled sideways, and the buttons above the chart zoom in and out."
COM_TICKETSTATION_SEATING_DOCS_FLOW_2="Clicking a free seat <strong>reserves it immediately</strong>: it takes the <em>Your choice</em> look (orange with a dark edge), is added under <em>Chosen seats</em> and goes into the cart (the basket module updates straight away). From that moment nobody else can pick it. There is no separate quantity to enter: every click is one ticket."
COM_TICKETSTATION_SEATING_DOCS_FLOW_3="Clicking a seat under <em>Chosen seats</em> shows its options: a button to remove the seat again and, for a free seat on a chart with price categories, the drop-down to choose the category."
COM_TICKETSTATION_SEATING_DOCS_FLOW_4="<em>Continue</em> leads to the cart, checkout and payment, exactly as for other tickets. The cart and payment page list the seat numbers."
COM_TICKETSTATION_SEATING_DOCS_FLOW_5="After payment each ticket PDF carries the seat number (<em>Seat number A12</em>) at the position, size and colour set under the seat number fields of the ticket design. In the Box Office the seat number is shown per ticket and can be searched on."
COM_TICKETSTATION_SEATING_DOCS_ORPHANS_TITLE="Prevent single empty seats"
COM_TICKETSTATION_SEATING_DOCS_ORPHANS_1="Switched on per seat plan in the seat plan editor (tab Display, <em>Seat selection on the site</em>). Off by default."
COM_TICKETSTATION_SEATING_DOCS_ORPHANS_2="When it is on, a customer cannot leave a single free seat between their choice and a taken (sold, reserved or blocked) seat or the end of a row, unless every placement of that many seats in that part of the row leaves one seat over. Choosing seats in the middle of an empty row stays allowed."
COM_TICKETSTATION_SEATING_DOCS_ORPHANS_3="Rows are recognised by row name and position, not by seat number, so odd/even numbering, curved and vertical rows work. A gap wider than about half a seat counts as an aisle (the end of a row). Seats without a row name are ignored. At a long table with seats on both sides under one row name, a single seat with a free seat of the same row right across from it is allowed, as the two can still be sold together."
COM_TICKETSTATION_SEATING_DOCS_ORPHANS_4="The whole choice is checked when the customer clicks <em>Continue</em> (seats left on their own are ringed in red) and again on the cart and checkout. The box office and reservations are not restricted. A single seat can still appear later when someone else&#39;s basket expires or an order is cancelled."
COM_TICKETSTATION_SEATING_DOCS_RELEASE_TITLE="When a seat becomes free again"
COM_TICKETSTATION_SEATING_DOCS_RELEASE_1="The customer removes it on the seat-picking page."
COM_TICKETSTATION_SEATING_DOCS_RELEASE_2="The order is never finished or paid and is cleaned up automatically (<em>Automatic removal of unfinished/pending tickets</em> in Configuration &raquo; Orders). The order stays visible in the Box Office as removed, with its history still showing which seat it held, until you delete it there."
COM_TICKETSTATION_SEATING_DOCS_RELEASE_3="The order is deleted in the Box Office."
COM_TICKETSTATION_SEATING_DOCS_RELEASE_4="The same cleanup also frees any seat whose order no longer exists, as a safety net against seats that stay red without an order."
COM_TICKETSTATION_SEATING_DOCS_GOTCHAS_TITLE="Things to know"
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_1="A seat is held from the moment it is clicked, not from payment. Without the automatic cleanup of unfinished orders, seats of abandoned carts stay taken; switch it on for seated events."
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_2="Block seats that must not be sold (status <em>Blocked</em> in the editor) rather than deleting them: a blocked seat stays on the chart, can't be picked and isn't counted as capacity."
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_3="The minimum and maximum order quantity of the ticket are not applied on the seat chart: a customer can pick as many seats as are free."
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_4="Seated tickets have no waiting list, whatever <em>Waiting list active</em> is set to (see the Waiting list topic), and the availability bar on the ticket page is not shown for them. The number of tickets left in the upcoming-events list is the number of seats that aren't blocked, minus the tickets sold."
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_5="Phone and walk-in bookings for a seated ticket go through <strong>New reservation</strong>: after choosing the ticket, staff pick the seats on the same chart (<em>Step 2: Choose seats</em>). On a chart with price categories, choose the category above the chart before clicking a free seat. Blocked seats show grey there and can be booked after a confirmation."
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_6="Sold tickets point at their seat, so the editor never deletes a sold seat or changes its row, number or section; a template or another chart can only replace the chart before the first seat is sold."
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_7="Seat positions are stored in pixels on the canvas (the size of the background image by default), and every chart scales that canvas to the screen. A background image about as wide as the content area of the site template gives the sharpest result."

COM_TICKETSTATION_TICKETLAYOUT_DOCS_TITLE="Designing the ticket (PDF)"
COM_TICKETSTATION_TICKETLAYOUT_DOCS_INTRO="After payment every ticket is generated as a PDF; all tickets of one order are combined into one file that is sent by email and offered for download on the payment result page. What a ticket looks like is set per ticket, on the <strong>Ticket layout</strong> tab of the ticket form. A layout has three parts: the <strong>page size and orientation</strong>, a <strong>background</strong> (your own design or the built-in Ticketstation layout) and the <strong>fields</strong> that are printed on top of it, each at a position, size and colour you choose."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_SETUP_TITLE="Setting up a ticket layout"
COM_TICKETSTATION_TICKETLAYOUT_DOCS_SETUP_1="Open the ticket and go to the <strong>Ticket layout</strong> tab. Under <em>Size &amp; Orientation</em> choose A5 or A4 and portrait or landscape. For any other size fill in <em>Override Ticket Size</em> as width,height in millimetres, e.g. <code>100,150</code>; leave it empty to use A5 or A4."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_SETUP_2="Choose the background. Without an upload the <strong>built-in layout</strong> is used: blue bars along the top and bottom, the Ticketstation logo and a tear-off stub with the QR code, which adapts to every size and orientation. For your own house style, design a background at the ticket size (it is stretched over the whole page), leaving room for the fields and the QR code, and upload it as JPG or PDF under <em>Upload Ticket Design</em>. A JPG larger than the ticket needs is scaled down automatically (to 200 dpi); keep a PDF design small yourself. The design is stored only once in the PDF of an order, but a heavy design still makes that file heavy."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_SETUP_3="Under <em>Field formatting</em> the layout editor shows the ticket with its background and every field on it. Drag the fields into place, click a field to set its exact position, font size and colour, and switch fields on or off in the list. While you drag, dashed guides appear when a field lines up with the left edge, centre, top or baseline of another field, or with the centre of the page, and the field snaps to them. Drag the square in the corner of the selected QR code to resize it. <em>Ctrl+Z</em> and <em>Ctrl+Y</em> (or the undo and redo buttons above the ticket) undo and redo changes made since the page was opened. The editor fills in the fields under <em>Advanced: position, size and colour per field</em>, which you can also edit directly (see below). A ticket without a design and without any position shows the default field set; as soon as you change one field, the whole set is filled in so you can adjust it."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_SETUP_4="The editor places the fields to within about half a millimetre of the PDF. For the exact result click <strong>Preview</strong>. The preview uses what is in the form right now, including changes you haven't saved yet, filled with sample data (an order of 4 tickets with a reference and a seat number), so every field is visible. When everything is in place, <strong>Save</strong> the ticket: the editor itself saves nothing."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_SETUP_5="To reuse a layout, select another ticket under <em>Load fields from other Ticket</em> and click <em>Load Values</em>: the positions, sizes and colours of all fields are copied into the form. Save afterwards. The design file and the size/orientation are not copied; upload and set them on this ticket as well."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FORMAT_TITLE="Font, positions, font sizes and colours"
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FORMAT_1="<strong>Position</strong> is <code>X-Y</code> in millimetres, measured from the top-left corner of the page: <code>10-33</code> means 10 mm from the left and 33 mm from the top. Decimals use a dot (<code>12.5-40</code>). A field without a position is not printed."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FORMAT_2="<strong>Font size</strong> is in points: 9&ndash;12 works for most fields, 14&ndash;18 for the event name. Most fields are printed in bold."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FORMAT_3="<strong>Font colour</strong> is a hex code of 6 or 3 digits, with or without <code>#</code>, e.g. <code>0E1F3D</code>. Left empty, the text is black."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FORMAT_4="The <strong>QR code</strong> has a position (its top-left corner) and a <em>QR code Width</em> in pixels, placed at 96 dpi: 1 pixel is about 0.26 mm, so <code>150</code> gives a code of about 40 mm and <code>200</code> about 53 mm. Keep it at least about 30 mm wide, on a light, quiet background, so it scans quickly at the door."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FORMAT_5="Text is printed on one line from its position up to the right margin (10 mm from the right edge). A longer text is not cut off: the part that does not fit continues 10 mm from the left edge, at the same height, over whatever is printed there. The layout editor marks such a field in red. Check the preview against the longest event name or customer name you expect."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FORMAT_6="<strong>Font</strong> (under <em>Size, Orientation &amp; Font</em>) applies to all text on the ticket: Raleway (the default), Open Sans, Helvetica, Times or Courier. Helvetica, Times and Courier are the standard fonts built into every PDF reader, so they keep the PDF smallest; Raleway and Open Sans are embedded in the PDF. Letters differ in width per font, so check the preview after switching."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELDS_TITLE="What each field prints"
COM_TICKETSTATION_TICKETLAYOUT_DOCS_COL_FIELD="Field"
COM_TICKETSTATION_TICKETLAYOUT_DOCS_COL_PRINTS="Printed on the ticket"
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_EVENTNAME="The name of the event."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_TICKETNAME="The name of the ticket, e.g. <em>Regular</em> or <em>VIP</em>."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_FREETEXT="The <em>Free Text</em> entered on the ticket's details tab, for anything else you want on the ticket, e.g. <em>Doors open 19:30</em>."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_TICKETDATE="Date and start time of the ticket, e.g. <em>Date: 12-10-2026 || Starts: 20:00</em>. The date is always printed as day-month-year."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_DOORS_OPEN="The time the doors open, e.g. <em>Doors open: 19:30</em>, as entered at <em>Doors open</em> on the ticket's details tab. Left out when that field is empty. The preview shows a sample time when it is empty."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_VENUE="The name and city of the ticket's venue, e.g. <em>De Oosterpoort, Groningen</em>. Without a city only the name is printed. The preview shows the venue currently selected on the ticket's details tab."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_TICKETPRICE="<em>Price</em> followed by the ticket price, with the currency and in the price format of the Configuration, as on the invoice."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_ORDERDATE="The date of the order, in the date format of the Configuration."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_CLIENT="<em>Ordered by:</em> followed by the customer's first and last name. On A5 tickets the name goes on a second line, 5 mm lower, and is cut off after 35 characters."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_ORDERTICKETINDEX="Which ticket of the order this is, e.g. <em>2/4</em>. Only printed when the order holds more than one ticket. With <em>Print prepending text</em> on, the <em>Prepending text</em> is put in front of it (<em>Ticket 2/4</em>)."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_ORDERNUMBER="The event and ticket code plus the order and ticket number, small and printed vertically, reading upwards from the position. The digits after the last dash are the ticket number that can be typed in by hand at the scanner."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_SEATNUMBER="<em>Seat number</em> followed by the row and seat, e.g. <em>Seat number A12</em>. Only printed on seated tickets."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_ORDERREFERENCE="The reference set on the order in the Box Office (<em>Order Reference</em>, at most 35 characters), e.g. a name for a group booking. Only printed when the order has one. Tickets are generated at payment, so a reference added afterwards only appears once the tickets are made again with <em>Create Tickets</em> in the order screen; they keep their QR codes, so tickets sent earlier still scan. With <em>Centered on Ticket</em> on, it is centred horizontally and only the Y of the position is used. The note a customer can add in the cart is something else: it is shown in the Box Office as <em>Customer note</em> and never printed."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_FIELD_QRCODE="The QR code that is scanned at the door: a random code, unique per ticket. In Mollie test mode every ticket gets the same test code with a red <em>INVALID</em> stamp across it, so test tickets can never be used."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_GOTCHAS_TITLE="Things to know"
COM_TICKETSTATION_TICKETLAYOUT_DOCS_GOTCHA_1="With the built-in layout and <em>no</em> position filled in at all, a matching default set of fields is printed automatically (event, ticket, date, venue, seat, customer, price, reference, ticket index, order number and QR code), so a new ticket is never blank. As soon as one position is filled in, only your own fields are printed."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_GOTCHA_2="An uploaded design is always stretched over the whole page, whatever size and orientation are set (<em>Override Ticket Size</em> included). Make it in the same proportions as the ticket, otherwise it gets distorted; changing the size or orientation later means uploading a matching design as well. Of a PDF design only the first page is used."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_GOTCHA_3="Uploading a new design replaces the old one, also when switching between JPG and PDF. <em>Remove Design</em> brings the ticket back to the built-in layout."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_GOTCHA_4="The layout is applied at the moment a ticket PDF is generated. Tickets that were already sent keep the layout they were made with."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_GOTCHA_5="Labels such as <em>Date</em>, <em>Starts</em>, <em>Price</em>, <em>Ordered by</em> and <em>Seat number</em> are printed in the site's frontend language (Global Configuration), whatever language the backend is in."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_GOTCHA_6="Every ticket font covers Western European characters only. Accented letters such as é, ë and ü print fine; characters outside that set, such as emoji, cannot be printed."
COM_TICKETSTATION_TICKETLAYOUT_DOCS_GOTCHA_7="<em>Upload Background Image</em> on the same tab is not part of the ticket PDF: it is the banner behind the ticket in the upcoming-events list on the website (preferably 825 &times; 210 px), and it is shown at the top of the ticket page and the seat chart page."

COM_TICKETSTATION_CONFIG_DOCS_TITLE="Configuration reference"
COM_TICKETSTATION_CONFIG_DOCS_INTRO="The Configuration screen is one form, grouped into seven tabs, saved to a single settings row. Below are the settings that materially change behaviour elsewhere in the component; purely cosmetic company/address fields aren't repeated here since their tab already labels them clearly."
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL="General"
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL_1="<em>Website currency</em> &mdash; the currency symbol or code shown with every price, on the website, the tickets and the invoices."
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL_2="<em>Date format</em> / <em>Time format</em> &mdash; how dates and times are displayed in the backend, mails, tickets and invoices. Pick one of the suggestions or type your own PHP date or time format, such as <code>Y-m-d</code> or <code>H:i:s</code>; the field accepts up to 32 characters. An empty field falls back to <code>d-m-Y</code> and <code>H:i</code>. Month and day names in a format (<code>F</code>, <code>l</code>) are shown in English. On a site whose language uses the Persian (Jalali) calendar, dates on screen follow that calendar, like the date picker does; tickets, invoices, mails, wallet passes and the data sent to Mollie and search engines keep the Gregorian calendar."
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL_3="<em>Prices</em> &mdash; how amounts are written: the number of decimals (always two, none, or only when the amount isn't whole), the decimal point, the thousands separator and whether the currency symbol comes before or after the amount, e.g. &quot;&euro; 1.234,50&quot; or &quot;1,235 SAR&quot;. It applies to the website, mails, tickets, invoices and the backend. Amounts that go to Mollie and to search engines are always sent in a fixed notation, so this setting never affects payments."
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL_4="<em>Show coupon system</em> &mdash; turns the discount-coupon system on or off for the whole shop (see the Coupons topic)."
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL_5="<em>Show remarks in cart</em> &mdash; lets customers add a free-text note to their order in the cart. It is shown in the Box Office as <em>Customer note</em> and is never printed on the ticket."
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL_6="<em>Waiting list active</em> &mdash; enables the waiting list for sold-out tickets, child tickets included. Seated tickets never offer a waiting list, regardless of this setting &mdash; see the Waiting list topic below."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DISPLAY="Display"
COM_TICKETSTATION_CONFIG_DOCS_TAB_DISPLAY_1="<em>Tickets left in eventlist</em> / <em>Prices in eventlist</em> &mdash; show the number of tickets left, resp. the price, directly in the upcoming-events list. For a ticket with child tickets it is what is left of the shared capacity, or the total left over all published child tickets; for a seated ticket the number of free seats (see the Events &amp; tickets and Seated tickets topics)."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DISPLAY_2="<em>Availability bar on ticket page</em> &mdash; shows an availability bar on the ticket page, for tickets without seats only. For a ticket with child tickets the bar covers all published child tickets together; a child ticket is shown as sold out as soon as its own share (the shared capacity or its own) is used up."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DISPLAY_3="<em>Show venue</em> &mdash; master toggle for the venue line on events and tickets. <em>Show venue address</em>, <em>Show venue description</em> and <em>Show venue website</em> add extra venue details underneath it, and only take effect while <em>Show venue</em> itself is on."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DISPLAY_4="<em>Search engine data</em> &mdash; adds event data (schema.org JSON-LD) to the events list and the ticket pages, so search engines can show your events with date, venue and price (see Events &amp; tickets &raquo; Events in search engines). On by default. Switch it off on a test or staging site that is reachable from the internet, so its events don't show up in search results; it doesn't stop search engines from indexing the pages themselves, so also set <em>Robots</em> to <em>noindex, nofollow</em> in Joomla's Global Configuration on such a site."
COM_TICKETSTATION_CONFIG_DOCS_TAB_ORDERS="Orders"
COM_TICKETSTATION_CONFIG_DOCS_TAB_ORDERS_1="<em>Next order number</em> &mdash; overrides the next sequential order number (format: 2-digit season prefix + 3-digit sequence, e.g. <code>26001</code>; after <code>99999</code> the numbers go on with 6 digits). Use it to jump the counter ahead for a new season; it has no effect once orders have already passed that number. It accepts a whole number of at most 6 digits."
COM_TICKETSTATION_CONFIG_DOCS_TAB_ORDERS_2="<em>Automatic removal of unfinished/pending tickets</em> &mdash; cleans up orders that were never finished after <em>Remove Unfinished Orders after</em> (hours), and unpaid or pending orders after <em>Remove Unpaid/Pending Orders after</em> (days), so their tickets (and seats) become available again, or go to the waiting list first when it is on. The same switch also drives the automatic publishing and sales stop of tickets and the automatic (un)publishing of events: with it off, those dates are ignored (see Events &amp; tickets). There is no scheduled task: all of this runs while the website or the backend is in use."
COM_TICKETSTATION_CONFIG_DOCS_TAB_ORDERS_3="<em>Reminder</em> &mdash; <em>Send a reminder before the event</em> mails the buyers shortly before the event starts, with the time, when the doors open, the place, a link to have the tickets sent again and a calendar file (the template <em>Event reminder</em>, see Email templates). <em>Hours before the start</em> sets how long before the start it goes out (24 by default). The mail is sent by a Joomla Scheduled Task, so switching it on is not enough: create the task <em>Ticketstation reminders</em> under System, Scheduled Tasks and let it run hourly. Every order gets the reminder once per event and start time; orders placed inside the reminder period get none, as they have just received their tickets; unpaid, refunded and released orders and unpublished events are skipped."
COM_TICKETSTATION_CONFIG_DOCS_TAB_CHECKOUT="Checkout"
COM_TICKETSTATION_CONFIG_DOCS_TAB_CHECKOUT_1="<em>Show Salutation</em>, <em>Show Address</em>, <em>Show Second Address</em>, <em>Show Third Address</em>, <em>Show Zipcode</em>, <em>Show City</em>, <em>Show Country</em>, <em>Show Phonenumber</em>, <em>Show Birthday</em> &mdash; individually show or hide each customer-detail field on the checkout form. A field that is shown must be filled in, except the third address line. When something is missing or wrong, the form shows every problem at once next to its field and keeps what the customer typed."
COM_TICKETSTATION_CONFIG_DOCS_TAB_CHECKOUT_2="<em>Service Fee</em> &mdash; what customers pay per order on top of the tickets. <em>Variable</em> charges the <em>Variable Fee</em> percentage of the order total after any discount, <em>Fixed</em> the <em>Fixed Fee</em> amount, and <em>Fixed and variable</em> both: first the percentage of the order total after any discount, then the fixed amount on top (no percentage is charged over the fixed amount). With <em>None</em> nothing is calculated or shown to customers. The screen only shows the fields of the chosen kind. A free order never has a service fee, also not the fixed part. Every order keeps the service fee it was placed with: it is fixed when the customer goes on to the payment page (for a waiting-list order, when the payment link is sent), so changing this setting later doesn't change orders that already got that far. Reservations made in the backend never have a service fee. The fee includes VAT at the rate of the tickets in the order; with tickets at different rates it is split in proportion to their amounts. Not to be confused with the transaction costs Mollie charges you per payment."
COM_TICKETSTATION_CONFIG_DOCS_TAB_CHECKOUT_3="<em>Send tickets directly</em> (Payment settings) &mdash; <em>Yes</em> (the default) emails the tickets to the customer as soon as an order is paid online or a free order is completed, also with online payments off. With <em>No</em> the tickets are created but not sent; send them yourself from the Box Office. <em>Complete Order</em> in the Box Office and a reservation saved as paid always send them, whatever this setting says. Until version 2.13 this setting was part of the Mollie settings; updating keeps its value."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DOCUMENTS="Documents"
COM_TICKETSTATION_CONFIG_DOCS_TAB_DOCUMENTS_1="Tickets are emailed as a PDF attachment: one file holding all tickets of the order. After an online payment or a free order they are only sent automatically when <em>Send tickets directly</em> (on the <em>Checkout &amp; payment</em> tab) is set to <em>Yes</em>; with <em>No</em> the tickets are created but not sent. <em>Complete Order</em> in the Box Office and a reservation saved as paid always send them, and the Box Office can send them again at any time."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DOCUMENTS_2="<em>Send Invoice After payment</em>, <em>Invoice Prefix</em>, <em>Client Address Format</em>, <em>Company Address Format</em> and <em>Company Logo</em> &mdash; invoicing settings, covered in full under the Invoicing topic below."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DOCUMENTS_3="Language &mdash; ticket PDFs and invoices are always printed in the site's default language (Global Configuration &raquo; Site &raquo; Default Site Language), also when they are created or resent from the backend in another admin language."
COM_TICKETSTATION_CONFIG_DOCS_TAB_COMPANY="Company"
COM_TICKETSTATION_CONFIG_DOCS_TAB_COMPANY_1="Company name, address, contact details and logo used in invoice headers, emails and legal footers. There is no separate VAT/company-registration-number field; add it as free text within the address if needed."
COM_TICKETSTATION_CONFIG_DOCS_TAB_COMPANY_2="<em>Email</em> &mdash; the contact address customers are pointed to on the payment result page (payment failed, nothing received) and when a ticket download is no longer available. When it is empty, the <em>Sender Mail Address</em> is used, and after that Joomla's own sender address."
COM_TICKETSTATION_CONFIG_DOCS_TAB_COMPANY_3="<em>Terms and Conditions link</em>, <em>Privacy Statement link</em> &mdash; the links to your terms and conditions and privacy statement in the &quot;By clicking 'Pay' you agree to &hellip;&quot; line on the payment page. One link serves every site language. A full URL or a path relative to the site root both work; a link left empty is left out of the sentence, and with both empty the sentence is not shown."
COM_TICKETSTATION_CONFIG_DOCS_TAB_COMPANY_4="<em>Sender Name</em>, <em>Sender Mail Address</em> (Mail Settings) &mdash; the sender of every mail Ticketstation sends. An empty name falls back to the company name and an empty address to the company <em>Email</em>. When that doesn't give a valid address either, Joomla's global sender is used."
COM_TICKETSTATION_CONFIG_DOCS_TAB_COMPANY_5="The control panel lists under <em>Needs attention</em> when the company name, address, postcode, city or email is empty or still holds the example data of a fresh install, and when mails would be sent from Joomla's global sender."
COM_TICKETSTATION_CONFIG_DOCS_TAB_WALLET="Wallet"

COM_TICKETSTATION_PAYMENTS_DOCS_TITLE="Online payments"
COM_TICKETSTATION_PAYMENTS_DOCS_INTRO="Customers pay through a <strong>payment provider</strong>. When the provider offers more than one payment method, the customer chooses one on the payment page of this website and is then sent straight to that method at the provider; the provider reports the result back to this site, which marks the order as paid, creates the tickets and, depending on the settings, emails the tickets and the invoice. Providers are plugins: <strong>Mollie</strong>, a Dutch payment provider, is included, and other providers can be added by installing their plugin. Orders with a total of 0 (for example with a 100% coupon) never go to a provider and are completed straight away."
COM_TICKETSTATION_PAYMENTS_DOCS_SCREEN_TITLE="The Payments screen"
COM_TICKETSTATION_PAYMENTS_DOCS_SCREEN_INTRO="Open <strong>Payments</strong> from the control panel:"
COM_TICKETSTATION_PAYMENTS_DOCS_SCREEN_1="<em>Online payments</em> &mdash; the provider customers pay through, or <em>Off</em>. With Off the website only sells free tickets; see below. Only the providers whose plugin is switched on can be chosen."
COM_TICKETSTATION_PAYMENTS_DOCS_SCREEN_2="<em>Currency</em> &mdash; the currency customers pay in, one for the whole shop (prices, invoices and payments). The list only shows the currencies the chosen provider can collect (Mollie: euro, British pound, US dollar, Swiss franc, the Scandinavian and Eastern European currencies and a number of others; a provider plugin can add currencies such as the Saudi riyal or the Turkish lira); choosing another provider updates the list. The currency must also be enabled for your payment account, and not every payment method works in every currency. Currencies with two decimals and a few without (the Japanese yen, for instance) are offered: every amount of an order is rounded to the decimals of the currency, so with a currency without decimals set Decimals under Configuration, Prices to &quot;no decimals&quot; or &quot;Only when needed&quot;. Currencies with three decimals (such as the Kuwaiti dinar) are not supported. This setting only affects the payment; the symbol shown next to prices on the site, tickets and invoices is <em>Website currency</em> in the Configuration, so set both to match."
COM_TICKETSTATION_PAYMENTS_DOCS_SCREEN_3="<em>Payment plugins</em> &mdash; every installed payment plugin with its version and whether it is switched on. <em>Settings</em> opens the plugin's own settings; <em>Switch off</em> and <em>Switch on</em> change the plugin's published state, as in Joomla's Plugin Manager. A plugin that is switched off offers no provider: nobody can pay through it, and payments, refunds and chargebacks of earlier orders can't be processed through it until you switch it on again. If the provider chosen for online payments is switched off, the control panel says so."
COM_TICKETSTATION_PAYMENTS_DOCS_SCREEN_4="<em>Other providers</em> &mdash; install the plugin of another payment provider through Joomla's Extension Manager (System &rsaquo; Install &rsaquo; Extensions). It appears in the list; set it up with <em>Settings</em> and choose it under <em>Online payments</em>. Developers can write such plugins: the interface and an example plugin are in the Ticketstation repository (folder <code>developer</code>)."
COM_TICKETSTATION_PAYMENTS_DOCS_ACCOUNT_TITLE="Getting a Mollie account"
COM_TICKETSTATION_PAYMENTS_DOCS_ACCOUNT_1="Sign up at <a href='https://www.mollie.com' target='_blank' rel='noopener'>mollie.com</a>. After signing up you manage everything in the Mollie Dashboard (<a href='https://my.mollie.com' target='_blank' rel='noopener'>my.mollie.com</a>)."
COM_TICKETSTATION_PAYMENTS_DOCS_ACCOUNT_2="Complete the onboarding in the Dashboard: Mollie asks for the details of your organisation, a bank account for the payouts and verification of the person responsible. Real (live) payments are only possible once Mollie has approved the account; testing is possible straight away."
COM_TICKETSTATION_PAYMENTS_DOCS_ACCOUNT_3="Activate the payment methods you want to offer in the Dashboard, and choose the same ones in the settings of the Mollie plugin (see below). A chosen method that is not active in Mollie is marked there. Mollie's transaction costs are listed on their pricing page and are settled by Mollie itself; they are separate from the service fee you may charge customers (Configuration &raquo; Checkout &amp; payment)."
COM_TICKETSTATION_PAYMENTS_DOCS_ACCOUNT_4="Copy the two API keys from the Dashboard (under <em>Developers &raquo; API keys</em>): the <strong>test</strong> key starts with <code>test_</code>, the <strong>live</strong> key with <code>live_</code>. Enter them in the settings of the Mollie plugin described below. No webhook or return address has to be set up in Mollie: the site sends both along with every payment."
COM_TICKETSTATION_PAYMENTS_DOCS_SETTINGS_TITLE="The Mollie settings"
COM_TICKETSTATION_PAYMENTS_DOCS_SETTINGS_INTRO="Open <strong>Payments</strong> in the control panel and choose <em>Settings</em> at the Mollie plugin. The settings apply to every payment:"
COM_TICKETSTATION_PAYMENTS_DOCS_SETTINGS_1="<em>API Key (live)</em> / <em>API Key (test)</em> &mdash; the keys from the Mollie Dashboard. Treat them like passwords: anyone who can edit the plugin can read them."
COM_TICKETSTATION_PAYMENTS_DOCS_SETTINGS_2="<em>Test Mode</em> &mdash; uses the test key. Mollie then shows a test payment page on which you choose the outcome yourself (paid, failed, cancelled, &hellip;); no money changes hands. Tickets created in test mode get a fixed test code and the word INVALID across the QR code, so they can't be mistaken for real tickets. While test mode is on, the shop is closed to the public: only visitors who are logged in on the website see the tickets and can order them, with a warning above the ticket overview. Everyone else gets &quot;Ticket not available&quot; and only sees the events whose sale is about to start. Switch it off before real sales start."
COM_TICKETSTATION_PAYMENTS_DOCS_SETTINGS_3="<em>Payment methods</em> &mdash; the methods the customer can choose from: iDEAL | Wero, Bancontact, credit card, Apple Pay, PayPal, KBC/CBC, Belfius and gift cards. With more than one method the customer chooses on the payment page of this website, and Mollie skips its own method screen, so a cancelled or failed payment returns to the site. With one method there is nothing to choose. Each chosen method must also be active in the Mollie Dashboard; the settings check this with Mollie and mark the ones that are not. iDEAL | Wero, Bancontact, KBC/CBC, Belfius and gift cards only work in euros; with another currency they are not offered. Apple Pay only appears on Apple devices, so it can't be the only method. Google Pay has no option of its own: it is part of credit card, and Mollie shows it on supported devices and browsers once Google Pay is also activated in the Mollie Dashboard. Bank transfer and pay-later methods (such as Klarna) are deliberately not offered: a bank transfer can take days while the seats stay reserved, and pay-later methods use a payment status this site doesn't handle."
COM_TICKETSTATION_PAYMENTS_DOCS_SETTINGS_4="<em>Payment Description</em> &mdash; text that is followed by the order code, e.g. <code>Ordernumber: 26001</code>. The customer sees it on Mollie's payment page and on their bank statement, so make it recognisable."
COM_TICKETSTATION_PAYMENTS_DOCS_SETTINGS_5="<em>Interface Language</em> &mdash; the language of Mollie's payment page (Dutch, English, French or German). It is one setting for all customers; it doesn't follow the language of the site."
COM_TICKETSTATION_PAYMENTS_DOCS_SETTINGS_6="<em>Mark order as waiting for payment</em> &mdash; with Yes (the default) an order gets the status <em>waiting for payment</em> as soon as the customer is sent to Mollie, so it shows up in the Box Office while the customer pays."
COM_TICKETSTATION_PAYMENTS_DOCS_OFF_TITLE="Without a payment provider: online payments off"
COM_TICKETSTATION_PAYMENTS_DOCS_OFF_INTRO="No payment account, or no online sales for now? Set <em>Online payments</em> on the Payments screen to <em>Off</em>. The website then only sells free tickets; paid tickets are sold through <strong>Reservations</strong> and paid at the box office."
COM_TICKETSTATION_PAYMENTS_DOCS_OFF_1="<em>Backend</em> &mdash; the control panel shows no payment warnings, and the setup step for online payments counts as done. The settings of the provider are kept, so switching back on needs no new setup. Test mode doesn't apply while online payments are off."
COM_TICKETSTATION_PAYMENTS_DOCS_OFF_2="<em>Website</em> &mdash; free tickets are ordered as usual; an order of 0 never goes to a provider and is completed straight away. Paid tickets show <em>At the box office</em> in the ticket overview and on the ticket page, without a quantity, an order button or the waiting list. A seating chart with any paid seat can't be opened. The note about transaction costs below the overview is hidden."
COM_TICKETSTATION_PAYMENTS_DOCS_OFF_3="<em>Baskets from before</em> &mdash; a customer who still has paid tickets in the basket can't pay for them: the payment page says so and offers no payment button."
COM_TICKETSTATION_PAYMENTS_DOCS_OFF_4="<em>Payment links</em> &mdash; the Box Office doesn't offer <em>Resend Payment</em>, because a payment link can't be paid. Links sent earlier stop working too; the Payments screen warns when orders are still waiting for payment. Waiting-list customers for paid tickets keep waiting until online payments are on again; those for free tickets are handled as usual."
COM_TICKETSTATION_PAYMENTS_DOCS_OFF_5="<em>Earlier payments</em> &mdash; payments already started at the provider, refunds and chargebacks are still processed, as long as the provider's plugin is switched on and keeps its settings. Leave the API key in place as long as earlier orders may still be refunded."
COM_TICKETSTATION_PAYMENTS_DOCS_FLOW_TITLE="How a payment goes"
COM_TICKETSTATION_PAYMENTS_DOCS_FLOW_1="The customer clicks <em>Place order</em> on the last checkout page, choosing a payment method first when there is more than one. The order is marked as pending and the customer is sent to the provider's payment page."
COM_TICKETSTATION_PAYMENTS_DOCS_FLOW_2="As soon as the payment has a result, the provider calls this site in the background (the webhook). When the payment is paid and the amount matches the order, the order is marked as paid, the payment is recorded under <strong>Transactions</strong>, the tickets are created and, with <em>Send tickets directly</em> on, emailed together with the invoice (when <em>Send Invoice After payment</em> is on). A payment whose amount doesn't match is not accepted."
COM_TICKETSTATION_PAYMENTS_DOCS_FLOW_3="Meanwhile the customer returns to the payment result page of the site, which shows whether the payment succeeded. When no result has arrived after about a minute and a half (for example because the customer went back from the payment page without paying), the page stops waiting and offers <em>Pay again</em>, with a note not to pay twice."
COM_TICKETSTATION_PAYMENTS_DOCS_FLOW_4="A failed, cancelled or expired payment is recorded in the order's history and the order stays unpaid. The payment result page then offers the customer <em>Pay again</em>, which starts a new payment for the same order. If they don't pay, its tickets (and seats) are released by the automatic cleanup after <em>Remove Unpaid/Pending Orders after</em> (days, Configuration &raquo; Orders)."
COM_TICKETSTATION_PAYMENTS_DOCS_GOTCHAS_TITLE="Things to know"
COM_TICKETSTATION_PAYMENTS_DOCS_GOTCHA_1="The site must be reachable from the internet for the provider's webhook. On a local installation, or a test site behind a password or firewall, the provider can't report back and payments are never confirmed. To try the website's order flow there anyway, order a free ticket: an order with a total of 0 never goes to a provider and is completed straight away, with tickets, email and invoice. Until version 2.14 a separate <em>Bypass Mode</em> did this for paid tickets; it was removed, as Reservations now cover booking tickets without an online payment."
COM_TICKETSTATION_PAYMENTS_DOCS_GOTCHA_2="The control panel lists payment problems under <em>Needs attention</em>: the provider's own warnings (for Mollie: test mode on, a missing live key, a live key that doesn't start with <code>live_</code>, or a test key entered in the live field), and a chosen provider whose plugin is switched off or removed."
COM_TICKETSTATION_PAYMENTS_DOCS_GOTCHA_3="With Mollie, test mode and the live key are independent: with test mode on, the live key is not used at all, so you can prepare the live key in advance and only switch test mode off on the day sales start."
COM_TICKETSTATION_PAYMENTS_DOCS_GOTCHA_4="Refund an order from the Box Office (<em>Payment</em> &rsaquo; <em>Refund...</em>): the refund is made at the provider and you choose what happens to the tickets. A refund made in the provider's dashboard, or a chargeback (a payment reversed by the customer's bank), is reported to the site and waits under <em>Needs attention</em> until you decide about the tickets. A provider without refunds only allows refunds you pay back yourself. See the Box Office topic, <em>Refunds</em>."
COM_TICKETSTATION_PAYMENTS_DOCS_GOTCHA_5="The details the provider sent for a payment (method, status, amounts) can be viewed per payment in the <strong>Transactions</strong> screen."
COM_TICKETSTATION_PAYMENTS_DOCS_GOTCHA_6="If a customer manages to pay the same order twice (for example in two browser tabs), the second payment doesn't create extra tickets. The order's history in the Box Office then shows a warning; refund one of the two payments at the provider."
COM_TICKETSTATION_PAYMENTS_DOCS_GOTCHA_7="Payments remember which provider they went through. Switching to another provider for new payments leaves the earlier orders with their own provider, so keep the old provider's plugin switched on while its orders may still be refunded or reversed."
COM_TICKETSTATION_PAYMENTS_DOCS_GOTCHA_8="Updating from a version before 2.25: the Mollie settings (API keys, test mode, methods, description, language and the currency) moved to the Mollie plugin and the Payments screen automatically; nothing has to be entered again."
COM_TICKETSTATION_INVOICING_DOCS_TITLE="Invoicing"
COM_TICKETSTATION_INVOICING_DOCS_WHEN_TITLE="When an invoice is generated"
COM_TICKETSTATION_INVOICING_DOCS_WHEN="An invoice is created automatically the moment an order is paid, through the single shared completion routine every payment route runs through (Mollie payment, completing an order in Box Office, or confirming a Reservation). With <em>Send Invoice After payment</em> enabled in Configuration, the PDF is generated and emailed to the customer together with their tickets in that same step; calling this again for the same order re-uses the existing invoice number and PDF rather than creating a duplicate. If automatic sending is off, or an email bounced, an admin can trigger it manually from the order in Box Office (<strong>Send Invoice</strong>), regardless of the automatic setting."
COM_TICKETSTATION_INVOICING_DOCS_VIEW_TITLE="Viewing and downloading invoices"
COM_TICKETSTATION_INVOICING_DOCS_VIEW="The Invoices screen lists every invoice with its number, linked order, client, amount, date and a Sent / Not Sent badge, with a download button opening the PDF. Deleting an order in Box Office also removes its invoice record and PDF."
COM_TICKETSTATION_INVOICING_DOCS_CONTENT_TITLE="What appears on the invoice"
COM_TICKETSTATION_INVOICING_DOCS_CONTENT="Invoice number as configured prefix plus the invoice's own ID, zero-padded to 5 digits (e.g. <code>INV-00001</code>), so numbers stay sequential and are never re-used; invoice date and order number; the client's name and address, laid out using the <em>Client Address Format</em> template; the company's details and logo in the header; one line per ticket type with quantity, description, VAT percentage, price excluding VAT, discount excluding VAT and coupon code where applicable, and a line for the service fee (per VAT rate, as it carries the VAT of the tickets); then the subtotal excluding VAT, the VAT per rate, and the total the customer paid. Invoices made before 2.5.2 show their service fee without VAT, as it was charged then."
COM_TICKETSTATION_INVOICING_DOCS_SETTINGS_TITLE="Settings that control it"
COM_TICKETSTATION_INVOICING_DOCS_SETTINGS_1="<em>Send Invoice After payment</em> &mdash; automatic generation and emailing on order completion, on or off."
COM_TICKETSTATION_INVOICING_DOCS_SETTINGS_2="<em>Invoice Prefix</em> &mdash; the text prefix used in both the printed invoice number and the PDF filename."
COM_TICKETSTATION_INVOICING_DOCS_SETTINGS_3="<em>Client Address Format</em> / <em>Company Address Format</em> &mdash; token-based templates for how the two addresses are laid out on the PDF."
COM_TICKETSTATION_INVOICING_DOCS_SETTINGS_4="<em>Company Logo</em> &mdash; the logo printed on invoices; falls back to the component's bundled logo when left empty."

COM_TICKETSTATION_WAITINGLIST_DOCS_TITLE="Waiting list"
COM_TICKETSTATION_WAITINGLIST_DOCS_ENABLE_TITLE="Enabling it"
COM_TICKETSTATION_WAITINGLIST_DOCS_ENABLE="Turn on <em>Waiting list active</em> in Configuration to switch it on for all events, or set <em>Waiting list</em> on an individual event to <em>On</em> or <em>Off</em> to override that (the default is to follow the Configuration). Where it is on, it keeps every sold-out ticket clickable on the ticket overview (marked &quot;Waiting list available&quot;), makes the ticket page offer a &quot;Put me on the waiting list&quot; button for it (for a ticket with child tickets, next to every sold-out child ticket), and lets tickets that come free go to waiting customers first. Seated tickets are the only exception (see below)."
COM_TICKETSTATION_WAITINGLIST_DOCS_SCREEN_TITLE="The Waitinglist screen"
COM_TICKETSTATION_WAITINGLIST_DOCS_SCREEN="Lists every unconfirmed or confirmed-but-not-yet-promoted signup; once someone is actually offered a ticket and a payment link, they drop off this list and become a normal Box Office order. Each row shows the event, ticket type, client (or their IP address if they haven't reached checkout yet), signup date, and a Confirmed badge. Select entries to <strong>Confirm</strong> them manually (for a phone signup, or a bounced confirmation email &mdash; equivalent to the customer clicking their own confirmation link), or to <strong>Remove</strong> them."
COM_TICKETSTATION_WAITINGLIST_DOCS_FLOW_TITLE="How it works for the customer, end to end"
COM_TICKETSTATION_WAITINGLIST_DOCS_FLOW_1="On the ticket overview the customer opens a sold-out ticket (it stays clickable while the waiting list is on), chooses the number of tickets and clicks &quot;Put me on the waiting list&quot;; with child tickets, next to the child ticket they want. A confirmation appears on the page and the basket shows the tickets as being on the waiting list."
COM_TICKETSTATION_WAITINGLIST_DOCS_FLOW_2="The customer clicks <em>Continue</em>, reviews the cart and leaves their details at checkout. Only then is the signup linked to a client and the double opt-in email with a confirmation link sent. The customer ends on a page saying they are on the waiting list; the cart is then emptied, so a next signup starts fresh."
COM_TICKETSTATION_WAITINGLIST_DOCS_FLOW_3="Clicking the link in the email confirms the entry (all tickets of that signup at once) and returns the customer to the ticket overview."
COM_TICKETSTATION_WAITINGLIST_DOCS_FLOW_4="When stock frees up &mdash; through the periodic cleanup of unpaid/expired orders, an admin deleting an order in the Box Office, or an admin raising a ticket's Capacity &mdash; freed stock is matched to the oldest confirmed entries first (first in, first out); a signup that needs more tickets than are free is skipped for a later, smaller one. Those customers then receive a time-limited payment link to complete their purchase. Child tickets that share their parent's capacity share one queue: a place that comes free on one of them goes to the oldest customer waiting for any of them. With a capacity per child ticket, every child ticket has its own queue."
COM_TICKETSTATION_WAITINGLIST_DOCS_SEATED_TITLE="Why seated events are excluded"
COM_TICKETSTATION_WAITINGLIST_DOCS_SEATED="This is intentional: the waiting list works by tracking generic ticket-type stock counts and handing freed-up stock to the next person in a first-in-first-out queue. It has no concept of which specific seat became free. Since seated events sell individually chosen seats rather than anonymous stock, that queue/notify model doesn't map onto &quot;seat X, row Y became available&quot;, so seated tickets never expose the waitlist option, however <em>Waiting list active</em> is set."

COM_TICKETSTATION_BASKET_DOCS_TITLE="Basket module"
COM_TICKETSTATION_BASKET_DOCS_INTRO="The basket is a separate Joomla module, <em>Ticketstation Basket</em> (<code>mod_ticketstation_basket</code>), that shows the visitor's cart wherever you place it in the template. Without a published module a customer can only reach the cart through the <em>Continue</em> button. The module is installed together with the component by the Ticketstation package, and requires the component."
COM_TICKETSTATION_BASKET_DOCS_SETUP_TITLE="Setting it up"
COM_TICKETSTATION_BASKET_DOCS_SETUP_1="Go to <em>Content &raquo; Site Modules</em>, click <strong>New</strong> and choose <em>Ticketstation Basket</em>."
COM_TICKETSTATION_BASKET_DOCS_SETUP_2="Pick a template position (for example the header for the mini cart, a sidebar for the full cart), set the <em>Menu Assignment</em> and choose the display mode below."
COM_TICKETSTATION_BASKET_DOCS_SETUP_3="Save and publish. You can publish the module more than once, for instance a mini cart in the header and a full cart in the sidebar."
COM_TICKETSTATION_BASKET_DOCS_MODES_TITLE="The two display modes"
COM_TICKETSTATION_BASKET_DOCS_MODE_MINI="<strong>Mini cart (icon only)</strong> &mdash; a cart icon with the number of tickets, linking to the cart page. Intended for the header or menu bar. The <em>Mini cart icon class</em> setting changes the icon (default <code>fa fa-shopping-basket</code>; any icon font class that is available on your site)."
COM_TICKETSTATION_BASKET_DOCS_MODE_FULL="<strong>Full cart</strong> &mdash; the number of tickets with their subtotal, the service fee and the order total, and a <em>View cart</em> button. With no tickets it says the cart is empty and hides the button. The subtotal is the order total minus the service fee, so it already includes any coupon discount; prices follow the price format and currency from Configuration."
COM_TICKETSTATION_BASKET_DOCS_SETTINGS_TITLE="Module settings"
COM_TICKETSTATION_BASKET_DOCS_SETTINGS_1="<em>Display</em> &mdash; mini cart or full cart (see above)."
COM_TICKETSTATION_BASKET_DOCS_SETTINGS_2="<em>Hide cart when empty</em> &mdash; hides the module (in full mode including its title) while the cart holds no tickets. It appears again as soon as a ticket is added, without reloading the page."
COM_TICKETSTATION_BASKET_DOCS_SETTINGS_3="<em>Alternative Layout</em> and <em>Module Class Suffix</em> (Advanced tab) &mdash; the usual Joomla options for template overrides and extra CSS classes."
COM_TICKETSTATION_BASKET_DOCS_SETTINGS_4="Caching is deliberately switched off and can't be enabled: the cart belongs to the visitor's session, and Joomla's module cache would show one visitor's cart to everybody else."
COM_TICKETSTATION_BASKET_DOCS_BEHAVIOUR_TITLE="How it behaves"
COM_TICKETSTATION_BASKET_DOCS_BEHAVIOUR_1="The module reads the cart of the current visitor's session through the same component code that the cart page and checkout use, so its figures always agree with what the customer sees at checkout."
COM_TICKETSTATION_BASKET_DOCS_BEHAVIOUR_2="It is never shown on the component's own cart, checkout and payment pages (including the payment result), whatever the menu assignment says: a basket next to those pages would be redundant."
COM_TICKETSTATION_BASKET_DOCS_BEHAVIOUR_3="When a customer adds tickets on an event page, the page updates the ticket counter over AJAX. The mini cart shows the new number straight away and the full cart re-reads its totals from the component, so neither needs a page reload."
COM_TICKETSTATION_BASKET_DOCS_BEHAVIOUR_4="If the component is not installed, the module renders nothing."
COM_TICKETSTATION_BASKET_DOCS_MIXED_TITLE="Using both modes on one page"
COM_TICKETSTATION_BASKET_DOCS_MIXED="This works, but the event pages update just <em>one</em> counter per page, found by its fixed id (<code>basket-item-count</code>). That id goes to the mini cart when it is on the page and otherwise to the full cart, so the two always stay in step. Publish at most one mini cart per page: a second one would keep showing the old number until the page is reloaded."

COM_TICKETSTATION_DOCS_NAV_BOXOFFICE="Box Office"
COM_TICKETSTATION_DOCS_NAV_RESERVATION="Reservations"
COM_TICKETSTATION_DOCS_NAV_COUPONS="Coupons"

COM_TICKETSTATION_BOXOFFICE_DOCS_TITLE="Managing orders in the Box Office"
COM_TICKETSTATION_BOXOFFICE_DOCS_INTRO="The <strong>Box Office</strong> lists the orders, newest first. An order appears here as soon as the customer has left their details at checkout, or a reservation has been completed in <strong>New reservation</strong>; a basket that never got that far isn't shown, and is removed by the automatic cleanup. Click an order number to open the order."
COM_TICKETSTATION_BOXOFFICE_DOCS_LIST_TITLE="Finding an order"
COM_TICKETSTATION_BOXOFFICE_DOCS_LIST_1="Filter on event, on payment status (<em>Paid</em>, <em>Not Paid</em>, <em>Refunded</em>, <em>Pending</em>, <em>Refund needs attention</em>) and on whether the tickets were sent, or search on the start of the order number, the customer's name (first and last name together, e.g. <code>Jan Jansen</code>), email address or phone number, a seat number (e.g. <code>A12</code>), the Order Reference, the customer note or the code of a ticket's QR code. Changing a filter or the search goes back to the first page. The filters and search stay set until you change them or click <em>Clear</em>."
COM_TICKETSTATION_BOXOFFICE_DOCS_LIST_2="A complete order number, or the code of a ticket's QR code, opens that order straight away and clears the search. At the desk you can click in the search field and scan a ticket with a QR scanner that types into it."
COM_TICKETSTATION_BOXOFFICE_DOCS_LIST_3="Per order the list shows the customer and order date, a <em>Removed</em> badge (see Things to know) and a red icon when tickets are blocked; the events with their tickets, the Order Reference, a <em>Customer note</em> (hover to read it) and <em>DISCOUNT</em> when a coupon was used (hover for the code); the number of tickets, the order price (the amount paid, or else what the customer pays, service fee included) and the payment status. The <em>Tickets</em> column shows whether the tickets were created and sent (green: all of them, orange: some) and whether the customer downloaded them; <em>Scanned</em> shows how many tickets were scanned, e.g. <em>2/4</em>. <em>Confirmed</em> is set once a payment was started or completed, a payment link was sent, or the status was changed with the <em>Actions</em> menu."
COM_TICKETSTATION_BOXOFFICE_DOCS_LIST_4="Above the list a line counts the matching orders, their tickets and how many were scanned; removed orders don't count, their tickets were released. An order with tickets for several events shows every event, and appears when you filter on any of them: the other events are then greyed out, and the number of tickets reads e.g. <em>2 / 5</em>, the tickets for the filtered event out of the whole order."
COM_TICKETSTATION_BOXOFFICE_DOCS_LIST_5="<em>Export</em> downloads the tickets of the orders in the list, with the current filters and search, as a CSV file for a spreadsheet: one line per ticket with the order, customer, event, ticket, seat, price, payment status, scan time, whether it is blocked and the Order Reference. With an event filter on it holds only the tickets for that event, which makes it a guest list. Removed orders are left out."
COM_TICKETSTATION_BOXOFFICE_DOCS_STATUS_TITLE="Payment statuses"
COM_TICKETSTATION_BOXOFFICE_DOCS_STATUS_1="<strong>Not Paid</strong> &mdash; the customer left their details but never went on to pay, the order was saved in <strong>New reservation</strong> with <em>Already paid</em> set to <em>No</em>, or it was set to <em>Unpaid</em> by hand."
COM_TICKETSTATION_BOXOFFICE_DOCS_STATUS_2="<strong>Pending</strong> &mdash; the customer was sent to Mollie's payment page, or a payment link was sent with <em>Resend Payment</em>, and no payment has come in yet. A failed, cancelled or expired payment leaves the order pending; its history shows what happened."
COM_TICKETSTATION_BOXOFFICE_DOCS_STATUS_3="<strong>Paid</strong> &mdash; paid online, completed with <em>Complete Order</em>, reserved as <em>Already paid</em>, or set to <em>Paid</em> by hand."
COM_TICKETSTATION_BOXOFFICE_DOCS_STATUS_4="<strong>Refunded</strong> / <strong>Partly refunded</strong> &mdash; shown next to <em>Paid</em> once (part of) the order was refunded; see <em>Refunds</em> below. The <em>Refunded</em> filter also shows orders that were marked as refunded before version 2.9.0; those only have the status <em>Refunded</em>."
COM_TICKETSTATION_BOXOFFICE_DOCS_STATUS_5="At the door only tickets of paid orders are accepted. Not Paid and Pending orders are removed by the automatic cleanup after <em>Remove Unpaid/Pending Orders after</em> (days, counted from the order date, or from the last payment link sent with <em>Resend Payment</em>; see Configuration &raquo; Orders). Paid and refunded orders stay until you delete them, and keep their tickets and seats taken, except tickets a refund released."
COM_TICKETSTATION_BOXOFFICE_DOCS_ACTIONS_TITLE="Actions on selected orders"
COM_TICKETSTATION_BOXOFFICE_DOCS_ACTIONS_INTRO="Tick one or more orders in the list and choose from the <em>Actions</em> menu. <em>New reservation</em>, on the left of the toolbar, starts a phone or walk-in booking."
COM_TICKETSTATION_BOXOFFICE_DOCS_ACTIONS_1="<em>Complete Order</em> &mdash; for a payment you received yourself, such as cash or a bank transfer: marks the order as paid, creates the tickets and emails them to the customer, with the invoice when <em>Send Invoice After payment</em> is on, whatever <em>Send tickets directly</em> says. On an order that already has tickets it makes the files again; the QR codes stay the same."
COM_TICKETSTATION_BOXOFFICE_DOCS_ACTIONS_2="<em>Mark as paid</em> &mdash; only sets the payment status to Paid: it doesn't create or send tickets."
COM_TICKETSTATION_BOXOFFICE_DOCS_ACTIONS_3="<em>Resend Payment</em> &mdash; emails the customer a link to pay the order online (mail template <em>Sending Payment Link</em>) and sets it to <em>Pending</em>. The cleanup period starts again at that moment, so the customer has the full <em>Remove Unpaid/Pending Orders after</em> period to pay; the order date stays as it was. Paid and refunded orders are skipped; a message lists them."
COM_TICKETSTATION_BOXOFFICE_DOCS_ACTIONS_4="Refunds are not in this menu: open the order and choose <em>Payment</em> &rsaquo; <em>Refund...</em>, so you can choose per ticket what happens to it (see <em>Refunds</em> below)."
COM_TICKETSTATION_BOXOFFICE_DOCS_ACTIONS_5="<em>Send tickets</em> &mdash; emails the tickets that were already created to the customer, as a completed payment does (with the invoice when <em>Send Invoice After payment</em> is on). The QR codes stay the same. Orders that aren't paid, or whose tickets haven't all been created yet, are skipped; a message lists them. The number of orders per go is limited; when you tick more, a message says how many are allowed."
COM_TICKETSTATION_BOXOFFICE_DOCS_ACTIONS_6="<em>Delete</em> &mdash; removes the order for good: its tickets and ticket files, invoice, transaction, refunds, Order Reference and customer note. Its tickets and seats become available again, going to the waiting list first when it is on. This can't be undone."
COM_TICKETSTATION_BOXOFFICE_DOCS_ORDER_TITLE="Inside an order"
COM_TICKETSTATION_BOXOFFICE_DOCS_ORDER_INTRO="The order screen has three tabs: <em>Overview</em>, <em>Tickets in Order</em> and <em>History</em>; it reopens on the tab you used last. The toolbar acts on the whole order and only offers what applies to it: a paid order can't be marked as paid again, and tickets can only be resent or downloaded once they exist."
COM_TICKETSTATION_BOXOFFICE_DOCS_ORDER_1="<em>Payment</em> &mdash; <em>Complete Order</em>, <em>Mark as paid</em> and <em>Resend Payment</em> work as in the list. <em>Mark as not paid</em> sets the status back to Not Paid. <em>Refund...</em> opens the refund screen of a paid order (see <em>Refunds</em>). Marking as paid or not paid only changes the status, which is noted in the history: it doesn't create or send tickets."
COM_TICKETSTATION_BOXOFFICE_DOCS_ORDER_2="<em>Tickets</em> &rsaquo; <em>Resend</em> &mdash; emails the existing tickets to the customer again (mail template <em>resending Tickets</em>). The QR codes stay the same, so tickets sent earlier stay valid. <em>Download</em> downloads the tickets of the order as one PDF file."
COM_TICKETSTATION_BOXOFFICE_DOCS_ORDER_3="<em>Tickets</em> &rsaquo; <em>Create Tickets</em> &mdash; makes the ticket files again, for example after changing the Order Reference. A ticket keeps the QR code it got the first time, so tickets sent earlier stay valid. Send the new files with <em>Resend</em> if the customer should have them."
COM_TICKETSTATION_BOXOFFICE_DOCS_ORDER_4="<em>Send Invoice</em> &mdash; creates the invoice if the order has none yet and emails it; an existing invoice keeps its number."
COM_TICKETSTATION_BOXOFFICE_DOCS_ORDER_5="For a payment received outside the website, use <em>Complete Order</em>: it marks the order as paid and sends the tickets in one go."
COM_TICKETSTATION_BOXOFFICE_DOCS_TICKETS_TITLE="Tickets in Order"
COM_TICKETSTATION_BOXOFFICE_DOCS_TICKETS_1="This tab lists the tickets per event, with their ticket number, seat, QR code (click the code to see it) and when and by whom they were scanned, and whether they are blocked. The box in the heading of an event's table ticks all its tickets. Use <em>Mark as scanned</em> / <em>Mark as not scanned</em> to change the scan status by hand; you are then recorded as the scanner, with the current time."
COM_TICKETSTATION_BOXOFFICE_DOCS_TICKETS_2="<em>Block</em> / <em>Unblock</em> &mdash; a blocked ticket is refused at the door, whatever its payment status. <em>New QR code</em> &mdash; after you confirm, gives the ticked tickets a new QR code and makes the ticket files again, so the copies sent earlier no longer scan, for instance for a lost or stolen ticket. Send the new tickets with <em>Resend</em>."
COM_TICKETSTATION_BOXOFFICE_DOCS_TICKETS_3="<em>Remove Ticket</em> &mdash; after you confirm, takes the ticked tickets out of the order and releases them and their seats, going to the waiting list first when it is on. A coupon discount is spread again over the tickets that are left; a fixed service fee stays the same and a variable one is calculated again over what is left; with a fixed and variable fee the fixed part stays and the percentage is calculated again. The payment and an existing invoice are not changed. To give the customer money back, use <em>Refund...</em> instead: it keeps the tickets in the order, marked as refunded. The files of the tickets that are left are made again straight away; those tickets keep their QR codes, so the customer's copies stay valid. Removing the last ticket removes the whole order, with its invoice and transaction."
COM_TICKETSTATION_BOXOFFICE_DOCS_DETAILS_TITLE="Overview and History"
COM_TICKETSTATION_BOXOFFICE_DOCS_DETAILS_1="<em>Overview</em> shows the order number and date, the events in the order with their date and number of tickets, the order price (the amount paid, click it to see the payment in <strong>Transactions</strong>; for an order that isn't paid yet, what the customer will pay), the payment status, the payment method when the order was paid online, the invoice (click its number to open it), the coupon and discount, the service fee the order was placed with (<em>None</em> for a reservation), the VAT included in the order, and the customer, with a link to their details in <strong>Customers</strong>. A <em>Tickets</em> panel shows how many tickets were created, sent and scanned, and whether the customer downloaded them."
COM_TICKETSTATION_BOXOFFICE_DOCS_DETAILS_2="<em>Order Reference</em> &mdash; a note of at most 35 characters, e.g. a name for a group booking, saved with <em>Update</em> and removed with the cross next to it. It is shown and searchable in the list, and printed on the tickets when they are made (see the Ticket layout topic). The <em>Customer note</em> the customer typed in the basket is shown with the customer and can't be edited."
COM_TICKETSTATION_BOXOFFICE_DOCS_DETAILS_3="<em>History</em> lists everything that happened to the order, with the time and, where known, who did it: the order being placed, payments started, failed or completed, tickets created and sent, status changes and removals."
COM_TICKETSTATION_BOXOFFICE_DOCS_GOTCHAS_TITLE="Things to know"
COM_TICKETSTATION_BOXOFFICE_DOCS_GOTCHA_1="Orders removed by the automatic cleanup stay in the list with a <em>Removed</em> badge. Opening one shows a read-only summary with its history; its tickets and seats are already free. <em>Delete</em> takes it out of the list."
COM_TICKETSTATION_BOXOFFICE_DOCS_GOTCHA_2="A refunded order stays in the list. Its tickets and seats stay taken unless the refund released them; see <em>Refunds</em>."
COM_TICKETSTATION_BOXOFFICE_DOCS_GOTCHA_3="The mails sent from the Box Office use the texts on the <strong>Templates</strong> screen of the control panel."
COM_TICKETSTATION_BOXOFFICE_DOCS_GOTCHA_4="Phone and walk-in bookings are made with <strong>New reservation</strong> (also in the Box Office toolbar); see the Reservations topic."
COM_TICKETSTATION_BOXOFFICE_DOCS_GOTCHA_5="After paying, the customer can download their tickets once from the payment result page, and only in the same browser session; a download icon in the <em>Tickets</em> column shows whether they did. After that the page points them to the <em>Lost tickets</em> page, which emails the tickets again, and you can send them (again) with <em>Resend</em>. The same page offers <em>Add to calendar</em>: a calendar file (.ics) with the events of the order, their start and end time and the venue."

COM_TICKETSTATION_RESERVATION_DOCS_TITLE="Phone and walk-in bookings: New reservation"
COM_TICKETSTATION_RESERVATION_DOCS_INTRO="<strong>New reservation</strong> books tickets for a customer without the website's checkout, for example over the phone or at the desk. Open it with <em>Reservations</em> on the control panel or <em>New reservation</em> in the Box Office toolbar."
COM_TICKETSTATION_RESERVATION_DOCS_STEPS_TITLE="The four steps"
COM_TICKETSTATION_RESERVATION_DOCS_STEP_1="<strong>Choose event and ticket.</strong> Every event is listed, published or not. For the chosen event you see its tickets whose <em>End Date &amp; Time</em> hasn't passed, published or not, with price and availability. A child ticket appears as <em>Parent - Child</em>; the child tickets of a seated ticket aren't listed separately, as they are sold through its seat chart."
COM_TICKETSTATION_RESERVATION_DOCS_STEP_2="<strong>Number of tickets</strong>, or for a seated ticket <strong>Choose seats</strong> on the chart (see the Seated tickets topic for price categories and blocked seats). The capacity is checked as on the website; the ticket's minimum and maximum order quantity don't apply. For more than one kind of ticket in the same reservation, go <em>Back</em> to step 1 and choose the next ticket: what you added stays in the reservation."
COM_TICKETSTATION_RESERVATION_DOCS_STEP_3="<strong>Customer details:</strong> first and last name, email address and phone number; the last name and email address are required. An existing customer with the same email address is reused, and their name and phone number are updated."
COM_TICKETSTATION_RESERVATION_DOCS_STEP_4="<strong>Confirm reservation:</strong> check the tickets and the total and set <em>Already paid</em>. <em>Yes</em> marks the order as paid, creates the tickets and emails them to the customer straight away (with the invoice when <em>Send Invoice After payment</em> is on), whatever <em>Send tickets directly</em> says. <em>No</em> saves the order without tickets (see below)."
COM_TICKETSTATION_RESERVATION_DOCS_STEP_5="After <em>Complete reservation</em> a new reservation starts straight away while <em>Start a new reservation immediately</em> is on (the default); switch it off to open the order in the Box Office instead. With <em>For the same event</em> on (the default) the new reservation starts with the same event selected, and with <em>For the same ticket</em> on as well (the default) it skips step 1 and starts with the same ticket. When that ticket can no longer be booked (ended, sold out), step 1 shows the event instead. <em>Cancel</em>, available in every step, removes what was added so far and frees its seats."
COM_TICKETSTATION_RESERVATION_DOCS_UNPAID_TITLE="Reservations that are not yet paid"
COM_TICKETSTATION_RESERVATION_DOCS_UNPAID_1="The order appears in the Box Office as <em>Not Paid</em>, without tickets. Its tickets and seats are held for it."
COM_TICKETSTATION_RESERVATION_DOCS_UNPAID_2="When the customer pays you directly, select the order in the Box Office and use <em>Complete Order</em>: the tickets are made and emailed. To let the customer pay online, use <em>Resend Payment</em>: they get a payment link by email. A paid or refunded order gets no payment link."
COM_TICKETSTATION_RESERVATION_DOCS_UNPAID_3="<strong>An unpaid reservation is removed by the automatic cleanup</strong> after <em>Remove Unpaid/Pending Orders after</em> (days, counted from the moment of the reservation), which releases its tickets. <em>Resend Payment</em> starts that period again."
COM_TICKETSTATION_RESERVATION_DOCS_GOTCHAS_TITLE="Things to know"
COM_TICKETSTATION_RESERVATION_DOCS_GOTCHA_1="Reservations don't go through Mollie, and test mode doesn't affect them. A reservation never has a service fee, also when the customer pays it later through a payment link."
COM_TICKETSTATION_RESERVATION_DOCS_GOTCHA_2="A reservation can't use a coupon."
COM_TICKETSTATION_RESERVATION_DOCS_GOTCHA_3="Until <em>Complete reservation</em>, the automatic cleanup of unfinished orders treats the tickets in a reservation like a cart on the website. While a step of the reservation is open in the browser, they stay reserved for as long as you need. A reservation left halfway, for instance when the browser was closed before step 4, holds its tickets until the cleanup removes them <em>Remove Unfinished Orders after</em> the page was last open, or never when the automatic cleanup is off. Use <em>Cancel</em> to release them at once. When you come back to a reservation whose tickets were released, step 3 or 4 says so and the reservation starts again with the same event."
COM_TICKETSTATION_RESERVATION_DOCS_GOTCHA_4="On a seat chart with price categories, choose the category above the chart before clicking a free seat. Blocked seats show grey and can be booked after a confirmation; they then count as sold."
COM_TICKETSTATION_RESERVATION_DOCS_GOTCHA_5="While a step of New reservation is open in the browser, you stay logged in, also when you spend longer on it than the <em>Session Lifetime</em> in Joomla's Global Configuration, for instance while typing customer details during a phone call. When the computer goes to sleep or the tab is closed for longer than that, the session can still end; after logging in again the reservation starts over at step 1, and the tickets added before are released by the automatic cleanup of unfinished orders."

COM_TICKETSTATION_COUPONS_DOCS_TITLE="Discount coupons"
COM_TICKETSTATION_COUPONS_DOCS_INTRO="A coupon gives the customer a discount on their order, or on certain tickets in it, when they enter its code in the shopping basket. The code field is only shown when <em>Show coupon system</em> is on (Configuration &raquo; General). Coupons are managed on the <strong>Coupons</strong> screen of the control panel."
COM_TICKETSTATION_COUPONS_DOCS_SETUP_TITLE="Creating a coupon"
COM_TICKETSTATION_COUPONS_DOCS_SETUP_1="<em>Name</em> &mdash; for your own reference; customers never see it."
COM_TICKETSTATION_COUPONS_DOCS_SETUP_2="<em>Couponcode</em> &mdash; the code customers type: letters and digits, e.g. <code>PRESS2026</code>. It is saved in capitals and must be unique; customers can type it in capitals or lower case."
COM_TICKETSTATION_COUPONS_DOCS_SETUP_3="<em>Coupon type</em> and <em>Coupon discount</em> &mdash; a <em>Percentage</em> of the tickets in the order, or an <em>Amount</em> off the order as a whole, as a whole number. An amount never takes off more than the tickets cost: a coupon of 25 on tickets of 20 makes the order free."
COM_TICKETSTATION_COUPONS_DOCS_SETUP_4="<em>Limited to</em> &mdash; how many orders may use the code, 0 for no limit (see below). <em>Expiration date</em> &mdash; the last day the code is accepted; leave it empty for no end date. Unpublish a coupon to stop accepting it without deleting it."
COM_TICKETSTATION_COUPONS_DOCS_SETUP_5="<em>Valid for</em> &mdash; leave it empty for a coupon on the whole order, or pick the tickets it is meant for. A parent ticket includes its child tickets (sections and price categories of a seat plan, too). <em>Valid for events</em> works the same for whole events: all their tickets count, also tickets added to the event later. Both can be combined. A code for other tickets than the ones in the basket is refused with a message."
COM_TICKETSTATION_COUPONS_DOCS_HOW_TITLE="How the discount works"
COM_TICKETSTATION_COUPONS_DOCS_HOW_1="One coupon per order: once a code has been accepted, another one is refused, and it can't be taken off again. Tickets added to the basket afterwards get the discount too."
COM_TICKETSTATION_COUPONS_DOCS_HOW_2="The discount comes off the ticket total; a variable service fee (or the percentage of a fixed and variable one) is then calculated over what is left. An order that becomes free this way skips Mollie and is completed straight away."
COM_TICKETSTATION_COUPONS_DOCS_HOW_3="The coupon's terms are recorded on the order when the code is accepted: changing, unpublishing or deleting the coupon later doesn't change orders that already use it."
COM_TICKETSTATION_COUPONS_DOCS_HOW_4="On the invoice the discount is spread over the ticket lines in proportion to their price, and the VAT is calculated over the discounted prices. In the Box Office an order with a coupon shows a <em>DISCOUNT</em> badge in the list, and the code and the discount in the order itself."
COM_TICKETSTATION_COUPONS_DOCS_HOW_5="A coupon limited to certain tickets takes its discount over those tickets only: a percentage of what they cost, or the amount but never more than they cost. The other tickets in the order keep their full price; on the invoice only the discounted lines mention the code."
COM_TICKETSTATION_COUPONS_DOCS_USAGE_TITLE="How uses are counted"
COM_TICKETSTATION_COUPONS_DOCS_USAGE="<em>Used / Limit</em> on the Coupons screen is the number of orders that carry the code, whatever their status: in the basket, unpaid, paid or refunded. An order counts from the moment the code is accepted in the basket, so an abandoned basket holds a use for a while. The use comes back as soon as the order is gone: removed by the automatic cleanup of unfinished and unpaid orders (Configuration &raquo; Orders), or deleted in the Box Office. Once the limit is reached, customers get &quot;This discount code has reached its limit.&quot;"
COM_TICKETSTATION_COUPONS_DOCS_GOTCHAS_TITLE="Things to know"
COM_TICKETSTATION_COUPONS_DOCS_GOTCHA_1="A coupon can't be limited to certain events or tickets: a code works for every ticket in the shop."
COM_TICKETSTATION_COUPONS_DOCS_GOTCHA_2="With the automatic cleanup off, the uses held by abandoned baskets never come back."
COM_TICKETSTATION_COUPONS_DOCS_GOTCHA_3="The control panel lists under <em>Needs attention</em> the published coupons that expire within 7 days or have used 90% or more of their limit."
COM_TICKETSTATION_COUPONS_DOCS_GOTCHA_4="Reservations made with <strong>New reservation</strong> can't use a coupon."

COM_TICKETSTATION_DOCS_NAV_GETTINGSTARTED="Getting started"
COM_TICKETSTATION_DOCS_NAV_CONTROLPANEL="Control panel"
COM_TICKETSTATION_DOCS_NAV_RECORDS="Venues, customers &amp; transactions"
COM_TICKETSTATION_DOCS_NAV_TEMPLATES="Email templates"
