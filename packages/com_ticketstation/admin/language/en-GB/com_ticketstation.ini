; Documentation: permissions
COM_TICKETSTATION_DOCS_NAV_PERMISSIONS="Permissions"
COM_TICKETSTATION_PERMISSIONS_DOCS_TITLE="Permissions"
COM_TICKETSTATION_PERMISSIONS_DOCS_INTRO="Ticketstation uses Joomla's own permissions (ACL) to decide which backend users may do what. Each screen and each action checks one permission; a screen someone may not open is left off their Dashboard, and most buttons they may not use are hidden. Trying anyway shows a message that they are not permitted. Super Users can always do everything. The frontend is not affected: who may scan tickets is set under Ticket Scanning."
COM_TICKETSTATION_PERMISSIONS_DOCS_ACTIONS_TITLE="The permissions and their defaults"
COM_TICKETSTATION_PERMISSIONS_DOCS_COL_ACTION="Permission"
COM_TICKETSTATION_PERMISSIONS_DOCS_COL_ALLOWS="Allows"
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_ADMIN="Changing these permissions (the <strong>Permissions</strong> button on the Dashboard and in the Configuration)."
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_OPTIONS="The Configuration, the Payments settings (including the payment plugins) and the Templates."
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_MANAGE="Opening Ticketstation: the Dashboard, this Documentation and the lists of events, tickets, venues, coupons and seat plans."
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_CREATE="Adding events, tickets, venues and coupons, and copying tickets."
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_EDIT="Changing events, tickets, venues and coupons, the seat plan editor, seat plan templates and the ticket layout."
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_EDITSTATE="Publishing and unpublishing events, tickets, venues and coupons."
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_DELETE="Deleting events, tickets, venues and coupons."
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_BOXOFFICE="The Box Office, Customers and Waiting List: viewing orders, resending tickets, invoices and payment requests, remarks, scan states, blocking tickets, new QR codes and the export."
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_RESERVE="Reservations. Saving a reservation as <em>Already paid</em> also needs Register payments; without it a reservation is saved as not yet paid."
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_SCANNERS="Ticket Scanning: linking scanners to users, events and tickets, and their API keys."
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_PAYMENT="Changing an order's payment status by hand (Complete Order, Mark as paid, Mark as not paid) and refunding orders, which sends money back through the payment provider and can make tickets invalid or release them. Marking an order paid sends its tickets, so keep this for people you trust with money."
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_FINANCE="Transactions and Invoicing."
COM_TICKETSTATION_PERMISSIONS_DOCS_ALLOWS_ORDER_DELETE="Deleting orders (with their transaction, remarks and invoice), single tickets of an order, and customers."
COM_TICKETSTATION_PERMISSIONS_DOCS_DEFAULTS="These defaults are set once, when Ticketstation is installed or first updated to a version with permissions. Create, edit, publish and delete come from Joomla's Global Configuration, which gives them to Managers and Administrators. Other groups have no backend access unless you give it."
COM_TICKETSTATION_PERMISSIONS_DOCS_CHANGE_TITLE="Changing permissions"
COM_TICKETSTATION_PERMISSIONS_DOCS_CHANGE_1="Click <strong>Permissions</strong> in the toolbar of the Dashboard or the Configuration. Choose a group on the left and set each permission to <em>Allowed</em>, <em>Denied</em> or <em>Inherited</em>. <em>Denied</em> always wins, also over a permission the group inherits."
COM_TICKETSTATION_PERMISSIONS_DOCS_CHANGE_2="A user only reaches the backend with Joomla's <em>Administrator Login</em> permission (System &raquo; Global Configuration &raquo; Permissions), which Managers and Administrators have by default."
COM_TICKETSTATION_PERMISSIONS_DOCS_GROUP_TITLE="Example: a group for the box office"
COM_TICKETSTATION_PERMISSIONS_DOCS_GROUP_1="For staff at the door or on the phone, create a user group (Users &raquo; Groups), for example <em>Box office</em> under Public. Give it <em>Administrator Login</em> in the Global Configuration and add it to the <em>Special</em> access level (Users &raquo; Access Levels), because the backend menu, toolbar and user menu are only shown to that level. Then give it <em>Access Administration Interface</em>, <em>Box Office</em> and <em>Make reservations</em> in Ticketstation's permissions. Add <em>Register payments</em> if they take cash or card payments at the door."

