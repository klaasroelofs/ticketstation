COM_TICKETSTATION_DOCS_NAV_WALLET="Apple &amp; Google Wallet"
COM_TICKETSTATION_WALLET_DOCS_TITLE="Apple Wallet and Google Wallet"
COM_TICKETSTATION_WALLET_DOCS_INTRO="Customers can add their tickets to <strong>Apple Wallet</strong> (iPhone, Apple Watch) or <strong>Google Wallet</strong> (Android). The ticket mail and the payment result page then show an <em>Add to Apple Wallet</em> and/or <em>Add to Google Wallet</em> button. A pass in the wallet shows the same QR code as the PDF ticket, so the ticket scanner accepts it as it is. Both wallets are optional and independent of each other. Each needs an account at Apple or Google, which you set up once with the steps below; the settings are on the <em>Wallet</em> tab of the Configuration."
COM_TICKETSTATION_WALLET_DOCS_CUSTOMER_TITLE="What customers get"
COM_TICKETSTATION_WALLET_DOCS_CUSTOMER_1="<em>The ticket mail</em> &mdash; the mail with the tickets (<em>sending Tickets after successful Payment</em>) and the copy sent with <em>Resend</em> in the Box Office or from the Lost tickets page show the buttons of the wallets that are on, with a line asking to open the mail on the phone. The placeholder <code>{walletbuttons}</code> puts them where you want in those two templates; without it, they are added at the bottom of the mail. The PDF tickets stay attached as before."
COM_TICKETSTATION_WALLET_DOCS_CUSTOMER_2="<em>The payment result page</em> &mdash; after a successful payment, a block <em>Add to your wallet</em> with the same buttons appears below the download button."
COM_TICKETSTATION_WALLET_DOCS_CUSTOMER_3="<em>One button for the whole order</em> &mdash; every ticket becomes a pass of its own, and the button adds all tickets of the order at once. On an iPhone that takes iOS 15 or later when the order has more than one ticket. Google Wallet shows all tickets and saves them in one go. Each pass can be shared from the wallet, for example with the friend a ticket was bought for: Google Wallet allows a ticket to be saved by more than one person, and an Apple pass can be sent on like a file. A shared pass is the same ticket with the same QR code, just like a forwarded PDF ticket: the scanner lets in whoever comes first."
COM_TICKETSTATION_WALLET_DOCS_CUSTOMER_4="<em>What a pass shows</em> &mdash; the event, the date and time, the venue, the ticket, the seat (for seated tickets), which ticket of the order it is (<em>2 of 4</em>) and the QR code. The back of an Apple pass, or the details of a Google pass, add the order number, the ticket number, the customer's name, the venue's address and your company details from Configuration &raquo; Company. The texts are in the site's default language, like the PDF tickets. Apple shows the pass on the lock screen around the start of the event."
COM_TICKETSTATION_WALLET_DOCS_CUSTOMER_5="<em>The links</em> &mdash; every button link is signed for its order, so it can't be made from an order number, and it keeps working: a customer can add the tickets again later, for example on a new phone. Only valid tickets go into the wallet; tickets made invalid by a refund, and blocked tickets, are left out."
COM_TICKETSTATION_WALLET_DOCS_APPLE_TITLE="Setting up Apple Wallet"
COM_TICKETSTATION_WALLET_DOCS_APPLE_INTRO="You need a membership of the <a href='https://developer.apple.com/programs/' target='blank' rel='noopener'>Apple Developer Program</a> (99 USD a year). The steps at Apple must be done by the <em>Account Holder</em> or an <em>Admin</em> of the team. No Mac is needed: Ticketstation makes the certificate request itself."
COM_TICKETSTATION_WALLET_DOCS_APPLE_1="Sign in at <a href='https://developer.apple.com/account/resources/identifiers/list/passTypeId' target='blank' rel='noopener'>Certificates, Identifiers &amp; Profiles</a> and register a <strong>Pass Type ID</strong>: <em>Identifiers</em> &rsaquo; <em>+</em> &rsaquo; <em>Pass Type IDs</em> &rsaquo; <em>Continue</em>. Enter a description, for example <em>Tickets</em>, and an identifier in reverse-domain style that starts with <code>pass.</code>, for example <code>pass.com.yourtheatre.tickets</code>. Click <em>Continue</em> and <em>Register</em>."
COM_TICKETSTATION_WALLET_DOCS_APPLE_2="In Ticketstation, open Configuration &raquo; <em>Wallet</em> and click <em>Create certificate request</em>. Your browser downloads <code>ticketstation.certSigningRequest</code>. The private key that belongs to it is kept in the site's database."
COM_TICKETSTATION_WALLET_DOCS_APPLE_3="Back at Apple, open <em>Certificates</em> &rsaquo; <em>+</em>, choose <em>Pass Type ID Certificate</em> under <em>Services</em> and click <em>Continue</em>. Choose the Pass Type ID of step 1, upload the request file of step 2 with <em>Choose File</em>, click <em>Continue</em> and then <em>Download</em>. You get a <code>.cer</code> file (usually <code>pass.cer</code>)."
COM_TICKETSTATION_WALLET_DOCS_APPLE_4="In Ticketstation, choose that file at <em>Step 2: certificate from Apple</em>, set <em>Offer Apple Wallet</em> to <em>Yes</em> and save. The Wallet tab then shows the Pass Type ID, your Team ID and the date the certificate is valid until."
COM_TICKETSTATION_WALLET_DOCS_APPLE_5="Try it: send yourself the tickets of an order (order a free ticket, or use <em>Resend</em> in the Box Office), open the mail on an iPhone and tap <em>Add to Apple Wallet</em>."
COM_TICKETSTATION_WALLET_DOCS_APPLE_P12="<em>Already have the certificate in the Keychain of a Mac?</em> Export it together with its private key as a <code>.p12</code> file and upload it under <em>Already have the certificate as a .p12 file?</em> with the password you gave it, instead of steps 2 to 4. A .p12 exported by an older macOS uses an encryption that current servers can't read. Ticketstation then says it can't read the file; use the certificate request instead."
COM_TICKETSTATION_WALLET_DOCS_APPLE_RENEW="<em>Renewing</em> &mdash; a Pass Type ID certificate is valid for a limited time; the Wallet tab shows until when. Before that date, make a new certificate the same way (steps 2 to 4). The certificate in use keeps working until you upload the new one. After the expiry date Apple Wallet is no longer offered to customers until a new certificate is stored; passes customers already added stay in their wallets."
COM_TICKETSTATION_WALLET_DOCS_GOOGLE_TITLE="Setting up Google Wallet"
COM_TICKETSTATION_WALLET_DOCS_GOOGLE_INTRO="Google Wallet is free. You need a Google account to manage it, and you set up two things: an <em>issuer account</em> in the Google Pay &amp; Wallet Console, and a <em>service account</em> in the Google Cloud console that lets Ticketstation create passes for that issuer account."
COM_TICKETSTATION_WALLET_DOCS_GOOGLE_1="Sign in at the <a href='https://pay.google.com/business/console/' target='blank' rel='noopener'>Google Pay &amp; Wallet Console</a> with the Google account that should become its admin. Fill in your public business name and accept the terms. Then click <em>Create a pass</em> in the <em>Google Wallet API</em> card, then <em>Build your first pass</em>, and accept the Google Wallet API terms: this creates your issuer account. You don't have to design a pass there; Ticketstation sends its own."
COM_TICKETSTATION_WALLET_DOCS_GOOGLE_2="Copy the <strong>Issuer ID</strong>, the long number at the top of the <em>Google Wallet API</em> page of the console, to <em>Issuer ID</em> on the Wallet tab in Ticketstation."
COM_TICKETSTATION_WALLET_DOCS_GOOGLE_3="In the <a href='https://console.cloud.google.com/' target='blank' rel='noopener'>Google Cloud console</a>, create a project (or choose an existing one) and click <em>Enable</em> on the <a href='https://console.cloud.google.com/apis/library/walletobjects.googleapis.com' target='blank' rel='noopener'>Google Wallet API</a> page."
COM_TICKETSTATION_WALLET_DOCS_GOOGLE_4="Open <a href='https://console.cloud.google.com/iam-admin/serviceaccounts/create' target='blank' rel='noopener'>Create service account</a>, enter a name, for example <em>ticketstation</em>, and click <em>Done</em>; it needs no roles. Note its email address (ending in <code>.iam.gserviceaccount.com</code>). Open the service account, go to <em>Keys</em> &rsaquo; <em>Add key</em> &rsaquo; <em>Create new key</em>, choose <em>JSON</em> and click <em>Create</em>. Your browser downloads a <code>.json</code> key file. Keep it safe: with it, anyone can create passes in your name."
COM_TICKETSTATION_WALLET_DOCS_GOOGLE_5="Back in the Google Pay &amp; Wallet Console, open <em>Users</em> &rsaquo; <em>Invite a user</em>, enter the email address of the service account, set <em>Access level</em> to <em>Developer</em> and click <em>Invite</em>."
COM_TICKETSTATION_WALLET_DOCS_GOOGLE_6="In Ticketstation, choose the key file at <em>Service account key</em>, set <em>Offer Google Wallet</em> to <em>Yes</em> and save. The Wallet tab then shows the service account the key belongs to."
COM_TICKETSTATION_WALLET_DOCS_GOOGLE_7="Try it with your own Google account (the admin of the console): send yourself the tickets of an order, open the mail on an Android phone and tap <em>Add to Google Wallet</em>. This also creates the first <em>pass class</em> in your issuer account, which Google requires before you can go live."
COM_TICKETSTATION_WALLET_DOCS_GOOGLE_8="Go live: complete the <em>Business profile</em> in the console, then click <em>Request publishing access</em> on the <em>Google Wallet API</em> page. Google reviews the request and lets you know when it is approved."
COM_TICKETSTATION_WALLET_DOCS_GOOGLE_DEMO="<em>Demo mode</em> &mdash; until publishing access is approved, the issuer account is in demo mode: only the console's admins and developers, and the test users you add there, can save the passes, which then read <em>[TEST ONLY]</em>. Other customers get an error from Google when they tap the button. So test at a quiet moment, or set <em>Offer Google Wallet</em> back to <em>No</em> after testing until the approval is in."
COM_TICKETSTATION_WALLET_DOCS_LOOK_TITLE="The look of the passes"
COM_TICKETSTATION_WALLET_DOCS_LOOK_1="<em>Pass logo</em> &mdash; an image from the Media Manager, PNG or JPG (an SVG can't be used; WebP and AVIF only when PHP on the server supports them). Apple shows it at the top of the pass, fitted into a 160 &times; 50 area, so a wide logo works best; it is also used for the pass's small icon. Google shows it as a round logo, so it is centred on a circle in the background colour. Without a logo, Apple passes show the company name and a ticket icon, and Google passes have no logo. Google fetches the logo from your site, so it only appears when the site uses https and can be reached from the internet. When the chosen logo can't be used, the Wallet tab says why below the logo field."
COM_TICKETSTATION_WALLET_DOCS_LOOK_2="<em>Background colour</em> and <em>Text colour</em> &mdash; Apple uses both; Google only uses the background colour and chooses a readable text colour itself. A light logo on a transparent background suits a dark background colour, and a dark logo a light one."
COM_TICKETSTATION_WALLET_DOCS_LOOK_3="Changes to the logo and colours apply to passes added from then on; passes already in a wallet keep their look."
COM_TICKETSTATION_WALLET_DOCS_GOTCHAS_TITLE="Things to know"
COM_TICKETSTATION_WALLET_DOCS_GOTCHA_4="<em>Not ready</em> &mdash; a wallet that is switched on without a valid certificate, Issuer ID or key isn't offered to customers; saving the Configuration warns about it. The same goes for an Apple certificate that has expired."
COM_TICKETSTATION_WALLET_DOCS_GOTCHA_5="<em>Keys</em> &mdash; the Apple certificate with its private key and the Google key file are stored in the site's database, like the Mollie API keys, and are never shown in the Configuration again. <em>Remove the stored ...</em> on the Wallet tab deletes them and switches that wallet off. Making a certificate request or uploading files needs the <em>Configuration</em> permission, like the rest of the Configuration."
COM_TICKETSTATION_WALLET_DOCS_GOTCHA_6="<em>When something goes wrong</em> &mdash; when a pass can't be made, for example because the certificate was revoked at Apple, the customer lands on the home page with a message that points to your contact email. The reason is written to <code>com_ticketstation_wallet.php</code> in the site's log folder (Global Configuration &raquo; System &raquo; Path to Log Folder). An error that Google shows on its own page (for example in demo mode) is not logged."
COM_TICKETSTATION_WALLET_DOCS_GOTCHA_7="<em>The buttons</em> &mdash; the buttons are the official <em>Add to Apple Wallet</em> and <em>Add to Google Wallet</em> badges, in the site language when available (English, Dutch, German, French and Spanish) and in English otherwise."

