COM_TICKETSTATION_VAR_TRANSACTION_COSTS_DESC="The fee customers pay per order on top of the tickets. When setting this option to 'Variable', be sure you have entered a percentage under 'Variable Fee'. If set to 'Fixed', be sure to fill in 'Fixed Fee'. 'Fixed and variable' charges the percentage of 'Variable Fee' plus the amount of 'Fixed Fee'. If set to 'None', no service fee is calculated or shown to customers. An order keeps the fee it was placed with."
