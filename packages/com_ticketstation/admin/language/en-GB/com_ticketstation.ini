COM_TICKETSTATION_WALLET_GOOGLE_UPDATES_DESC="Keeps the passes customers already saved in Google Wallet in line with their tickets: a changed time or venue, a refunded or blocked ticket (the pass becomes inactive) and a new QR code, and lets you show a message on the passes. This needs the service account to be added as a user of your issuer in the Google Pay and Wallet Console, with the role Developer or Admin. Changes are sent in portions: a first portion right away, the rest by the Scheduled Task Ticketstation wallet updates."
