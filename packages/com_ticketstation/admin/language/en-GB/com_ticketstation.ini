COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_7="To tell the buyers of an event something, or to bring their wallet passes in line after a change, select the event and click <em>Communication</em>. The screen has two actions: <em>Message to the buyers</em> (a new start time, another location, a cancellation: pick a suggestion or write your own text, send a test to yourself first, then send it by mail, to the passes in Apple and Google Wallet, or both) and <em>Update the tickets in the wallets</em> (no text; it brings the passes in line with the event as it is now). A third part shows what has been sent. After you save an event or ticket with a changed date, time, venue or name, and the event has buyers, a notice points to this screen. For a cancelled event you can refund the orders in the Box Office. A reminder shortly before the event can be sent automatically (see Email templates)."
COM_TICKETSTATION_WALLET_DOCS_LIVE_4="<em>A changed event</em> &mdash; after you change the time, the venue or the name, open <em>Communication</em> in the Events list and click <em>Update the passes</em>. That is all: no subject or text is needed. This keeps you in control: nothing goes to the devices of your customers until you click it. The screen shows how many passes it reaches: Google passes, and Apple passes that an iPhone registered for. After saving an event or ticket whose date, time, venue or name changed, a notice points to this screen."
COM_TICKETSTATION_WALLET_DOCS_LIVE_5="<em>A message on the passes</em> &mdash; on the same screen, under <em>Message to the buyers</em>, check <em>As a message on the passes in the wallets</em>. The subject becomes the title, your text (without formatting) the message, and customers get a notification (on an iPhone as a change of the <em>Message</em> field on the back of the pass). Uncheck <em>By mail</em> to reach the wallets only. Google limits how many notifications a pass may give, so use it sparingly."
COM_TICKETSTATION_WALLET_DOCS_LIVE_3="<em>What follows the ticket by itself</em> &mdash; a ticket that is refunded or blocked (a Google pass becomes inactive, which takes it off the active passes until the ticket is unblocked; an Apple pass is marked void), a new QR code from the Box Office, and a deleted order or ticket (a Google pass expires; an Apple pass is marked void and expired) are sent to the pass at once."
COM_TICKETSTATION_WALLET_DOCS_GOTCHA_3="<em>Refunds, blocked and deleted tickets</em> &mdash; the scanner refuses the ticket in any case, just like the PDF ticket. With live updates on, the pass also shows it: inactive or expired at Google, void at Apple. Neither wallet lets a pass be taken out of the customer's wallet from outside: a Google pass can only expire, an Apple pass only be marked void and expired, and the customer can delete it. For a deleted order Ticketstation keeps, for Apple only, a copy of the void pass without the QR code and without anything about the customer or the order, so the iPhones that still have it can fetch it."
