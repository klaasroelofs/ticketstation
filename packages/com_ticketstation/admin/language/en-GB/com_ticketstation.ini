COM_TICKETSTATION_CURRENCY="Website currency"
COM_TICKETSTATION_CURRENCY_DESC="The currency symbol or code shown next to prices on the site, tickets and invoices, e.g. &euro; or EUR. The currency customers pay in is set on the Payments screen."
COM_TICKETSTATION_DATEFORMAT="Date format"
COM_TICKETSTATION_DATEFORMAT_DESC="How dates are shown in the backend, in mails, on tickets and on invoices. Pick a suggestion from the list (the examples show the 14th of March 2026) or type your own PHP date format: <code>d</code> day with a leading zero, <code>j</code> day, <code>m</code> month with a leading zero, <code>n</code> month, <code>Y</code> year with four digits, <code>y</code> with two. Any other character, such as <code>-</code>, <code>/</code> or <code>.</code>, is shown as typed."
COM_TICKETSTATION_TIMEFORMAT="Time format"
COM_TICKETSTATION_TIMEFORMAT_DESC="How times are shown in the backend and on wallet passes. Pick a suggestion from the list (the examples show five past nine in the morning) or type your own PHP time format: <code>H</code> hours 00-23, <code>G</code> hours 0-23, <code>h</code> and <code>g</code> the same on a 12-hour clock, <code>i</code> minutes, <code>s</code> seconds, <code>A</code> AM or PM."
COM_TICKETSTATION_FORMAT_CURRENT="%s (current setting)"
COM_TICKETSTATION_PRICES="Prices format"
COM_TICKETSTATION_PRICES_DESC="How prices are shown on the website, in mails, on tickets and on invoices, and in the backend. Set the number of decimals, the decimal point, the thousands separator and whether the currency symbol comes before or after the amount; the example below the fields updates as you change them. Choose <em>Only when needed</em> to show 12 instead of 12.00 for whole amounts, or <em>no decimals</em> for currencies without decimals. The decimal point and the thousands separator must differ."
COM_TICKETSTATION_SHOW_AVAILABILITY="Availability bar on ticket page"
COM_TICKETSTATION_SHOW_AVAILABILITY_DESC="Show the availability bar (percentage of tickets left) on the ticket page of events without seat numbers."
COM_TICKETSTATION_SHOW_QUANTITY="Tickets left in eventlist"
COM_TICKETSTATION_SHOW_QUANTITY_DESC="Show the number of tickets left in the upcoming events list, for events with and without seat numbers."
COM_TICKETSTATION_SHOW_PRICE_EVENT="Prices in eventlist"
COM_TICKETSTATION_SHOW_PRICE_EVENT_DESC="Show the prices for your tickets in the eventlist view."
COM_TICKETSTATION_SHOW_VENUE="Show venue"
COM_TICKETSTATION_SHOW_VENUE_DESC="Show the location line (venue and city) in the upcoming events list and on the ticket pages of events with and without seat numbers."
COM_TICKETSTATION_SHOW_VENUE_ADDRESS="Show venue address"
COM_TICKETSTATION_SHOW_VENUE_ADDRESS_DESC="Show the street and zipcode of the venue below the location line on the ticket pages of events with and without seat numbers. Only applies when Show venue is enabled."
COM_TICKETSTATION_SHOW_VENUE_DESCRIPTION="Show venue description"
COM_TICKETSTATION_SHOW_VENUE_DESCRIPTION_DESC="Show the description of the venue on the ticket pages of events with and without seat numbers. Only applies when Show venue is enabled."
COM_TICKETSTATION_SHOW_VENUE_WEBSITE="Show venue website"
COM_TICKETSTATION_SHOW_VENUE_WEBSITE_DESC="Show a link to the website of the venue on the ticket pages of events with and without seat numbers. Only applies when Show venue is enabled."
COM_TICKETSTATION_SHOW_JSONLD="Search engine data"
COM_TICKETSTATION_SHOW_JSONLD_DESC="Add machine-readable event data (schema.org JSON-LD) to the events list, the ticket pages and the seat-chart pages, so search engines can show date, venue and price. Switch this off on a test or staging site, so its events don't end up in search results. It doesn't stop search engines from indexing the pages themselves."
COM_TICKETSTATION_VENUE_INTERNAL_CONTACT="Internal contact details"
COM_TICKETSTATION_VENUE_INTERNAL_CONTACT_DESC="These details are for your own administration and are never shown to visitors."
COM_TICKETSTATION_SHOW_COUPON_SYSTEM="Show coupon system"
COM_TICKETSTATION_SHOW_REMARKS_IN_CART="Show remarks in cart"
COM_TICKETSTATION_SHOW_REMARKS_IN_CART_DESC="When your customer is at the overview of his order (Cart) we have added the option to add remarks to the current order. They can tell you special wishes for this order, e.g. when you are using it for restaurants, people can give some additional information about their diet or maybe you're all vegetarian.<br/>The note is shown with the order in the Box Office (as <em>Customer note</em>) and is not printed on the tickets."
COM_TICKETSTATION_CUSTOMER_NOTE="Customer note"
COM_TICKETSTATION_SHOW_WAITING_LIST="Waiting list active"
COM_TICKETSTATION_SHOW_WAITING_LIST_SEATPLAN_DISCLAIMER="Currently only works for tickets sold without a seat plan (counter/quantity tickets). Seated tickets do not offer a waiting list option and are not affected by this setting."
COM_TICKETSTATION_REMOVAL_SETTINGS="Ticket removal settings"
COM_TICKETSTATION_AUTO_REMOVE="Automatic removal of unfinished/pending tickets"
COM_TICKETSTATION_AUTO_REMOVE_DESC="To keep available tickets up-to-date, we need to remove unpaid tickets from the database."
COM_TICKETSTATION_REMOVE_AFTER_X_DAYS="Remove Unpaid/Pending Orders after"
COM_TICKETSTATION_REMOVE_AFTER_X_DAYS_DESC="An Order will have the status 'Pending', when payment has not yet been received. For instance when a payment link was sent or when a certain payment method was selected, like bank transfer."
COM_TICKETSTATION_AUTO_REMOVE_AFTER_X_HOURS="Remove Unfinished Orders after"
COM_TICKETSTATION_AUTO_REMOVE_AFTER_X_HOURS_DESC="Orders are considered Unfinished as long as they are not paid and customer details have not yet been filled in. Tickets were added to the Cart, but the customer never went beyond that point.<br/>Recommended: 30 mins / 1 hour."
