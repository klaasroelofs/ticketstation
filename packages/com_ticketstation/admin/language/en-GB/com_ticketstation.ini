COM_TICKETSTATION_GETTINGSTARTED_DOCS_TITLE="Getting started: from installation to the first sale"
COM_TICKETSTATION_GETTINGSTARTED_DOCS_INTRO="This checklist takes a fresh installation to a working shop; each step names the topic below that covers it in full. Work through it with Mollie in test mode: you can then place orders without paying, and customers don't see the shop yet."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_STEPS_TITLE="Checklist"
COM_TICKETSTATION_GETTINGSTARTED_DOCS_STEP_1="<strong>Company details</strong> &mdash; open <strong>Configuration</strong> and fill in the <em>Company</em> tab: name, address, email and the sender of the mails. A fresh installation holds example data there, and the control panel lists it under <em>Needs attention</em> until it is replaced. On the <em>General</em> tab, check the currency and the date and price formats (see Configuration)."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_STEP_2="<strong>Mail</strong> &mdash; make sure Joomla can send mail (<em>System &raquo; Global Configuration &raquo; Server</em>): tickets, payment links and invoices all go out by mail. Adjust the texts on the <strong>Templates</strong> screen where needed (see Email templates)."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_STEP_3="<strong>Mollie</strong> &mdash; open <strong>Mollie</strong>, enter the test and live API keys from the Mollie Dashboard, choose the payment methods and switch <em>Test Mode</em> on; it is off after installation (see Payments (Mollie))."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_STEP_4="<strong>Venue</strong> (optional) &mdash; add the location on the <strong>Venues</strong> screen if you want it shown with the tickets (see Venues, customers &amp; transactions)."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_STEP_5="<strong>Event and ticket</strong> &mdash; create an event and at least one ticket with its price, VAT and capacity, and publish both: the website only shows published tickets of published events. Set a sales stop, or the ticket stays on sale after the event (see Events &amp; tickets)."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_STEP_6="<strong>Menu item</strong> &mdash; in <em>Menus</em>, create a menu item of type <em>Ticketstation &raquo; Show Upcoming events</em>. This is the front page of the shop: it lists the published tickets per event, and from there customers open a ticket, put it in the cart and check out."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_STEP_7="<strong>Basket module</strong> &mdash; publish the <em>Ticketstation Basket</em> module in a template position, so customers can see and reach their cart (see Basket module)."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_STEP_8="<strong>Test order</strong> &mdash; log in on the website itself, with any Joomla user account: in test mode the shop is closed to visitors who aren't logged in. Order a ticket, pay on Mollie's test page and check the payment result page, the mail with the tickets, the invoice (when <em>Send Invoice After payment</em> is on) and the order in the <strong>Box Office</strong>. Mollie has to be able to reach the site for this (see Payments (Mollie) &raquo; Things to know)."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_STEP_9="<strong>Going live</strong> &mdash; delete the test orders in the Box Office, switch <em>Test Mode</em> off and check that <em>Needs attention</em> on the control panel shows no Mollie or company warnings. From then on everyone can order."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_GOTCHAS_TITLE="Things to know"
COM_TICKETSTATION_GETTINGSTARTED_DOCS_GOTCHA_1="All Ticketstation pages &mdash; ticket pages, cart, checkout, payment result and the links in mails &mdash; are placed under the published <em>Show Upcoming events</em> menu item (the first-created one when there are several), and get its address and module assignment. Without that item they go under the first-created published Ticketstation menu item of another type, and without any Ticketstation menu item the shop still works, at addresses starting with <code>/component/ticketstation/</code>."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_GOTCHA_2="Customers don't need a user account: they order as guests and are recognised by their email address (see Venues, customers &amp; transactions)."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_GOTCHA_3="A sale can be announced in advance: an unpublished event with <em>Automatically (un)publish event</em> is shown under <em>Upcoming events</em>, with a countdown, in the month before its publish date (see Events &amp; tickets and Automatic tasks)."
COM_TICKETSTATION_GETTINGSTARTED_DOCS_GOTCHA_4="Two more menu item types are optional. <em>Ticketstation &raquo; Single ticket</em> opens the order page of one parent ticket directly, for example for a poster or a campaign: the seat chart for a seated ticket, otherwise the ticket page with its child tickets. <em>Ticketstation &raquo; Lost tickets</em> is a page where customers enter their email address and get their tickets again: one mail per paid order with a ticket for an event that hasn't ended yet, the same mail as the <em>Resend</em> button of an order in the Box Office. The page always gives the same answer, so it doesn't reveal whether an address has ordered, sends an order at most once per 15 minutes, and uses the site's default captcha from the Global Configuration when one is set. Each mail is logged in the order's history."

COM_TICKETSTATION_CONTROLPANEL_DOCS_TITLE="The control panel"
COM_TICKETSTATION_CONTROLPANEL_DOCS_INTRO="The control panel is the start page of Ticketstation in the backend. From top to bottom it shows urgent warnings, a <em>Getting started</em> checklist on a new installation, the sales figures, the sales per day, the availability of the coming tickets, a list of things that need your attention, the buttons to every screen and, at the bottom, the version."
COM_TICKETSTATION_CONTROLPANEL_DOCS_START_TITLE="Getting started"
COM_TICKETSTATION_CONTROLPANEL_DOCS_START="As long as one of these steps is still open, a <em>Getting started</em> card at the top links to it: company details filled in (the same check as in <em>Needs attention</em>), something entered in the Mollie <em>Live API key</em> field, and at least one venue, one event and one ticket created. Unpublished venues, events and tickets count too. The card disappears once all five are done."
COM_TICKETSTATION_CONTROLPANEL_DOCS_FIGURES_TITLE="Your box office at a glance"
COM_TICKETSTATION_CONTROLPANEL_DOCS_FIGURES_1="<em>Tickets sold this week</em> (with the difference to the previous week and its total below it), <em>Revenue this week</em> and <em>Revenue this month</em> only count <strong>paid</strong> orders. A week runs from Monday to Sunday and a month is the calendar month, in your own time zone."
COM_TICKETSTATION_CONTROLPANEL_DOCS_FIGURES_2="An order counts in the period of its order date: the moment the customer placed it, or the last time a payment link was sent with <em>Resend Payment</em>. The moment of payment doesn't matter."
COM_TICKETSTATION_CONTROLPANEL_DOCS_FIGURES_3="Revenue is the ticket prices minus any coupon discount, VAT included and service fee excluded."
COM_TICKETSTATION_CONTROLPANEL_DOCS_FIGURES_4="<em>On sale</em> counts the published tickets of published events whose start is still to come, and the events they belong to. Child tickets aren't counted separately."
COM_TICKETSTATION_CONTROLPANEL_DOCS_FIGURES_5="<em>Tickets sold per day</em> shows one bar per day for the last 4 weeks, today included, counting paid tickets by order date like the figures above. Hover over a bar to see the date, the number of tickets and their revenue."
COM_TICKETSTATION_CONTROLPANEL_DOCS_AVAILABILITY_TITLE="Availability of upcoming events"
COM_TICKETSTATION_CONTROLPANEL_DOCS_AVAILABILITY="The ten published tickets that start soonest, with the share that is taken and the number left, calculated as on the website: for a ticket with child tickets over all of them, for a seated ticket the free seats. Taken means in an order, paid or not, so an unpaid order counts until it is paid, removed or deleted. <em>All tickets</em> opens the full ticket list."
COM_TICKETSTATION_CONTROLPANEL_DOCS_ATTENTION_TITLE="Needs attention"
COM_TICKETSTATION_CONTROLPANEL_DOCS_ATTENTION_INTRO="Only what applies right now is listed, each item linking to the screen where you deal with it. The red items (the Mollie warnings and tickets not sent) appear in an <em>Action required</em> bar at the top of the page; the others in the <em>Needs attention</em> card. The button of each screen involved also gets a badge with the number of items, and hovering over the badge lists them."
COM_TICKETSTATION_CONTROLPANEL_DOCS_ATTENTION_1="<strong>Mollie</strong> &mdash; bypass mode on, test mode on, no live API key, a live key that doesn't start with <code>live_</code>, or a test key in the live field."
COM_TICKETSTATION_CONTROLPANEL_DOCS_ATTENTION_2="<strong>Company details</strong> &mdash; the company name, address, postcode, city or email is empty or still holds the example data of a fresh installation. And <strong>no sender address</strong>: mails then go out from Joomla's global sender."
COM_TICKETSTATION_CONTROLPANEL_DOCS_ATTENTION_3="<strong>Payments pending</strong> &mdash; orders that were sent to Mollie's payment page or received a payment link, and haven't been paid yet."
COM_TICKETSTATION_CONTROLPANEL_DOCS_ATTENTION_4="<strong>Tickets not sent</strong> &mdash; paid orders for a ticket that hasn't started yet whose tickets were never emailed, for instance because <em>Send tickets directly</em> is off, the mail could not be sent, or the order was set to <em>Paid</em> by hand. Send them from the Box Office (<em>Complete Order</em>, or <em>Create Tickets</em> and <em>Resend</em>)."
COM_TICKETSTATION_CONTROLPANEL_DOCS_ATTENTION_5="<strong>Unfinished orders</strong> &mdash; orders with the status Not Paid. Only listed while the automatic cleanup is off, as nothing then removes them."
COM_TICKETSTATION_CONTROLPANEL_DOCS_ATTENTION_6="<strong>Waiting list</strong> &mdash; confirmed signups that haven't been offered tickets yet. Only listed while the waiting list is on."
COM_TICKETSTATION_CONTROLPANEL_DOCS_ATTENTION_7="<strong>Coupons</strong> &mdash; published coupons that expire within 7 days, or have used 90% or more of their limit."
COM_TICKETSTATION_CONTROLPANEL_DOCS_ATTENTION_8="<strong>Scheduled tickets</strong> &mdash; published tickets whose sales stop falls within the next 7 days, and unpublished ones that will be published automatically within 7 days."
COM_TICKETSTATION_CONTROLPANEL_DOCS_VERSION_TITLE="Version and updates"
COM_TICKETSTATION_CONTROLPANEL_DOCS_VERSION="The bottom of the page shows the installed version and its release date. When Joomla's update system offers a newer Ticketstation, <em>Update available</em> appears below the version, linking to <em>System &raquo; Update &raquo; Extensions</em>. It uses the same update check and settings as that screen, so both always agree."

COM_TICKETSTATION_RECORDS_DOCS_TITLE="Venues, customers and transactions"
COM_TICKETSTATION_RECORDS_DOCS_INTRO="Three supporting screens on the control panel: <strong>Venues</strong> holds the locations of your events, <strong>Customers</strong> everyone who has ordered or signed up, and <strong>Transactions</strong> the online payments."
COM_TICKETSTATION_RECORDS_DOCS_VENUES_TITLE="Venues"
COM_TICKETSTATION_RECORDS_DOCS_VENUES_1="A venue is chosen per ticket, with the <em>Venue</em> field of the ticket form, which only offers published venues. Two tickets of one event can therefore be at different venues."
COM_TICKETSTATION_RECORDS_DOCS_VENUES_2="On the website, the venue name and city appear in the ticket overview and on the ticket page while <em>Show venue</em> is on (Configuration &raquo; Display). The ticket page can also show the street, postcode and city (<em>Show venue address</em>), the website (<em>Show venue website</em>) and the description (<em>Show venue description</em>)."
COM_TICKETSTATION_RECORDS_DOCS_VENUES_3="The contact person, phone number and email address are for your own reference and aren't shown anywhere. The venue isn't printed on the ticket either: put it in the ticket's own design if you want it there (see Ticket layout)."
COM_TICKETSTATION_RECORDS_DOCS_VENUES_4="A venue that a ticket still uses can't be deleted. Unpublish it instead, so it is no longer offered for new tickets."
COM_TICKETSTATION_RECORDS_DOCS_CUSTOMERS_TITLE="Customers"
COM_TICKETSTATION_RECORDS_DOCS_CUSTOMERS_1="A customer is created at checkout or in <strong>New reservation</strong>, and is recognised by the email address: someone who orders again with the same address gets the same record, and the details they enter replace the earlier ones. Customers are separate from Joomla user accounts."
COM_TICKETSTATION_RECORDS_DOCS_CUSTOMERS_2="The list can be searched on the name (first and last name together, e.g. <code>Jan Jansen</code>) and the email address. Each list in the backend keeps its own search, filters and page, and a new search starts at the first page. Open a customer to change their details and to see their orders, each linking to the order in the Box Office."
COM_TICKETSTATION_RECORDS_DOCS_CUSTOMERS_3="<em>Delete</em> only removes customers without orders and waiting-list signups. The others stay, with a message saying so, because their orders, tickets and invoices refer to them; delete their orders first when the customer has to go (see Personal data)."
COM_TICKETSTATION_RECORDS_DOCS_TRANSACTIONS_TITLE="Transactions"
COM_TICKETSTATION_RECORDS_DOCS_TRANSACTIONS_1="Every online payment that Mollie confirms as paid is recorded here, with its date, customer, order number, payment method and amount, newest first. Orders completed without Mollie &mdash; with <em>Complete Order</em>, as a reservation saved as paid, with a total of 0 or in bypass mode &mdash; get no transaction."
COM_TICKETSTATION_RECORDS_DOCS_TRANSACTIONS_2="Open a transaction to see the details Mollie sent with the payment, such as its Mollie ID, status and amounts. For some payment methods they include the name and account number of the payer."
COM_TICKETSTATION_RECORDS_DOCS_TRANSACTIONS_3="The list can be searched on the customer's name (first and last name together) and the order number. Deleting a transaction only removes this record: the order and the payment in Mollie stay as they are. Deleting an order in the Box Office deletes its transaction too."

COM_TICKETSTATION_TEMPLATES_DOCS_TITLE="Email templates"
COM_TICKETSTATION_TEMPLATES_DOCS_INTRO="Ticketstation sends five kinds of mail to customers, each with its own text on the <strong>Templates</strong> screen of the control panel. Every mail goes to the email address of the customer, from the sender set in Configuration &raquo; Company."
COM_TICKETSTATION_TEMPLATES_DOCS_MAILS_TITLE="The five mails and when they are sent"
COM_TICKETSTATION_TEMPLATES_DOCS_MAIL_1="<em>sending Tickets after successful Payment</em> &mdash; the tickets, as one PDF attachment, plus a calendar file (.ics) with the events of the order that customers can add to their calendar, as soon as an order is paid: after an online payment, for an order with a total of 0 and in bypass mode (these three only while <em>Send tickets directly</em> is on in the Mollie settings), after <em>Complete Order</em> in the Box Office, and for a reservation saved as <em>Already paid</em>."
COM_TICKETSTATION_TEMPLATES_DOCS_MAIL_2="<em>resending Tickets</em> &mdash; the existing tickets again, as a PDF attachment, when you click <em>Resend</em> in an order in the Box Office."
COM_TICKETSTATION_TEMPLATES_DOCS_MAIL_3="<em>Sending Payment Link</em> &mdash; a link to pay the order online, sent with <em>Resend Payment</em> in the Box Office, and to a waiting-list customer when tickets have come free for them."
COM_TICKETSTATION_TEMPLATES_DOCS_MAIL_4="<em>Waiting list confirmation</em> &mdash; the mail with the link that confirms a waiting-list signup, sent once the customer has left their details at checkout (see Waiting list)."
COM_TICKETSTATION_TEMPLATES_DOCS_MAIL_5="<em>Invoice</em> &mdash; the invoice as a PDF attachment, sent right after the tickets when <em>Send Invoice After payment</em> is on, and when you click <em>Send Invoice</em> in an order in the Box Office."
COM_TICKETSTATION_TEMPLATES_DOCS_EDIT_TITLE="Editing a template"
COM_TICKETSTATION_TEMPLATES_DOCS_EDIT_1="Click <em>Edit</em> at a template to change its subject and body. The body is written in the site's text editor and sent as an HTML mail; it can hold 5,000 characters, HTML code included."
COM_TICKETSTATION_TEMPLATES_DOCS_EDIT_2="The right-hand side lists the placeholders of that mail, such as <code>{firstname}</code>, <code>{ordercode}</code> or <code>{orderlist}</code>. They work in the subject and in the body, and are replaced by the details of the customer, the order and your company when the mail is sent. Each mail has its own list: <code>{paymentlink}</code> only works in the payment-link mail, <code>{invoice_id}</code> only in the invoice mail."
COM_TICKETSTATION_TEMPLATES_DOCS_EDIT_3="The payment-link mail must contain <code>{paymentlink}</code> and the waiting-list mail <code>{confirmationlink}</code>, or the customer has nothing to click. Saving without it is refused; what you typed stays in the form."
COM_TICKETSTATION_TEMPLATES_DOCS_EDIT_4="The attachments (tickets, calendar file, invoice) are added automatically and can't be set here."
COM_TICKETSTATION_TEMPLATES_DOCS_GOTCHAS_TITLE="Things to know"
COM_TICKETSTATION_TEMPLATES_DOCS_GOTCHA_1="A template has one text for all customers: the mails don't follow the language of the site or of the customer. Write them in the language of your customers; a fresh installation starts with English texts."
COM_TICKETSTATION_TEMPLATES_DOCS_GOTCHA_2="The sender name and address are the same for all mails and are set in Configuration &raquo; Company, not per template."
COM_TICKETSTATION_TEMPLATES_DOCS_GOTCHA_3="The tickets and invoices themselves are printed in the site's default language (see Configuration &raquo; Documents)."
COM_TICKETSTATION_TEMPLATES_DOCS_GOTCHA_4="When a mail can't be sent, for example because Joomla's mail settings are wrong, the backend shows an error. A failed tickets or invoice mail is also recorded in the order's history; the tickets then stay under <em>Needs attention</em> as not sent and the invoice stays <em>Not Sent</em>, so you can send them again from the Box Office."

COM_TICKETSTATION_AUTOMATION_DOCS_TITLE="What happens automatically"
COM_TICKETSTATION_AUTOMATION_DOCS_INTRO="Ticketstation has no scheduled task (cron job). What it does by itself runs <strong>when someone opens a Ticketstation page</strong>, on the website or in the backend, and only while <em>Automatic removal of unfinished/pending tickets</em> is on (Configuration &raquo; Orders; on after installation). On a quiet site a change therefore happens at the first visit after the set time, not at the exact minute."
COM_TICKETSTATION_AUTOMATION_DOCS_TASKS_TITLE="What runs"
COM_TICKETSTATION_AUTOMATION_DOCS_TASK_1="<strong>Unfinished orders</strong> &mdash; a basket whose customer never left their details is removed <em>Remove Unfinished Orders after</em> (hours) after the tickets were put in it. This also covers a reservation left halfway. The cart page tells the customer until what time their tickets stay reserved."
COM_TICKETSTATION_AUTOMATION_DOCS_TASK_2="<strong>Unpaid and pending orders</strong> &mdash; orders with the status Not Paid or Pending are removed <em>Remove Unpaid/Pending Orders after</em> (days) after their order date, reservations saved as <em>Not yet paid</em> included. <em>Resend Payment</em> in the Box Office starts that period again. Removed orders stay visible in the Box Office with a <em>Removed</em> badge."
COM_TICKETSTATION_AUTOMATION_DOCS_TASK_3="<strong>Released tickets</strong> &mdash; the tickets and seats of removed orders become available again. With the waiting list on, they are first offered to confirmed waiting-list customers, who get a payment link by mail."
COM_TICKETSTATION_AUTOMATION_DOCS_TASK_4="<strong>Tickets</strong> &mdash; a ticket with <em>Use Auto Publish</em> is published once its <em>Automatic Publish Date</em> has passed, and one with <em>Use Sales Stop</em> is unpublished once its sales stop has passed."
COM_TICKETSTATION_AUTOMATION_DOCS_TASK_5="<strong>Events</strong> &mdash; an event with <em>Automatically (un)publish event</em> is published at the first date and unpublished after the second."
COM_TICKETSTATION_AUTOMATION_DOCS_GOTCHAS_TITLE="Things to know"
COM_TICKETSTATION_AUTOMATION_DOCS_GOTCHA_1="With the switch off none of this happens: unpaid orders keep their tickets until you delete them (the control panel then lists them as unfinished orders), and the publish and sales-stop dates of tickets and events are ignored."
COM_TICKETSTATION_AUTOMATION_DOCS_GOTCHA_2="Switching it on works straight away. After switching it off, tickets and events can still be (un)published by their dates in sessions that were already open, until those sessions end; orders are no longer removed."
COM_TICKETSTATION_AUTOMATION_DOCS_GOTCHA_3="The countdown under <em>Upcoming events</em> reloads the page when it reaches zero. That visit publishes the event, so it appears in the list, with its published tickets, straight away."
COM_TICKETSTATION_AUTOMATION_DOCS_GOTCHA_4="Payments don't depend on any of this: Mollie reports every payment to the site as soon as it has a result (see Payments (Mollie))."

COM_TICKETSTATION_PRIVACY_DOCS_TITLE="Personal data (GDPR)"
COM_TICKETSTATION_PRIVACY_DOCS_INTRO="Ticketstation stores the personal data it needs to sell and check tickets. As the organiser you are responsible for it: describe it in your privacy statement (linked on the payment page, see Configuration &raquo; Company), and handle requests to see or remove data yourself with the screens below."
COM_TICKETSTATION_PRIVACY_DOCS_STORED_TITLE="What is stored"
COM_TICKETSTATION_PRIVACY_DOCS_STORED_1="<strong>Customers</strong> &mdash; first name, last name and email address, plus the checkout fields you switched on (Configuration &raquo; Checkout): salutation, address lines, postcode, city, country, phone number and birthday. Also the IP address the first order came from; for a customer created in <strong>New reservation</strong>, that of the admin."
COM_TICKETSTATION_PRIVACY_DOCS_STORED_2="<strong>Orders</strong> &mdash; per ticket the IP address it was ordered from, the customer note, the Order Reference and the order history, which records among other things the email address the tickets and invoices were sent to."
COM_TICKETSTATION_PRIVACY_DOCS_STORED_3="<strong>Waiting list</strong> &mdash; each signup with its IP address and, once the customer has checked out, the link to the customer."
COM_TICKETSTATION_PRIVACY_DOCS_STORED_4="<strong>Payments</strong> &mdash; the details Mollie sends with every online payment, which can include the name and account number of the payer (see Venues, customers &amp; transactions)."
COM_TICKETSTATION_PRIVACY_DOCS_STORED_5="<strong>Files</strong> &mdash; the ticket and invoice PDFs, in the <code>tickets</code> and <code>invoices</code> folders under <code>administrator/components/com_ticketstation</code>. Invoices carry the customer's name and address."
COM_TICKETSTATION_PRIVACY_DOCS_RETENTION_TITLE="How long it is kept"
COM_TICKETSTATION_PRIVACY_DOCS_RETENTION_1="There is no automatic retention period. The automatic cleanup only removes orders that were never paid; paid and refunded orders, customers, invoices and transactions stay until you delete them."
COM_TICKETSTATION_PRIVACY_DOCS_RETENTION_2="An order removed by the cleanup stays in the Box Office as <em>Removed</em>, with a copy of its details in its history, until you delete it there."
COM_TICKETSTATION_PRIVACY_DOCS_REMOVE_TITLE="Removing someone's data"
COM_TICKETSTATION_PRIVACY_DOCS_REMOVE_1="Delete the customer's orders in the Box Office (search on their email address). This removes the tickets and their files, the invoice, the transaction, the Order Reference, the customer note and the order history. When you have to keep invoices for your accounts, save a copy first."
COM_TICKETSTATION_PRIVACY_DOCS_REMOVE_2="Remove their waiting-list signups on the <strong>Waitinglist</strong> screen."
COM_TICKETSTATION_PRIVACY_DOCS_REMOVE_3="Then delete the customer on the <strong>Customers</strong> screen."

