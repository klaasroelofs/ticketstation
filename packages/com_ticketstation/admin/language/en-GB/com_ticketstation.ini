COM_TICKETSTATION_BOXOFFICE_DOCS_REFUND_TITLE="Refunds"
COM_TICKETSTATION_BOXOFFICE_DOCS_REFUND_INTRO="A paid order can be refunded in whole or in part. The order always stays in the Box Office; the list and the order show <em>Partly refunded</em> or <em>Refunded</em>, and the <em>Refunds</em> block on the order's Overview lists every refund with its status."
COM_TICKETSTATION_BOXOFFICE_DOCS_REFUND_1="<em>Payment</em> &rsaquo; <em>Refund...</em> in an order opens the refund screen. Choose per ticket what happens to it and enter the amount; it follows the tickets you choose, with the service fee when you tick it, until you type your own. For an order paid through Mollie the refund is made at Mollie straight away, or Mollie's error is shown and nothing changes. The tickets keep their status until Mollie has processed the refund, usually the next working day: until then you can still cancel the refund in the Mollie Dashboard, and the tickets stay as they were. Meanwhile the order shows <em>Waiting for Mollie</em> at those tickets. For an order paid in another way, pay the money back yourself: the refund is only registered, and the tickets change straight away."
COM_TICKETSTATION_BOXOFFICE_DOCS_REFUND_2="Per ticket: <em>Refunded, stays valid</em> (a gesture of goodwill; the customer still gets in), <em>Invalid, place stays taken</em> (refused at the door, not sold again) or <em>Invalid and released</em> (refused at the door, and the ticket or seat is for sale again, going to the waiting list first when it is on). A released ticket can't be changed afterwards. Invalid tickets are left out of the ticket files, so <em>Resend</em> and <em>Download</em> only hold the valid ones."
COM_TICKETSTATION_BOXOFFICE_DOCS_REFUND_3="A refund or chargeback made in the Mollie Dashboard is picked up when the dashboard or the Box Office is opened: at most every five minutes they look at the latest refunds and chargebacks of the Mollie account. Mollie's webhook also reports it once Mollie processes it, usually the next working day. It appears under <em>Needs attention</em> on the dashboard and as <em>Decision needed</em> in the order until you click <em>Decide</em>: the amount is fixed, and the tickets whose prices make up that amount are proposed. Leaving every ticket unchanged is a decision too. Once saved, the notice disappears. As with a refund made in the Box Office, the tickets only change once Mollie has processed the refund; if it is cancelled in Mollie before that, they stay as they were."
COM_TICKETSTATION_BOXOFFICE_DOCS_REFUND_4="A refund that is cancelled in Mollie before it is processed leaves the tickets as they were. Mollie doesn't report a cancellation, so the order checks with Mollie when you open it while tickets are waiting. If a refund fails after it was processed, or a chargeback is reversed, <em>Needs attention</em> says so, because the tickets were already dealt with; check them and click <em>Seen</em> in the order. <em>Sync with Mollie</em> fetches the refunds of the payment when a webhook didn't arrive, and refunds made before version 2.9.0."
COM_TICKETSTATION_BOXOFFICE_DOCS_REFUND_5="Refunding needs the <em>Register payments</em> permission. Orders marked as refunded before 2.9.0 keep that status. A credit note is not made automatically."


