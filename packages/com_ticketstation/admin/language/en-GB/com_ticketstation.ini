COM_TICKETSTATION_WALLET_APPLE_UPDATES_DESC="Keeps the passes customers saved in Apple Wallet in line with their tickets: a changed time or venue, a refunded or blocked ticket (the pass is marked void) and a new QR code, and lets you show a message on the passes. Passes get a web service address and are updated through push notifications; this needs the plugin System - Ticketstation to be enabled, a site on https and, for the notifications, a server whose cURL supports HTTP/2. Only passes added after this version can be updated: customers with an older pass add their tickets once more."
