COM_TICKETSTATION_WALLET_UPDATE_FAILED="%d passes could not be updated. The wallet answered: %s. The reason is kept with the pass and it is tried again by the Scheduled Task."
COM_TICKETSTATION_CONFIG_DOCS_TAB_WALLET_1="<em>Offer Apple Wallet</em>, <em>Offer Google Wallet</em>, <em>Live updates</em> for each of them, the Apple certificate, the Google <em>Issuer ID</em> and service account key, and the <em>Pass logo</em> and colours &mdash; let customers add their tickets to Apple Wallet or Google Wallet, and keep the passes in line with the tickets afterwards. Setting both up is covered step by step under the Apple &amp; Google Wallet topic below."
COM_TICKETSTATION_WALLET_DOCS_LIVE_TITLE="Live updates and messages"
COM_TICKETSTATION_WALLET_DOCS_LIVE_1="<em>Setup for Google</em> &mdash; in Configuration &raquo; Wallet switch on <em>Live updates</em> under Google Wallet. The service account must be a user of your issuer in the Google Pay and Wallet Console, with the role Developer or Admin (step 5 above gives it Admin, which is enough), and the Google Wallet API must be enabled in the Google Cloud project that owns the key."
COM_TICKETSTATION_WALLET_DOCS_LIVE_2="<em>Setup for Apple</em> &mdash; switch on <em>Live updates</em> under Apple Wallet. The site must be on https, and the plugin <em>System - Ticketstation</em> (installed with Ticketstation) must be enabled: it answers the requests of Apple Wallet. For the notifications that tell an iPhone about a change, your server's cURL must support HTTP/2; below the setting the Configuration shows what your server supports and the web service address the passes get. Only passes added after live updates were switched on can be updated: customers with an older pass add their tickets once more."
COM_TICKETSTATION_WALLET_DOCS_LIVE_6="<em>How an Apple update reaches the phone</em> &mdash; Ticketstation sends an empty push notification to the iPhones that have the pass; the iPhone then fetches the new pass by itself. Without HTTP/2 on the server no notification can be sent, and the change arrives when the customer opens Wallet. A Google pass is changed at Google directly. A changed event of an approved Google issuer is reviewed by Google first, so the passes show the new details a little later; messages and refunds are not held back."
COM_TICKETSTATION_WALLET_DOCS_LIVE_7="<em>In portions</em> &mdash; a first portion is sent right away; the rest by the Scheduled Task <em>Ticketstation wallet updates</em> (System, Scheduled Tasks, every 15 minutes). A pass that fails keeps its reason and is tried again. A Google pass the customer never saved has nothing to update, and an Apple pass without an iPhone registered for it is left alone."
COM_TICKETSTATION_WALLET_DOCS_GOTCHA_1="<em>Older Apple passes</em> &mdash; a pass added to Apple Wallet before live updates were switched on holds the ticket as it was when the customer added it, just like a PDF ticket already sent. It can't be updated; the customer adds the tickets again with the same button. Google passes are updated whatever their age."
COM_TICKETSTATION_WALLET_DOCS_GOTCHA_2="<em>New QR code</em> &mdash; with live updates on, the passes get the new code by themselves, an Apple pass replaces the old one. Without live updates the pass in the wallet still has the old code, which no longer scans: send the tickets again with <em>Resend</em>."
