PLG_TICKETSTATIONPAYMENT_MOLLIE="Ticketstation Betalen - Mollie"
PLG_TICKETSTATIONPAYMENT_MOLLIE_XML_DESCRIPTION="Laat klanten bestellingen van Ticketstation betalen via Mollie (iDEAL, Bancontact, creditcard en meer) en handelt terugbetalingen en chargebacks af. Kies Mollie als betaalprovider op het scherm Betalingen van Ticketstation."
PLG_TICKETSTATIONPAYMENT_MOLLIE_API_KEY="API-sleutel (live)"
PLG_TICKETSTATIONPAYMENT_MOLLIE_API_KEY_DESC="De live API-sleutel van Mollie (begint met 'live_')."
PLG_TICKETSTATIONPAYMENT_MOLLIE_API_KEY_TEST="API-sleutel (test)"
PLG_TICKETSTATIONPAYMENT_MOLLIE_API_KEY_TEST_DESC="De test-API-sleutel van Mollie (begint met 'test_')."
PLG_TICKETSTATIONPAYMENT_MOLLIE_TEST_MODE="Testmodus"
PLG_TICKETSTATIONPAYMENT_MOLLIE_TEST_MODE_DESC="Betalingen gaan naar de testomgeving van Mollie; er wordt geen geld overgemaakt. Zolang de testmodus aan staat, zien alleen bezoekers die op de website zijn ingelogd de tickets en kunnen alleen zij bestellen."
PLG_TICKETSTATIONPAYMENT_MOLLIE_PAYMENT_METHODS="Betaalmethoden"
PLG_TICKETSTATIONPAYMENT_MOLLIE_PAYMENT_METHODS_DESC="De methoden waaruit klanten kunnen kiezen. Bij meer dan één kiest de klant op de betaalpagina van deze website; bij één gaat de klant meteen naar die methode bij Mollie. Elke methode moet ook actief zijn in je Mollie Dashboard. Apple Pay verschijnt alleen op Apple-apparaten, dus kies minstens één andere methode. Google Pay valt onder creditcard: Mollie toont het op geschikte apparaten zodra het ook actief is in je Mollie Dashboard. De valuta stel je in bij de Configuratie van Ticketstation."
PLG_TICKETSTATIONPAYMENT_MOLLIE_METHOD_NOT_ACTIVE="Niet actief in Mollie"
PLG_TICKETSTATIONPAYMENT_MOLLIE_GOOGLEPAY_NOT_ACTIVE="Google Pay niet actief in Mollie"
PLG_TICKETSTATIONPAYMENT_MOLLIE_METHODS_UNKNOWN="Kon niet bij Mollie nagaan welke methoden actief zijn in je account (geen API-sleutel ingevuld of geen verbinding)."
PLG_TICKETSTATIONPAYMENT_MOLLIE_METHOD_CREDITCARD="Creditcard"
PLG_TICKETSTATIONPAYMENT_MOLLIE_METHOD_CREDITCARD_GOOGLEPAY="(inclusief Google Pay)"
PLG_TICKETSTATIONPAYMENT_MOLLIE_METHOD_GIFTCARD="Cadeaukaarten"
PLG_TICKETSTATIONPAYMENT_MOLLIE_METHOD_EURO_ONLY="Alleen in euro's"
PLG_TICKETSTATIONPAYMENT_MOLLIE_DESCRIPTION="Omschrijving betaling"
PLG_TICKETSTATIONPAYMENT_MOLLIE_DESCRIPTION_DESC="Deze omschrijving, gevolgd door het bestelnummer, ziet de klant tijdens het betalen. Ze staat ook op het bankafschrift van de klant."
PLG_TICKETSTATIONPAYMENT_MOLLIE_LANGUAGE="Taal van de betaalpagina"
PLG_TICKETSTATIONPAYMENT_MOLLIE_LANGUAGE_DESC="De taal van de betaalpagina van Mollie."
PLG_TICKETSTATIONPAYMENT_MOLLIE_MARK_PENDING="Bestelling markeren als wachtend op betaling"
PLG_TICKETSTATIONPAYMENT_MOLLIE_MARK_PENDING_DESC="Bij Ja krijgt een bestelling de status 'wacht op betaling' zodra de klant naar Mollie wordt gestuurd, zodat hij in de Kassa staat terwijl de klant betaalt."
PLG_TICKETSTATIONPAYMENT_MOLLIE_ERROR_NO_KEY="Er is geen Mollie API-sleutel ingesteld voor de huidige modus (test of live)."
PLG_TICKETSTATIONPAYMENT_MOLLIE_ATTENTION_TEST="Mollie staat in testmodus"
PLG_TICKETSTATIONPAYMENT_MOLLIE_ATTENTION_KEY_MISSING="Mollie live API-sleutel ontbreekt"
PLG_TICKETSTATIONPAYMENT_MOLLIE_ATTENTION_KEY_INVALID="Mollie live API-sleutel is niet geldig (moet beginnen met 'live_')"
PLG_TICKETSTATIONPAYMENT_MOLLIE_ATTENTION_KEY_IS_TEST="Er is een Mollie test-API-sleutel ingevuld als live API-sleutel"
PLG_TICKETSTATIONPAYMENT_MOLLIE_ERROR_INVALID_KEY="De Mollie API-sleutel voor de huidige modus is niet geldig (hij moet beginnen met test_ of live_)."
