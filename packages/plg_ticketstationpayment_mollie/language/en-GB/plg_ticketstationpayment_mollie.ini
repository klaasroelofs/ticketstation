PLG_TICKETSTATIONPAYMENT_MOLLIE="Ticketstation Payment - Mollie"
PLG_TICKETSTATIONPAYMENT_MOLLIE_XML_DESCRIPTION="Lets customers pay for Ticketstation orders through Mollie (iDEAL, Bancontact, credit card and more), and handles refunds and chargebacks. Choose Mollie as the payment provider on the Payments screen of Ticketstation."
PLG_TICKETSTATIONPAYMENT_MOLLIE_API_KEY="API Key (live)"
PLG_TICKETSTATIONPAYMENT_MOLLIE_API_KEY_DESC="The Live API Key provided by Mollie (should start with 'live_')."
PLG_TICKETSTATIONPAYMENT_MOLLIE_API_KEY_TEST="API Key (test)"
PLG_TICKETSTATIONPAYMENT_MOLLIE_API_KEY_TEST_DESC="The Test API Key provided by Mollie (should start with 'test_')."
PLG_TICKETSTATIONPAYMENT_MOLLIE_TEST_MODE="Test Mode"
PLG_TICKETSTATIONPAYMENT_MOLLIE_TEST_MODE_DESC="Payments go to Mollie's test environment and no money changes hands. While test mode is on, only visitors who are logged in on the website see the tickets and can order them."
PLG_TICKETSTATIONPAYMENT_MOLLIE_PAYMENT_METHODS="Payment methods"
PLG_TICKETSTATIONPAYMENT_MOLLIE_PAYMENT_METHODS_DESC="The methods customers can choose from. With more than one, the customer chooses on the payment page of this website; with one, the customer goes straight to that method at Mollie. Each method must also be activated in your Mollie Dashboard. Apple Pay only appears on Apple devices, so choose at least one other method. Google Pay is part of credit card: Mollie shows it on supported devices once it is also activated in your Mollie Dashboard. The currency is set in the Ticketstation Configuration."
PLG_TICKETSTATIONPAYMENT_MOLLIE_METHOD_NOT_ACTIVE="Not active in Mollie"
PLG_TICKETSTATIONPAYMENT_MOLLIE_GOOGLEPAY_NOT_ACTIVE="Google Pay not active in Mollie"
PLG_TICKETSTATIONPAYMENT_MOLLIE_METHODS_UNKNOWN="Could not check with Mollie which methods are active in your account (no API key entered, or no connection)."
PLG_TICKETSTATIONPAYMENT_MOLLIE_METHOD_CREDITCARD="Credit card"
PLG_TICKETSTATIONPAYMENT_MOLLIE_METHOD_CREDITCARD_GOOGLEPAY="(including Google Pay)"
PLG_TICKETSTATIONPAYMENT_MOLLIE_METHOD_GIFTCARD="Gift cards"
PLG_TICKETSTATIONPAYMENT_MOLLIE_METHOD_EURO_ONLY="Only in euros"
PLG_TICKETSTATIONPAYMENT_MOLLIE_DESCRIPTION="Payment Description"
PLG_TICKETSTATIONPAYMENT_MOLLIE_DESCRIPTION_DESC="This description followed by the Ordercode will be shown to the customer during payment. This will also appear on the customers bank statement."
PLG_TICKETSTATIONPAYMENT_MOLLIE_LANGUAGE="Interface Language"
PLG_TICKETSTATIONPAYMENT_MOLLIE_LANGUAGE_DESC="The language of Mollie's payment page."
PLG_TICKETSTATIONPAYMENT_MOLLIE_MARK_PENDING="Mark order as waiting for payment"
PLG_TICKETSTATIONPAYMENT_MOLLIE_MARK_PENDING_DESC="If set to Yes, an order gets the status 'waiting for payment' as soon as the customer is sent to Mollie, so it shows up in the Box Office while the customer pays."
PLG_TICKETSTATIONPAYMENT_MOLLIE_ERROR_NO_KEY="No Mollie API key is set for the current mode (test or live)."
PLG_TICKETSTATIONPAYMENT_MOLLIE_ATTENTION_TEST="Mollie is in test mode"
PLG_TICKETSTATIONPAYMENT_MOLLIE_ATTENTION_KEY_MISSING="Live API key is missing"
PLG_TICKETSTATIONPAYMENT_MOLLIE_ATTENTION_KEY_INVALID="Live API key is not valid (must start with 'live_')"
PLG_TICKETSTATIONPAYMENT_MOLLIE_ATTENTION_KEY_IS_TEST="A test API key has been entered as the live API key"
