PLG_TICKETSTATIONPAYMENT_STRIPE="Ticketstation Betalen - Stripe"
PLG_TICKETSTATIONPAYMENT_STRIPE_XML_DESCRIPTION="Laat klanten bestellingen van Ticketstation betalen via Stripe Checkout (kaarten, iDEAL, Bancontact en elke andere methode die in je Stripe-dashboard aanstaat) en handelt terugbetalingen en disputes af. Kies Stripe als betaalprovider op het scherm Betalingen van Ticketstation en registreer het webhook-adres uit de instellingen in je Stripe-dashboard."
PLG_TICKETSTATIONPAYMENT_STRIPE_SECRET_KEY="Geheime sleutel (live)"
PLG_TICKETSTATIONPAYMENT_STRIPE_SECRET_KEY_DESC="De live geheime sleutel uit je Stripe-dashboard (Ontwikkelaars > API-sleutels). Hij begint met 'sk_live_'. Een beperkte sleutel ('rk_live_') werkt ook, als hij Checkout Sessions en Refunds mag schrijven en PaymentIntents, Charges en Disputes mag lezen."
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_SECRET="Webhook-ondertekeningsgeheim (live)"
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_SECRET_DESC="Het ondertekeningsgeheim van het live webhook-eindpunt (Ontwikkelaars > Webhooks > je eindpunt). Het begint met 'whsec_'. Zonder dit geheim worden meldingen van Stripe geweigerd en wordt geen enkele betaling afgerond."
PLG_TICKETSTATIONPAYMENT_STRIPE_SECRET_KEY_TEST="Geheime sleutel (test)"
PLG_TICKETSTATIONPAYMENT_STRIPE_SECRET_KEY_TEST_DESC="De geheime sleutel van je Stripe-testomgeving. Hij begint met 'sk_test_'."
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_SECRET_TEST="Webhook-ondertekeningsgeheim (test)"
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_SECRET_TEST_DESC="Het ondertekeningsgeheim van het webhook-eindpunt in je Stripe-testomgeving, of van de Stripe CLI ('stripe listen' toont het). Het begint met 'whsec_'."
PLG_TICKETSTATIONPAYMENT_STRIPE_TEST_MODE="Testmodus"
PLG_TICKETSTATIONPAYMENT_STRIPE_TEST_MODE_DESC="Betalingen gaan naar de testomgeving van Stripe; er wordt geen geld overgemaakt. Zolang de testmodus aan staat, zien alleen bezoekers die op de website zijn ingelogd de tickets en kunnen alleen zij bestellen."
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_URL="Webhook-adres"
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_URL_DESC="Voeg dit adres toe als webhook-eindpunt in je Stripe-dashboard (Ontwikkelaars > Webhooks) en kopieer het ondertekeningsgeheim dat het krijgt naar het veld hierboven. Een live en een test eindpunt zijn bij Stripe gescheiden, elk met een eigen geheim."
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_EVENTS="Events die naar dit adres moeten worden gestuurd:"
PLG_TICKETSTATIONPAYMENT_STRIPE_METHODS_NOTE="Betaalmethodes en vertraagde betalingen"
PLG_TICKETSTATIONPAYMENT_STRIPE_METHODS_NOTE_DESC="De betaalpagina van Stripe biedt de methodes die in je Stripe-dashboard aanstaan. Zet alleen methodes aan die direct bevestigen, zoals kaarten, iDEAL en Bancontact. Een methode die pas na dagen bevestigt (SEPA-incasso, bankoverschrijving, betaalbewijzen zoals Boleto, OXXO, Konbini en Multibanco) laat de bestelling openstaan en de tickets gereserveerd tot Stripe bevestigt. Ticketstation verwijdert openstaande bestellingen na het aantal dagen bij Configuratie, tab Orders (Onbetaalde/openstaande bestellingen verwijderen na): een betaling die daarna pas wordt bevestigd vindt geen bestelling meer, waardoor de klant heeft betaald en geen tickets krijgt."
PLG_TICKETSTATIONPAYMENT_STRIPE_DESCRIPTION="Betaalomschrijving"
PLG_TICKETSTATIONPAYMENT_STRIPE_DESCRIPTION_DESC="Deze omschrijving gevolgd door de ordercode wordt aan de klant getoond op de betaalpagina van Stripe en staat bij de betaling in je Stripe-dashboard."
PLG_TICKETSTATIONPAYMENT_STRIPE_LANGUAGE="Taal van de betaalpagina"
PLG_TICKETSTATIONPAYMENT_STRIPE_LANGUAGE_DESC="De taal van de betaalpagina van Stripe."
PLG_TICKETSTATIONPAYMENT_STRIPE_LANGUAGE_AUTO="De taal van de browser van de klant"
PLG_TICKETSTATIONPAYMENT_STRIPE_MARK_PENDING="Bestelling markeren als wachtend op betaling"
PLG_TICKETSTATIONPAYMENT_STRIPE_MARK_PENDING_DESC="Bij Ja krijgt een bestelling de status 'wacht op betaling' zodra de klant naar Stripe wordt gestuurd, zodat hij in de Kassa staat terwijl de klant betaalt."
PLG_TICKETSTATIONPAYMENT_STRIPE_ERROR_NO_KEY="Er is geen geheime Stripe-sleutel ingesteld voor de huidige modus (test of live)."
PLG_TICKETSTATIONPAYMENT_STRIPE_ERROR_NO_WEBHOOK_SECRET="Er is geen Stripe webhook-ondertekeningsgeheim ingesteld voor de huidige modus (test of live)."
PLG_TICKETSTATIONPAYMENT_STRIPE_ERROR_KEY_REFUSED="Stripe weigerde de geheime sleutel voor de huidige modus (test of live). Controleer de sleutel in de instellingen van de Stripe-plugin."
PLG_TICKETSTATIONPAYMENT_STRIPE_ERROR_INVALID_KEY_LIVE="De live geheime Stripe-sleutel is niet geldig (hij moet beginnen met sk_live_ of rk_live_)."
PLG_TICKETSTATIONPAYMENT_STRIPE_ERROR_INVALID_KEY_TEST="De geheime Stripe-testsleutel is niet geldig (hij moet beginnen met sk_test_ of rk_test_)."
PLG_TICKETSTATIONPAYMENT_STRIPE_ATTENTION_TEST="Stripe staat in testmodus"
PLG_TICKETSTATIONPAYMENT_STRIPE_ATTENTION_KEY_MISSING="De live geheime Stripe-sleutel ontbreekt"
PLG_TICKETSTATIONPAYMENT_STRIPE_ATTENTION_KEY_INVALID="De live geheime Stripe-sleutel is niet geldig (moet beginnen met 'sk_live_' of 'rk_live_')"
PLG_TICKETSTATIONPAYMENT_STRIPE_ATTENTION_KEY_IS_TEST="Er is een Stripe-testsleutel ingevuld als live geheime sleutel"
PLG_TICKETSTATIONPAYMENT_STRIPE_ATTENTION_WEBHOOK_SECRET_MISSING="Het Stripe webhook-ondertekeningsgeheim ontbreekt: betalingen worden nooit afgerond"
PLG_TICKETSTATIONPAYMENT_STRIPE_ATTENTION_WEBHOOK_SECRET_INVALID="Het Stripe webhook-ondertekeningsgeheim is niet geldig (moet beginnen met 'whsec_')"
