PLG_TICKETSTATIONPAYMENT_STRIPE="Ticketstation Payment - Stripe"
PLG_TICKETSTATIONPAYMENT_STRIPE_XML_DESCRIPTION="Lets customers pay for Ticketstation orders through Stripe Checkout (cards, iDEAL, Bancontact and every other method that is switched on in your Stripe Dashboard), and handles refunds and disputes. Choose Stripe as the payment provider on the Payments screen of Ticketstation, and register the webhook address shown in the settings in your Stripe Dashboard."
PLG_TICKETSTATIONPAYMENT_STRIPE_SECRET_KEY="Secret key (live)"
PLG_TICKETSTATIONPAYMENT_STRIPE_SECRET_KEY_DESC="The live secret key from your Stripe Dashboard (Developers > API keys). It starts with 'sk_live_'. A restricted key ('rk_live_') works too when it may write Checkout Sessions and Refunds and read PaymentIntents, Charges and Disputes."
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_SECRET="Webhook signing secret (live)"
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_SECRET_DESC="The signing secret of the live webhook endpoint (Developers > Webhooks > your endpoint). It starts with 'whsec_'. Without it Stripe's reports are refused and no payment is ever completed."
PLG_TICKETSTATIONPAYMENT_STRIPE_SECRET_KEY_TEST="Secret key (test)"
PLG_TICKETSTATIONPAYMENT_STRIPE_SECRET_KEY_TEST_DESC="The secret key of your Stripe test environment. It starts with 'sk_test_'."
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_SECRET_TEST="Webhook signing secret (test)"
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_SECRET_TEST_DESC="The signing secret of the webhook endpoint in your Stripe test environment, or of the Stripe CLI ('stripe listen' shows it). It starts with 'whsec_'."
PLG_TICKETSTATIONPAYMENT_STRIPE_TEST_MODE="Test Mode"
PLG_TICKETSTATIONPAYMENT_STRIPE_TEST_MODE_DESC="Payments go to Stripe's test environment and no money changes hands. While test mode is on, only visitors who are logged in on the website see the tickets and can order them."
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_URL="Webhook address"
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_URL_DESC="Add this address as a webhook endpoint in your Stripe Dashboard (Developers > Webhooks) and copy the signing secret it gets into the field above. A live and a test endpoint are separate in Stripe, each with its own secret."
PLG_TICKETSTATIONPAYMENT_STRIPE_WEBHOOK_EVENTS="Events to send to this address:"
PLG_TICKETSTATIONPAYMENT_STRIPE_METHODS_NOTE="Payment methods and delayed payments"
PLG_TICKETSTATIONPAYMENT_STRIPE_METHODS_NOTE_DESC="Stripe's payment page offers the methods that are switched on in your Stripe Dashboard. Switch on only methods that confirm at once, such as cards, iDEAL and Bancontact. A method that confirms after days (SEPA Direct Debit, bank transfers, voucher payments such as Boleto, OXXO, Konbini and Multibanco) leaves the order pending and the tickets reserved until Stripe confirms. Ticketstation removes pending orders after the number of days set under Configuration, tab Orders (Remove Unpaid/Pending Orders after): a payment that is confirmed after that finds no order, so the customer has paid and receives no tickets."
PLG_TICKETSTATIONPAYMENT_STRIPE_DESCRIPTION="Payment Description"
PLG_TICKETSTATIONPAYMENT_STRIPE_DESCRIPTION_DESC="This description followed by the Ordercode is shown to the customer on Stripe's payment page and appears with the payment in your Stripe Dashboard."
PLG_TICKETSTATIONPAYMENT_STRIPE_LANGUAGE="Interface Language"
PLG_TICKETSTATIONPAYMENT_STRIPE_LANGUAGE_DESC="The language of Stripe's payment page."
PLG_TICKETSTATIONPAYMENT_STRIPE_LANGUAGE_AUTO="The customer's browser language"
PLG_TICKETSTATIONPAYMENT_STRIPE_MARK_PENDING="Mark order as waiting for payment"
PLG_TICKETSTATIONPAYMENT_STRIPE_MARK_PENDING_DESC="If set to Yes, an order gets the status 'waiting for payment' as soon as the customer is sent to Stripe, so it shows up in the Box Office while the customer pays."
PLG_TICKETSTATIONPAYMENT_STRIPE_ERROR_NO_KEY="No Stripe secret key is set for the current mode (test or live)."
PLG_TICKETSTATIONPAYMENT_STRIPE_ERROR_NO_WEBHOOK_SECRET="No Stripe webhook signing secret is set for the current mode (test or live)."
PLG_TICKETSTATIONPAYMENT_STRIPE_ERROR_KEY_REFUSED="Stripe refused the secret key for the current mode (test or live). Check the key in the Stripe plugin settings."
PLG_TICKETSTATIONPAYMENT_STRIPE_ERROR_INVALID_KEY_LIVE="The Stripe live secret key is not valid (it must start with sk_live_ or rk_live_)."
PLG_TICKETSTATIONPAYMENT_STRIPE_ERROR_INVALID_KEY_TEST="The Stripe test secret key is not valid (it must start with sk_test_ or rk_test_)."
PLG_TICKETSTATIONPAYMENT_STRIPE_ATTENTION_TEST="Stripe is in test mode"
PLG_TICKETSTATIONPAYMENT_STRIPE_ATTENTION_KEY_MISSING="Stripe live secret key is missing"
PLG_TICKETSTATIONPAYMENT_STRIPE_ATTENTION_KEY_INVALID="Stripe live secret key is not valid (must start with 'sk_live_' or 'rk_live_')"
PLG_TICKETSTATIONPAYMENT_STRIPE_ATTENTION_KEY_IS_TEST="A Stripe test key has been entered as the live secret key"
PLG_TICKETSTATIONPAYMENT_STRIPE_ATTENTION_WEBHOOK_SECRET_MISSING="Stripe webhook signing secret is missing: payments will never be completed"
PLG_TICKETSTATIONPAYMENT_STRIPE_ATTENTION_WEBHOOK_SECRET_INVALID="Stripe webhook signing secret is not valid (must start with 'whsec_')"
