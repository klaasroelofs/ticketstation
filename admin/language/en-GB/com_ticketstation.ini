COM_TICKETSTATION_DOCS_INTRO="Reference for everyone who administers this Ticketstation installation: how each part is set up, what the options do, and how the pieces fit together. Jump to a topic below, or use your browser's find-in-page."
COM_TICKETSTATION_DOCS_NAV_EVENTS="Events &amp; tickets"
COM_TICKETSTATION_DOCS_NAV_SEATING="Seated tickets"
COM_TICKETSTATION_DOCS_NAV_CONFIGURATION="Configuration"
COM_TICKETSTATION_DOCS_NAV_SCANNING="Ticket scanning"
COM_TICKETSTATION_DOCS_NAV_INVOICING="Invoicing"
COM_TICKETSTATION_DOCS_NAV_WAITINGLIST="Waiting list"
COM_TICKETSTATION_DOCS_NAV_BASKET="Basket module"
COM_TICKETSTATION_DOCS_SCREEN_LINK="Manage scanners on the %s screen."

COM_TICKETSTATION_EVENTS_DOCS_TITLE="Setting up events and tickets"
COM_TICKETSTATION_EVENTS_DOCS_INTRO="Every sale is built from two linked records: an <strong>Event</strong> holds the shared, event-level information (name, event code, date, an optional automatic publish/unpublish window, description, background image). It has no price or stock of its own. A <strong>Ticket</strong> is what actually gets sold: it has its own price, VAT percentage, stock, sale window, min/max order quantity, scanning setting and print/eTicket design, and is always linked to one event."
COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_TITLE="Creating an ordinary event with tickets"
COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_1="Create the <strong>Event</strong> first: name, a short event code and the event date. Automatic publish/unpublish, a description and a background image are optional."
COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_2="Create a <strong>Ticket</strong>, select the event (and a venue, if applicable), then set <em>Total Tickets</em> and <em>Total Tickets (Start)</em>. <em>Total Tickets (Start)</em> is the capacity: everything that shows or checks availability (the upcoming-events list, the availability bar, the purchase check, the backend ticket list and the control panel) counts the sold tickets against it. <em>Total Tickets</em> is a live counter that goes down with every order; only seated tickets use it (see the Seated tickets topic)."
COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_3="Fill in price and VAT, an optional min/max quantity per order, a sale start/end window and whether scanning is enabled for this ticket."
COM_TICKETSTATION_EVENTS_DOCS_WALKTHROUGH_4="Leave <em>Parent Ticket</em> empty. A ticket created this way is independent and is sold directly on the frontend as its own product."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_TITLE="Parent and child tickets"
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_WHAT="The ticket form has a <em>Parent Ticket</em> dropdown. Leaving it empty makes the ticket a top-level (&quot;parent&quot;) ticket; selecting an existing parent ticket there makes the ticket you're editing a <strong>child</strong> of it. Only one level of nesting is supported: the dropdown only lists tickets that are themselves parents, so a child can never have children of its own."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_PURPOSE="Use this to group several purchasable variants of the same event or moment under one shared page, for example price tiers (Early Bird / Regular / VIP), age categories (Adult / Child / Senior), or date/seating variants of what is conceptually one ticket type. The storefront link always points at the parent: as long as it has no children, the parent is shown and sold as a normal single product (the ordinary case above). As soon as one or more children exist under it, the storefront automatically shows a list of the children instead, each with its own name, price and Order button; the parent itself stops being directly purchasable and becomes the shared landing page."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_GOTCHAS_TITLE="Things to know before using them"
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_GOTCHA_1="Pricing does not cascade: every child has its own price, VAT and min/max quantity, set independently."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_GOTCHA_2="The <em>Choice for Ticketcounter</em> field on each child ticket decides its capacity: &quot;Use Parent Totals&quot; makes it share one pool with the parent and the other children that use it (the parent's <em>Total Tickets (Start)</em>, used up by all their orders together), &quot;Use Child Totals&quot; gives that variant its own hard cap (its own <em>Total Tickets (Start)</em>). The number of tickets left in the upcoming-events list is the total over all published variants: what is left of the shared pool plus what is left of each variant with its own cap."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_GOTCHA_3="A child can still be sold via a direct link, but customers normally only reach it by first landing on the parent's page, since that is the URL that gets shared."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_GOTCHA_4="Scanning at the door is unaffected by the hierarchy: every ticket, parent or child, is validated purely by its own QR code / ticket ID."
COM_TICKETSTATION_EVENTS_DOCS_PARENTCHILD_GOTCHA_5="Seating is switched on per ticket (<em>Show Seat Plans?</em>), not per venue. On a seated ticket the child tickets get a specific role, depending on the <em>Multi Seat</em> setting: price categories per person, or sections of the hall. See the Seated tickets topic below."

COM_TICKETSTATION_SEATING_DOCS_TITLE="Seated tickets and seat charts"
COM_TICKETSTATION_SEATING_DOCS_INTRO="A <strong>seated ticket</strong> is sold per individual seat instead of per quantity: the customer picks seats on a seat chart and every ticket carries its seat number. Seating is switched on per ticket with <em>Show Seat Plans?</em> on the ticket form, and each seated ticket has its own seat plan settings, background image and seat chart. It has nothing to do with the venue: two tickets at the same venue each need their own chart (use <em>Copy from other ticket</em> to reuse a layout). As soon as seating is on, the ticket's storefront link opens the seat-picking page instead of the normal quantity page."
COM_TICKETSTATION_SEATING_DOCS_SETUP_TITLE="Setting up a seated ticket"
COM_TICKETSTATION_SEATING_DOCS_SETUP_1="Create the event and the (parent) ticket as usual and switch on <em>Show Seat Plans?</em>. Set <em>Total Tickets</em> to the number of seats you are going to sell: it is still the stock counter and goes down by one per booked seat (see <em>Multi Seat</em> below for which ticket's counter is used). Add child tickets now if the set-up you choose needs them."
COM_TICKETSTATION_SEATING_DOCS_SETUP_2="Open <strong>Seat Plans</strong> from the control panel. It lists every top-level ticket with seating switched on; child tickets never appear here because the settings and the chart always belong to the parent."
COM_TICKETSTATION_SEATING_DOCS_SETUP_3="Click <strong>Settings</strong> and fill in: <em>Multi Seat</em> (the most important choice, see below), a background image (JPG or PNG, usually a floor plan of the hall; the chart takes the size of this image, without one it is 750 &times; 850 px), <em>Seat Width</em> and <em>Seat Height</em> in pixels (22 is a common value) and the background, border and font colour of a free seat as a 6-digit hex code without <code>#</code>. Save. A new seat always gets the width and height that are set at that moment; changing them later does not resize existing seats."
COM_TICKETSTATION_SEATING_DOCS_SETUP_4="Click <strong>Seat Chart</strong> (also reachable via the <em>Seats</em> button in the Tickets list). If the settings haven't been saved yet you are sent back to the settings screen with a warning first."
COM_TICKETSTATION_SEATING_DOCS_SETUP_5="Click <strong>Start editing</strong>, add the seats with the tools described below and drag every seat onto its place on the floor plan; the position is saved the moment you release it. Click <strong>Stop editing</strong> when you are done."
COM_TICKETSTATION_SEATING_DOCS_MULTISEAT_TITLE="Multi Seat: the three ways to price seats"
COM_TICKETSTATION_SEATING_DOCS_MULTISEAT_INTRO="The <em>Multi Seat</em> switch in the seat plan settings decides who a seat belongs to and therefore how its price is determined. Combined with whether the ticket has child tickets, that gives three set-ups:"
COM_TICKETSTATION_SEATING_DOCS_COL_SETUP="Set-up"
COM_TICKETSTATION_SEATING_DOCS_COL_TICKETS="Tickets and seats"
COM_TICKETSTATION_SEATING_DOCS_COL_PRICE="Price of a seat"
COM_TICKETSTATION_SEATING_DOCS_COL_STOCK="Stock counter"
COM_TICKETSTATION_SEATING_DOCS_MODE_SINGLE="Multi Seat = Yes, no child tickets<br><small class='text-muted'>one price</small>"
COM_TICKETSTATION_SEATING_DOCS_MODE_SINGLE_TICKETS="One ticket; all seats belong to it."
COM_TICKETSTATION_SEATING_DOCS_MODE_SINGLE_PRICE="Every seat costs the ticket's price."
COM_TICKETSTATION_SEATING_DOCS_MODE_SINGLE_STOCK="The ticket's <em>Total Tickets</em>."
COM_TICKETSTATION_SEATING_DOCS_MODE_TIERS="Multi Seat = Yes, with child tickets<br><small class='text-muted'>price per person</small>"
COM_TICKETSTATION_SEATING_DOCS_MODE_TIERS_TICKETS="All seats belong to the parent; the child tickets are price categories, e.g. Adult / Child / 65+."
COM_TICKETSTATION_SEATING_DOCS_MODE_TIERS_PRICE="Any seat can be sold at any child price. A newly picked seat starts at the most expensive child ticket and its price category drop-down opens straight away under <em>Chosen seats</em>; clicking a chosen seat there opens it again later. Only published child tickets are offered."
COM_TICKETSTATION_SEATING_DOCS_MODE_TIERS_STOCK="Every booked seat lowers the <em>parent's</em> <em>Total Tickets</em>, whatever price category is chosen. The seats on the chart are the real limit."
COM_TICKETSTATION_SEATING_DOCS_MODE_SECTIONS="Multi Seat = No, with child tickets<br><small class='text-muted'>price per section</small>"
COM_TICKETSTATION_SEATING_DOCS_MODE_SECTIONS_TICKETS="Every seat belongs to one child ticket, e.g. Stalls / Balcony / Front row. You choose the child ticket when adding the seat. Under <em>Colours per child ticket</em> in the settings each section can get its own colours, so customers can tell the sections apart."
COM_TICKETSTATION_SEATING_DOCS_MODE_SECTIONS_PRICE="Fixed by where the seat is: the price of the child ticket it belongs to. The customer has no price choice."
COM_TICKETSTATION_SEATING_DOCS_MODE_SECTIONS_STOCK="Each child ticket's own <em>Total Tickets</em>; a section is sold out when its counter reaches 0."
COM_TICKETSTATION_SEATING_DOCS_MULTISEAT_CHOOSE="Choose the set-up <em>before</em> adding seats and keep it: in the first two set-ups the seats are stored against the parent ticket, in the third against the child tickets, so switching <em>Multi Seat</em> afterwards makes the existing seats disappear from the chart."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_TITLE="Working with the seat chart editor"
COM_TICKETSTATION_SEATING_DOCS_EDITOR_INTRO="Every seat has a <strong>seat number</strong> (printed on the ticket, optionally preceded by a row name, e.g. <code>A12</code>) and a <strong>database ID</strong> (its internal number). The batch, remove and edit tools ask for the database ID: while editing, hovering over or dragging a seat shows its database ID above the chart and fills it in as the batch start seat. The tools in the left column:"
COM_TICKETSTATION_SEATING_DOCS_EDITOR_1="<strong>Add Seats &amp; Sectors</strong> &mdash; adds one seat in the top-left corner, ready to be dragged into place. With Multi Seat = Yes you can give a <em>row name</em> (e.g. <code>A</code>); the seat gets the next number within that row, or number 1 when <em>Starting new number</em> is set to Yes. With Multi Seat = No you first pick the child ticket (section) under <em>Choose Seat/Sector</em>; numbering continues per child ticket and there are no row names."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_2="<strong>Add Seats (batch)</strong> &mdash; copies an existing seat several times in a straight line: enter the start seat (database ID), the number of seats, the direction (right, left, down, up), how much the seat number goes up or down per seat (1&ndash;5, e.g. 2 for odd/even numbering), whether numbering increases or decreases, and the margin in pixels between the seats. The copies get the same row, size and ticket as the start seat. This is the fastest way to build a row: place its first seat by hand, then batch the rest."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_3="<strong>Remove Seat</strong> &mdash; deletes the seat with the given database ID from the chart."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_4="<strong>Edit Seat</strong> &mdash; loads a seat by database ID to change its seat number, row name, exact X/Y position or state (Free / Booked). Setting a sold seat to Free only releases the seat on the chart; it does not cancel or change the order, so use the Box Office for that."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_5="<strong>Copy from other ticket</strong> (Multi Seat = Yes only) &mdash; replaces <em>all</em> seats of this chart with a copy of another seated ticket's seats, for example for a second performance in the same hall. It is refused as soon as a seat of this chart has been sold. The background image is not copied; upload it again in the settings."
COM_TICKETSTATION_SEATING_DOCS_EDITOR_6="<strong>Settings</strong> (in the seat plan list) &mdash; the background image can be viewed or removed there as well; removing it does not affect the seats."
COM_TICKETSTATION_SEATING_DOCS_MONITOR_TITLE="Following the sale and the entrance"
COM_TICKETSTATION_SEATING_DOCS_MONITOR="Outside edit mode the chart is a live overview: free seats in their own colour, sold seats red and sold-and-scanned seats green, with totals for free, sold (with percentage), scanned (with percentage) and not yet scanned. Under <em>Real-time view</em>, <strong>Start</strong> refreshes the chart and totals every 3 seconds, which is handy at the door during the event; <strong>Stop</strong> ends it. Scanners on a larger screen have a similar live map (<em>Seat map</em>) on the scanning page."
COM_TICKETSTATION_SEATING_DOCS_FLOW_TITLE="How it works for the customer"
COM_TICKETSTATION_SEATING_DOCS_FLOW_1="From the ticket overview the customer opens the seated ticket and lands on <em>Select seats</em>: the event details, an instruction, the <em>Chosen seats</em> panel and below it the seat chart. Red seats are taken. The chart is shown at the size of the background image, so on a phone that is too narrow the customer is asked to turn the phone."
COM_TICKETSTATION_SEATING_DOCS_FLOW_2="Clicking a free seat <strong>reserves it immediately</strong>: it turns orange, is added under <em>Chosen seats</em> and goes into the cart (the basket module updates straight away). From that moment nobody else can pick it. There is no separate quantity to enter: every click is one ticket."
COM_TICKETSTATION_SEATING_DOCS_FLOW_3="Clicking a seat under <em>Chosen seats</em> shows its options: a button to remove the seat again and, in the <em>price per person</em> set-up, the drop-down to choose the price category."
COM_TICKETSTATION_SEATING_DOCS_FLOW_4="<em>Continue</em> leads to the cart, checkout and payment, exactly as for other tickets. The cart and payment page list the seat numbers."
COM_TICKETSTATION_SEATING_DOCS_FLOW_5="After payment each ticket PDF carries the seat number (<em>Seat number A12</em>) at the position, size and colour set under the seat number fields of the ticket design. In the Box Office the seat number is shown per ticket and can be searched on."
COM_TICKETSTATION_SEATING_DOCS_RELEASE_TITLE="When a seat becomes free again"
COM_TICKETSTATION_SEATING_DOCS_RELEASE_1="The customer removes it on the seat-picking page."
COM_TICKETSTATION_SEATING_DOCS_RELEASE_2="The order is never finished or paid and is cleaned up automatically (<em>remove_unfinished</em> in Configuration &raquo; Orders). The order stays visible in the Box Office as removed, and its history still shows which seat it held."
COM_TICKETSTATION_SEATING_DOCS_RELEASE_3="The order is deleted in the Box Office."
COM_TICKETSTATION_SEATING_DOCS_RELEASE_4="The same cleanup also frees any seat whose order no longer exists, as a safety net against seats that stay red without an order."
COM_TICKETSTATION_SEATING_DOCS_GOTCHAS_TITLE="Things to know"
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_1="A seat is held from the moment it is clicked, not from payment. Without the automatic cleanup of unfinished orders, seats of abandoned carts stay taken; switch it on for seated events."
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_2="Keep <em>Total Tickets</em> in line with the number of seats. In the <em>one price</em> and <em>price per section</em> set-ups, when the counter reaches 0 no more seats can be booked even if some are still free on the chart; a higher counter than seats is harmless, the chart itself is then the limit."
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_3="The minimum and maximum order quantity of the ticket are not applied on the seat chart: a customer can pick as many seats as are free."
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_4="Seated tickets have no waiting list, whatever <em>Show Waitinglist</em> is set to (see the Waiting list topic), and the availability bar on the ticket page is not shown for them. The number of tickets left in the upcoming-events list is the number of free seats on the chart, limited by the <em>Total Tickets</em> counter that is checked (per section in the <em>price per section</em> set-up)."
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_5="Phone and walk-in bookings for a seated ticket go through <strong>New reservation</strong>: after choosing the ticket, staff pick the seats on the same chart (<em>Step 2: Choose seats</em>)."
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_6="Don't restructure a chart (remove seats, copy another layout, switch Multi Seat) once seats have been sold: sold tickets point at their seat, and a removed seat can no longer be shown or printed for that order."
COM_TICKETSTATION_SEATING_DOCS_GOTCHA_7="Seat charts are fixed-size images with seats positioned in pixels. Keep the background image about as wide as the content area of the site template, otherwise customers have to scroll sideways."

COM_TICKETSTATION_CONFIG_DOCS_TITLE="Configuration reference"
COM_TICKETSTATION_CONFIG_DOCS_INTRO="The Configuration screen is one form, grouped into six tabs, saved to a single settings row. Below are the settings that materially change behaviour elsewhere in the component; purely cosmetic company/address fields aren't repeated here since their tab already labels them clearly."
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL="General"
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL_1="<code>valuta</code> &mdash; currency symbol/code used everywhere a price is shown."
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL_2="<code>dateformat</code> / <code>time_format</code> &mdash; how dates and times are displayed site-wide."
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL_3="<code>priceformat</code> &mdash; the prefix/layout pattern used to display prices, e.g. &quot;&euro; 12,50&quot;."
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL_4="<code>use_coupons</code> &mdash; turns the discount-coupon system on or off for the whole shop."
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL_5="<code>show_remark_field</code> &mdash; lets customers add a free-text remark to their order at checkout."
COM_TICKETSTATION_CONFIG_DOCS_TAB_GENERAL_6="<code>show_waitinglist</code> &mdash; enables the waiting list for sold-out tickets. Only applies to counter/quantity tickets: seated events never offer a waiting list regardless of this setting &mdash; see the Waiting list topic below."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DISPLAY="Display"
COM_TICKETSTATION_CONFIG_DOCS_TAB_DISPLAY_1="<code>show_quantity_eventlist</code> / <code>show_price_eventlist</code> &mdash; show remaining stock, resp. price, directly in the upcoming-events list. For a ticket with child tickets the stock is the total over all published variants, for a seated ticket the number of free seats (see the Events &amp; tickets and Seated tickets topics)."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DISPLAY_2="<code>show_available_tickets</code> &mdash; shows an availability bar on the ticket page, for counter/quantity tickets only (not for seated events). For a ticket with child tickets the bar covers all published variants together; a variant is shown as sold out as soon as its own share (the shared pool or its own cap) is used up."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DISPLAY_3="<code>show_venue</code> &mdash; master toggle for the venue/location line on events and tickets. <code>show_venue_address</code>, <code>show_venue_description</code> and <code>show_venue_website</code> add extra venue details underneath it, and only take effect while <code>show_venue</code> itself is on."
COM_TICKETSTATION_CONFIG_DOCS_TAB_ORDERS="Orders"
COM_TICKETSTATION_CONFIG_DOCS_TAB_ORDERS_1="<code>next_ordercode</code> &mdash; overrides the next sequential order number (format: 2-digit season prefix + 3-digit sequence, e.g. <code>26001</code>). Use it to jump the counter ahead for a new season; it has no effect once orders have already passed that number."
COM_TICKETSTATION_CONFIG_DOCS_TAB_ORDERS_2="<code>remove_unfinished</code> with <code>removal_hours</code> / <code>removal_days</code> &mdash; automatically cleans up unpaid or abandoned orders after the configured time, so their tickets become available again."
COM_TICKETSTATION_CONFIG_DOCS_TAB_CHECKOUT="Checkout"
COM_TICKETSTATION_CONFIG_DOCS_TAB_CHECKOUT_1="<code>show_salutation</code>, <code>show_address</code>, <code>show_secondaddress</code>, <code>show_thirdaddress</code>, <code>show_zipcode</code>, <code>show_city</code>, <code>show_country</code>, <code>show_phone</code>, <code>show_birthday</code> &mdash; individually show or hide each customer-detail field on the checkout form."
COM_TICKETSTATION_CONFIG_DOCS_TAB_CHECKOUT_2="<code>variable_transcosts</code> &mdash; chooses whether transaction/service costs are a percentage (<code>transcosts</code>) or a fixed amount (<code>transactioncosts</code>) per order, or are switched off completely (none: nothing is calculated or shown to customers)."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DOCUMENTS="Documents"
COM_TICKETSTATION_CONFIG_DOCS_TAB_DOCUMENTS_1="<code>send_multi_ticket_only</code> &mdash; combines all barcodes into a single A4 multi-ticket PDF instead of separate per-ticket PDFs."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DOCUMENTS_2="<code>send_pdf_tickets</code> &mdash; when off, the confirmation email is sent without a PDF attachment."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DOCUMENTS_3="<code>send_multi_ticket_admin</code> / <code>admin_receivers_multi_ticket</code> &mdash; sends a copy of the multi-ticket PDF to one or more comma-separated admin addresses on every order."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DOCUMENTS_4="<code>use_euros_in_pdf</code> &mdash; selects &pound; or &euro; for the PDF library, which can't render both currency symbols correctly."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DOCUMENTS_5="<code>send_invoice</code>, <code>invoice_prefix</code>, <code>address_format_client</code>, <code>address_format_company</code>, <code>company_logo</code> &mdash; invoicing settings, covered in full under the Invoicing topic below."
COM_TICKETSTATION_CONFIG_DOCS_TAB_DOCUMENTS_6="Language &mdash; ticket PDFs and invoices are always printed in the site's default language (Global Configuration &raquo; Site &raquo; Default Site Language), also when they are created or resent from the backend in another admin language."
COM_TICKETSTATION_CONFIG_DOCS_TAB_COMPANY="Company"
COM_TICKETSTATION_CONFIG_DOCS_TAB_COMPANY_1="Company name, address, contact details and logo used in invoice headers, emails and legal footers. There is no separate VAT/company-registration-number field; add it as free text within the address if needed."
COM_TICKETSTATION_CONFIG_DOCS_TAB_COMPANY_2="<code>email</code> &mdash; the contact address customers are pointed to on the payment result page (payment failed, nothing received) and when a ticket download is no longer available. When it is empty, the sender address from the mail settings is used, and after that Joomla's own sender address."
COM_TICKETSTATION_CONFIG_DOCS_TAB_COMPANY_3="<code>terms_url</code>, <code>privacy_url</code> &mdash; the links to your terms and conditions and privacy statement in the &quot;By clicking 'Pay' you agree to &hellip;&quot; line on the payment page. One link serves every site language. A full URL or a path relative to the site root both work; a link left empty is left out of the sentence, and with both empty the sentence is not shown."

COM_TICKETSTATION_INVOICING_DOCS_TITLE="Invoicing"
COM_TICKETSTATION_INVOICING_DOCS_WHEN_TITLE="When an invoice is generated"
COM_TICKETSTATION_INVOICING_DOCS_WHEN="An invoice is created automatically the moment an order is paid, through the single shared completion routine every payment route runs through (Mollie payment, completing an order in Box Office, or confirming a Reservation). With <em>Send Invoice After Payment</em> enabled in Configuration, the PDF is generated and emailed to the customer together with their tickets in that same step; calling this again for the same order re-uses the existing invoice number and PDF rather than creating a duplicate. If automatic sending is off, or an email bounced, an admin can trigger it manually from the order in Box Office (<strong>Send Invoice</strong>), regardless of the automatic setting."
COM_TICKETSTATION_INVOICING_DOCS_VIEW_TITLE="Viewing and downloading invoices"
COM_TICKETSTATION_INVOICING_DOCS_VIEW="The Invoices screen lists every invoice with its number, linked order, client, amount, date and a Sent / Not Sent badge, with a download button opening the PDF. Deleting an order in Box Office also removes its invoice record and PDF."
COM_TICKETSTATION_INVOICING_DOCS_CONTENT_TITLE="What appears on the invoice"
COM_TICKETSTATION_INVOICING_DOCS_CONTENT="Invoice number as configured prefix plus the invoice's own ID, zero-padded to 5 digits (e.g. <code>INV-00001</code>), so numbers stay sequential and are never re-used; invoice date and order number; the client's name and address, laid out using the <em>Address Format (Client)</em> template; the company's details and logo in the header; one line per ticket type with quantity, description, VAT percentage, price, discount and coupon code where applicable; and totals for subtotal, discount, transaction costs, VAT and the grand total."
COM_TICKETSTATION_INVOICING_DOCS_SETTINGS_TITLE="Settings that control it"
COM_TICKETSTATION_INVOICING_DOCS_SETTINGS_1="<em>Send Invoice After Payment</em> &mdash; automatic generation and emailing on order completion, on or off."
COM_TICKETSTATION_INVOICING_DOCS_SETTINGS_2="<em>Invoice Prefix</em> &mdash; the text prefix used in both the printed invoice number and the PDF filename."
COM_TICKETSTATION_INVOICING_DOCS_SETTINGS_3="<em>Address Format (Client)</em> / <em>Address Format (Company)</em> &mdash; token-based templates for how the two addresses are laid out on the PDF."
COM_TICKETSTATION_INVOICING_DOCS_SETTINGS_4="<em>Company Logo</em> &mdash; the logo printed on invoices; falls back to the component's bundled logo when left empty."

COM_TICKETSTATION_WAITINGLIST_DOCS_TITLE="Waiting list"
COM_TICKETSTATION_WAITINGLIST_DOCS_ENABLE_TITLE="Enabling it"
COM_TICKETSTATION_WAITINGLIST_DOCS_ENABLE="Turn on <em>Show Waitinglist</em> in Configuration. This is a component-wide switch: it keeps a sold-out counter/quantity ticket clickable on the ticket overview (marked &quot;Waiting list available&quot;), makes the ticket page offer a &quot;Put me on the waiting list&quot; button, and allows the cleanup process to promote waiting customers once stock frees up."
COM_TICKETSTATION_WAITINGLIST_DOCS_SCREEN_TITLE="The Waitinglist screen"
COM_TICKETSTATION_WAITINGLIST_DOCS_SCREEN="Lists every unconfirmed or confirmed-but-not-yet-promoted signup; once someone is actually offered a ticket and a payment link, they drop off this list and become a normal Box Office order. Each row shows the event, ticket type, client (or their IP address if they haven't reached checkout yet), signup date, and a Confirmed badge. Select entries to <strong>Confirm</strong> them manually (for a phone signup, or a bounced confirmation email &mdash; equivalent to the customer clicking their own confirmation link), or to <strong>Remove</strong> them."
COM_TICKETSTATION_WAITINGLIST_DOCS_FLOW_TITLE="How it works for the customer, end to end"
COM_TICKETSTATION_WAITINGLIST_DOCS_FLOW_1="On the ticket overview the customer opens a sold-out ticket (it stays clickable while the waiting list is on) and clicks &quot;Put me on the waiting list&quot;. A confirmation appears on the page and the basket shows the tickets as being on the waiting list."
COM_TICKETSTATION_WAITINGLIST_DOCS_FLOW_2="The customer clicks <em>Continue</em>, reviews the cart and leaves their details at checkout. Only then is the signup linked to a client and the double opt-in email with a confirmation link sent. The customer ends on a page saying they are on the waiting list; the cart is then emptied, so a next signup starts fresh."
COM_TICKETSTATION_WAITINGLIST_DOCS_FLOW_3="Clicking the link in the email confirms the entry (all tickets of that signup at once) and returns the customer to the ticket overview."
COM_TICKETSTATION_WAITINGLIST_DOCS_FLOW_4="When stock frees up &mdash; through the periodic cleanup of unpaid/expired orders, or an admin removing or refunding an order &mdash; freed stock is matched to the oldest confirmed entries first (first in, first out), who then receive a time-limited payment link to complete their purchase."
COM_TICKETSTATION_WAITINGLIST_DOCS_SEATED_TITLE="Why seated events are excluded"
COM_TICKETSTATION_WAITINGLIST_DOCS_SEATED="This is intentional: the waiting list works by tracking generic ticket-type stock counts and handing freed-up stock to the next person in a first-in-first-out queue. It has no concept of which specific seat became free. Since seated events sell individually chosen seats rather than anonymous stock, that queue/notify model doesn't map onto &quot;seat X, row Y became available&quot;, so seated tickets never expose the waitlist option, however <em>Show Waitinglist</em> is set."

COM_TICKETSTATION_BASKET_DOCS_TITLE="Basket module"
COM_TICKETSTATION_BASKET_DOCS_INTRO="The basket is a separate Joomla module, <em>Ticketstation Basket</em> (<code>mod_ticketstation_basket</code>), that shows the visitor's cart wherever you place it in the template. The event pages have no built-in cart block any more: without a published module a customer only has the <em>Continue</em> button to reach the cart. The module is installed together with the component by the Ticketstation package, and requires the component."
COM_TICKETSTATION_BASKET_DOCS_SETUP_TITLE="Setting it up"
COM_TICKETSTATION_BASKET_DOCS_SETUP_1="Go to <em>Content &raquo; Site Modules</em>, click <strong>New</strong> and choose <em>Ticketstation Basket</em>."
COM_TICKETSTATION_BASKET_DOCS_SETUP_2="Pick a template position (for example the header for the mini cart, a sidebar for the full cart), set the <em>Menu Assignment</em> and choose the display mode below."
COM_TICKETSTATION_BASKET_DOCS_SETUP_3="Save and publish. You can publish the module more than once, for instance a mini cart in the header and a full cart in the sidebar."
COM_TICKETSTATION_BASKET_DOCS_MODES_TITLE="The two display modes"
COM_TICKETSTATION_BASKET_DOCS_MODE_MINI="<strong>Mini cart (icon only)</strong> &mdash; a cart icon with the number of tickets, linking to the cart page. Intended for the header or menu bar. The <em>Mini cart icon class</em> setting changes the icon (default <code>fa fa-shopping-basket</code>; any icon font class that is available on your site)."
COM_TICKETSTATION_BASKET_DOCS_MODE_FULL="<strong>Full cart</strong> &mdash; the number of tickets with their subtotal, the administration fee and the order total, and a <em>View cart</em> button. With no tickets it says the cart is empty and hides the button. The subtotal is the order total minus the fees, so it already includes any coupon discount; prices follow the price format and currency from Configuration."
COM_TICKETSTATION_BASKET_DOCS_SETTINGS_TITLE="Module settings"
COM_TICKETSTATION_BASKET_DOCS_SETTINGS_1="<em>Display</em> &mdash; mini cart or full cart (see above)."
COM_TICKETSTATION_BASKET_DOCS_SETTINGS_2="<em>Hide cart when empty</em> &mdash; hides the module (in full mode including its title) while the cart holds no tickets. It appears again as soon as a ticket is added, without reloading the page."
COM_TICKETSTATION_BASKET_DOCS_SETTINGS_3="<em>Alternative Layout</em> and <em>Module Class Suffix</em> (Advanced tab) &mdash; the usual Joomla options for template overrides and extra CSS classes."
COM_TICKETSTATION_BASKET_DOCS_SETTINGS_4="Caching is deliberately switched off and can't be enabled: the cart belongs to the visitor's session, and Joomla's module cache would show one visitor's cart to everybody else."
COM_TICKETSTATION_BASKET_DOCS_BEHAVIOUR_TITLE="How it behaves"
COM_TICKETSTATION_BASKET_DOCS_BEHAVIOUR_1="The module reads the cart of the current visitor's session through the same component code that the cart page and checkout use, so its figures always agree with what the customer sees at checkout."
COM_TICKETSTATION_BASKET_DOCS_BEHAVIOUR_2="It is never shown on the component's own cart, checkout and payment pages (including the payment result), whatever the menu assignment says: a basket next to those pages would be redundant."
COM_TICKETSTATION_BASKET_DOCS_BEHAVIOUR_3="When a customer adds tickets on an event page, the page updates the ticket counter over AJAX. The mini cart shows the new number straight away and the full cart re-reads its totals from the component, so neither needs a page reload."
COM_TICKETSTATION_BASKET_DOCS_BEHAVIOUR_4="If the component is not installed, the module renders nothing."
COM_TICKETSTATION_BASKET_DOCS_MIXED_TITLE="Using both modes on one page"
COM_TICKETSTATION_BASKET_DOCS_MIXED="This works, but the event pages update just <em>one</em> counter per page, found by its fixed id (<code>basket-item-count</code>). That id goes to the mini cart when it is on the page and otherwise to the full cart, so the two always stay in step. Publish at most one mini cart per page: a second one would keep showing the old number until the page is reloaded."

