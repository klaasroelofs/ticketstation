COM_TICKETSTATION_SEATPLANSETTING_MULTISEAT_DESC="Decides who a seat belongs to, and so how its price is set:<br><strong>Yes, without child tickets</strong> &mdash; one price for every seat.<br><strong>Yes, with child tickets</strong> &mdash; price per person: every seat can be sold at any child ticket's price (e.g. Adult / Child); the customer picks it per seat.<br><strong>No, with child tickets</strong> &mdash; price per section: every seat belongs to one child ticket (e.g. Stalls / Balcony) and costs that ticket's price.<br>Choose before adding seats: switching afterwards hides the existing seats. See <a href='index.php?option=com_ticketstation&amp;view=docs#docs-seating' target='blank'>Documentation &raquo; Seated tickets</a> for the full explanation."
