COM_TICKETSTATION_SEATPLANSETTING_CHILD_COLOURS_DESC="Only used when Multi Seat = No, where every seat belongs to one of these child tickets (a section). Give a section its own colours so customers can tell the sections apart on the seat chart. A 6-digit hex code without #; leave a field empty to use the colour above."
