COM_TICKETSTATION_SCANNING_WARNING_EVENT="<strong>Caution:</strong> all tickets related to the event can be scanned"
COM_TICKETSTATION_SCANNING_SCANNER_SAVED="Scanner saved"
COM_TICKETSTATION_SCANNING_SCANNER_SAVED_FAILED="Saving scanner failed"
COM_TICKETSTATION_SCANNING_SELECT_USER="Select Joomla user"
COM_TICKETSTATION_SCANNING_API_KEY="API Key"
COM_TICKETSTATION_SCANNING_API_KEY_HELP="Only needed for scanning hardware or an external scanner app: send it in the X-Scanner-Key header (or as key= parameter) with task=validation. The browser scanner on the website uses the login of the linked user and does not need this key. Either way, only tickets of the events/tickets selected below are accepted."
COM_TICKETSTATION_SCANNING_DOCS_TITLE="How ticket scanning works"
COM_TICKETSTATION_SCANNING_DOCS_INTRO="Every entry in this list is a <strong>scanner</strong>: a Joomla user linked to the events and tickets it may check at the entrance. Tickets can be checked in two ways, which can be combined: with a phone or tablet via the website, or with scanning hardware / an external scanner app. Both apply exactly the same checks, and a scanner only ever accepts tickets of its own events and tickets."
COM_TICKETSTATION_SCANNING_DOCS_SETUP="Setting up"
COM_TICKETSTATION_SCANNING_DOCS_USE="Scanning"
COM_TICKETSTATION_SCANNING_DOCS_WEB_TITLE="Scanning via the website (phone or tablet)"
COM_TICKETSTATION_SCANNING_DOCS_WEB_SETUP_1="Create a Joomla user account for every person or device that scans (the <em>Registered</em> group is enough). Give each scanner its own account: every approved ticket records who scanned it."
COM_TICKETSTATION_SCANNING_DOCS_WEB_SETUP_2="Click <strong>New</strong> in this screen, select that user and tick the events and/or tickets they may scan. Ticking an event allows all tickets of that event. Only tickets with <em>Scanning Allowed</em> switched on (in the ticket settings) appear in the ticket list."
COM_TICKETSTATION_SCANNING_DOCS_WEB_SETUP_3="Optionally switch on <em>Totals visible while scanning</em> (shows the scanned/sold counters) and <em>Manual entry allowed</em> (checking a ticket by typing its number when the QR code can't be read)."
COM_TICKETSTATION_SCANNING_DOCS_WEB_SETUP_4="Create a menu item of type <em>Ticketstation » Ticket scanning start page</em> (it may be hidden from the menu), or simply use this link: %s"
COM_TICKETSTATION_SCANNING_DOCS_WEB_SETUP_5="The site must be served over <strong>HTTPS</strong>: browsers only give access to the camera on a secure connection."
COM_TICKETSTATION_SCANNING_DOCS_WEB_USE_1="Open the scanning page on the phone and log in with the scanner account. The page lists the assigned events and tickets; choose what you are scanning for. For seated tickets a live seat chart (<em>Seat map</em>) is available on larger screens."
COM_TICKETSTATION_SCANNING_DOCS_WEB_USE_2="Press <strong>START</strong> and allow access to the camera. Hold the QR code inside the frame; it is read automatically."
COM_TICKETSTATION_SCANNING_DOCS_WEB_USE_3="<strong>Green</strong>: the ticket is approved and marked as scanned; a moment later the scanner is ready for the next ticket. <strong>Red</strong>: the ticket is refused and the reason is shown (already scanned and at what time, other event or ticket type, unpaid, refunded, payment pending, blacklisted, unknown code). The camera then pauses until the screen is tapped, so a refusal can't be missed."
COM_TICKETSTATION_SCANNING_DOCS_WEB_USE_4="The buttons at the bottom switch sound, vibration and the torch on and off (when the device supports them) and open manual entry. Manual entry takes the ticket number: the digits after the dash in the order number (for <code>ABC123-10234</code> type <code>10234</code>)."
COM_TICKETSTATION_SCANNING_DOCS_WEB_USE_5="While scanning, the screen stays on and the login is kept alive, so the page can stay open for the whole event. Without a network connection the scanner says so within a few seconds; just scan again once the connection is back. <strong>STOP</strong> switches the camera off."
COM_TICKETSTATION_SCANNING_DOCS_HW_TITLE="Scanning with hardware or an external scanner app"
COM_TICKETSTATION_SCANNING_DOCS_HW_INTRO="Scanning hardware or a scanner app checks tickets by calling the address below for every code it reads. Instead of a login it identifies itself with the <strong>API key</strong> of a scanner in this list."
COM_TICKETSTATION_SCANNING_DOCS_HW_SETUP_1="Create a scanner in this screen as described above and select its events and tickets. The linked user is recorded as the scanner of the tickets this device approves, so a separate user per device is recommended."
COM_TICKETSTATION_SCANNING_DOCS_HW_SETUP_2="Open the scanner again after saving: its <em>API Key</em> is shown there. Configure this key in the device or app and treat it like a password. To replace a key, delete the scanner and create it again."
COM_TICKETSTATION_SCANNING_DOCS_HW_SETUP_3="Use HTTPS, so the key and the ticket codes are never sent in clear text."
COM_TICKETSTATION_SCANNING_DOCS_HW_REQUEST="Request"
COM_TICKETSTATION_SCANNING_DOCS_HW_ADDRESS="Address"
COM_TICKETSTATION_SCANNING_DOCS_HW_METHOD="Method"
COM_TICKETSTATION_SCANNING_DOCS_HW_AUTH="Authentication"
COM_TICKETSTATION_SCANNING_DOCS_HW_AUTH_DESC="Header <code>X-Scanner-Key: &lt;API key&gt;</code> (preferred), or parameter <code>key=&lt;API key&gt;</code>. A parameter can end up in server logs, a header doesn't."
COM_TICKETSTATION_SCANNING_DOCS_HW_TID_DESC="Required. The content of the QR code, or a ticket number typed in by hand (only accepted when <em>Manual entry allowed</em> is on for this scanner)."
COM_TICKETSTATION_SCANNING_DOCS_HW_FILTER_DESC="Optional. Only accept tickets of this event (<code>eventid</code>) or ticket (<code>ticketid</code>). Without them every ticket within the scanner's events and tickets is accepted."
COM_TICKETSTATION_SCANNING_DOCS_HW_EXAMPLE="Example"
COM_TICKETSTATION_SCANNING_DOCS_HW_RESPONSE="Response (XML)"
COM_TICKETSTATION_SCANNING_DOCS_HW_STATUS_DESC="<code>1</code> = approved (the ticket is now marked as scanned), <code>0</code> = refused."
COM_TICKETSTATION_SCANNING_DOCS_HW_TEXT_DESC="Message to show, in the site language. An unknown or missing API key gives <code>Unauthorized</code>."
COM_TICKETSTATION_SCANNING_DOCS_HW_ORDER_DESC="Order and ticket number, or <code>FOUT</code> when no ticket was found."
COM_TICKETSTATION_SCANNING_DOCS_HW_TOTAL_DESC="After an approval: the number of scanned tickets of the event (or of the ticket when <code>ticketid</code> was sent)."
COM_TICKETSTATION_SCANNING_DOCS_CHECKS_TITLE="What is checked"
COM_TICKETSTATION_SCANNING_DOCS_CHECKS="For every code, in this order: the scanner is assigned to the requested event or ticket; the code exists; the ticket belongs to the requested event or ticket and to the scanner's own events and tickets; it isn't blacklisted; it hasn't been scanned before; it has been paid. Only then is it marked as scanned, together with the time and the scanner. Checking and marking happen in one database step, so a ticket can never be approved twice, not even when copies of it are scanned at two entrances at the same moment."
COM_TICKETSTATION_SCANNING_DOCS_LINK="Full setup instructions and the scanning API reference"

