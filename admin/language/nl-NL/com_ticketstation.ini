COM_TICKETSTATION_SEATPLANSETTING_MULTISEAT_DESC="Bepaalt bij wie een stoel hoort, en daarmee hoe de prijs wordt bepaald:<br><strong>Ja, zonder subtickets</strong> &mdash; één prijs voor elke stoel.<br><strong>Ja, met subtickets</strong> &mdash; prijs per persoon: elke stoel kan tegen de prijs van elk subticket worden verkocht (bijv. Volwassene / Kind); de klant kiest per stoel.<br><strong>Nee, met subtickets</strong> &mdash; prijs per vak: elke stoel hoort bij één subticket (bijv. Zaal / Balkon) en kost de prijs van dat ticket.<br>Kies dit vóór je stoelen toevoegt: achteraf wisselen verbergt de bestaande stoelen. Zie <a href='index.php?option=com_ticketstation&amp;view=docs#docs-seating' target='blank'>Documentatie &raquo; Seated tickets</a> voor de volledige uitleg."
